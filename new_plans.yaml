              </activeProfiles>

              <servers>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Determine release metadata
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"
            RC_VERSION="${RELEASE_VERSION}-RC"

            {
              echo "CURRENT_VERSION=${CURRENT_VERSION}"
              echo "RELEASE_VERSION=${RELEASE_VERSION}"
              echo "RELEASE_BRANCH=${RELEASE_BRANCH}"
              echo "RC_VERSION=${RC_VERSION}"
            } > .release-context

            echo "Detected version: ${CURRENT_VERSION}"
            echo "Target release branch: ${RELEASE_BRANCH}"
            echo "Target RC version: ${RC_VERSION}"

    - script:
        interpreter: SHELL
        description: Validate release preconditions and cleanup stale branches
        scripts:
          - |
            set -eu
            . ./.release-context
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin +refs/heads/*:refs/remotes/origin/* --prune --tags

            if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
              echo "ERROR: final tag ${RELEASE_VERSION} already exists"
              exit 1
            fi

            ACTIVE_RELEASES=$(git ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{sub("refs/heads/","",$2); print $2}' || true)

            if [ -n "${ACTIVE_RELEASES}" ]; then
              echo "Deleting existing remote release branches to allow jgitflow to proceed:"
              printf '  %s\n' ${ACTIVE_RELEASES}
              for branch in ${ACTIVE_RELEASES}; do
                git push origin --delete "${branch}" || true
              done
            else
              echo "No existing remote release branches"
            fi

            git checkout -B develop origin/develop
            git reset --hard origin/develop

    - script:
        interpreter: SHELL
        description: Prepare SSH environment for JGit/JSch
        scripts:
          - |
            set -eu
            export HOME="${HOME:-/root}"

            mkdir -p "${HOME}/.ssh"
            chmod 700 "${HOME}/.ssh"

            cp /opt/bamboo-keys/bitbucket_ci_jgit "${HOME}/.ssh/id_rsa"
            chmod 600 "${HOME}/.ssh/id_rsa"

            cat > "${HOME}/.ssh/config" <<EOF
            Host bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov
              HostName bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov
              User git
              Port 7999
              IdentityFile ${HOME}/.ssh/id_rsa
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
            EOF
            chmod 600 "${HOME}/.ssh/config"

            ssh-keyscan -p 7999 bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov >> "${HOME}/.ssh/known_hosts" 2>/dev/null || true
            chmod 644 "${HOME}/.ssh/known_hosts"

    - script:
        interpreter: SHELL
        description: Force clean git working tree before jgitflow
        scripts:
          - |
            set -euo pipefail

            git reset --hard HEAD
            git clean -fdx

            echo "=== git status --short ==="
            git status --short || true

            echo "=== untracked files ==="
            git ls-files --others --exclude-standard || true

            if [ -n "$(git status --porcelain=v1)" ]; then
              echo "ERROR: working tree is not clean before jgitflow"
              exit 1
            fi

            echo "Working tree is clean for jgitflow"

    - script:
        interpreter: SHELL
        description: Debug repo state before jgitflow
        scripts:
          - |
            set -euo pipefail
            echo "=== pwd ==="
            pwd
            echo "=== git status --short ==="
            git status --short || true
            echo "=== git status --ignored --short ==="
            git status --ignored --short || true
            echo "=== untracked files ==="
            git ls-files --others --exclude-standard || true
            echo "=== top-level files ==="
            find . -maxdepth 2 | sort

    - script:
        interpreter: SHELL
        description: Start Gitflow release
        scripts:
          - |
            set -eu
            export HOME="${HOME:-/root}"

            git clean -fdx
            git reset --hard HEAD

            /usr/share/maven/bin/mvn -U -B \
              -s "/tmp/settings-artifactory-${bamboo.buildResultKey}.xml" \
              external.atlassian.jgitflow:jgitflow-maven-plugin:release-start \
              -DpushReleases=true \
              -DallowSnapshots=true \
              -DallowUntracked=true \
              -DdefaultOriginUrl="${bamboo.planRepository.repositoryUrl}"

    - script:
        interpreter: SHELL
        description: Convert project version to RC
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate \
              -Dexpression=project.version 2>/dev/null \
              | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RC_VERSION="${CURRENT_VERSION%-SNAPSHOT}-RC"
            RELEASE_BRANCH="release/${CURRENT_VERSION%-SNAPSHOT}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin +refs/heads/*:refs/remotes/origin/* --prune --tags

            if ! git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/${RELEASE_BRANCH}$"; then
              echo "ERROR: expected release branch ${RELEASE_BRANCH} was not created"
              git branch -r
              exit 1
            fi

            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"
            git reset --hard "origin/${RELEASE_BRANCH}"

            /usr/share/maven/bin/mvn -B -U \
              -s "${SETTINGS_FILE}" \
              versions:set \
              -DnewVersion="${RC_VERSION}" \
              -DprocessAllModules=true \
              -DgenerateBackupPoms=false

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            # Stage AFTER versions:set has modified the files
            git add -A

            if ! git diff --cached --quiet; then
              git commit -m "Update project version to ${RC_VERSION}"
              git push origin HEAD:"${RELEASE_BRANCH}"
              echo "RC version committed and pushed: ${RC_VERSION}"
            else
              echo "WARNING: no version changes detected after versions:set"
              git status
              exit 1
            fi

  artifact-subscriptions: []

