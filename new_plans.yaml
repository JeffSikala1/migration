        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version | grep -v '^\[' | tail -1)
            RELEASE_BRANCH="release/${VERSION%-SNAPSHOT}"

            echo "VERSION=${VERSION}" > .release-context
            echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> .release-context

            echo "Version: ${VERSION}"
            echo "Release branch: ${RELEASE_BRANCH}"

    - script:
        interpreter: SHELL
        description: Checkout release branch
        scripts:
          - |
            set -eu
            . ./.release-context

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes'
            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            git fetch origin +refs/heads/*:refs/remotes/origin/* --tags
            git rev-parse --verify "origin/${RELEASE_BRANCH}" >/dev/null 2>&1
            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"

    - script:
        interpreter: SHELL
        description: Fail if RC artifacts already exist
        scripts:
          - |
            set -euo pipefail
            . ./.release-context

            RELEASE_VERSION="${VERSION%-SNAPSHOT}-RC"

            BASE_URL="https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory"
            AUTH="sa_bamboo:${bamboo.artifactory_access_token_secret}"

            AGG_URL="${BASE_URL}/api/storage/conexus-rc-local/gov/gsa/cnxs/ui/ui-aggregator/${RELEASE_VERSION}/ui-aggregator-${RELEASE_VERSION}.pom"
            WAR_URL="${BASE_URL}/api/storage/conexus-rc-local/gov/gsa/cnxs/ui/ui-war/${RELEASE_VERSION}/ui-war-${RELEASE_VERSION}.war"

            AGG_CODE=$(curl -s -u "${AUTH}" -o /dev/null -w "%{http_code}" "${AGG_URL}" || true)
            WAR_CODE=$(curl -s -u "${AUTH}" -o /dev/null -w "%{http_code}" "${WAR_URL}" || true)

            if [ "${AGG_CODE}" = "200" ] || [ "${WAR_CODE}" = "200" ]; then
              echo "ERROR: RC artifacts already exist for ${RELEASE_VERSION} in conexus-rc-local."
              echo "This job is attempting to redeploy an immutable RC version."
              exit 1
            fi

            echo "No existing RC artifacts found for ${RELEASE_VERSION}"

    - script:
        interpreter: SHELL
        description: Angular build
        working-dir: web/src/main/
        scripts:
          - |
            set -euo pipefail

            export NODE_EXTRA_CA_CERTS=/etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.crt

            NEW_NPM_REGISTRY="https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/npm/npm/"
