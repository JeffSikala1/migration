Delete release branch if failed:
  key: DRBIF
  other:
    clean-working-dir: true

  tasks:
    - checkout:
        force-clean-build: true

    - script:
        interpreter: SHELL
        description: Validate SSH keys
        scripts:
          - |
            set -eu
            test -s /opt/bamboo-keys/bitbucket_ci

    - script:
        interpreter: SHELL
        description: Write Maven settings
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            cat > "${SETTINGS_FILE}" <<XML
            <settings>
              <mirrors>
                <mirror>
                  <id>central</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Cleanup on failure
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            if [ "${bamboo.buildFailed}" != "true" ]; then
              echo "Build did not fail, nothing to clean up"
              exit 0
            fi

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1 || true)

            if [ -z "${CURRENT_VERSION}" ]; then
              echo "Could not determine Maven version during cleanup; skipping cleanup"
              exit 0
            fi

            RELEASE_BRANCH="release/${CURRENT_VERSION%-SNAPSHOT}"
            echo "Computed release branch: ${RELEASE_BRANCH}"

            if git ls-remote --exit-code --heads origin "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
              echo "Deleting ${RELEASE_BRANCH}"
              git push origin --delete "${RELEASE_BRANCH}" || true
            else
              echo "No matching release branch found to delete"
            fi

            exit 0

