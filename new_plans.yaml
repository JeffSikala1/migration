            # Verify RC version is on the branch
            RC_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout \
              -s "${SETTINGS_FILE}" help:evaluate \
              -Dexpression=project.version 2>/dev/null \
              | sed '/^\[/d' | grep -v '^$' | tail -1)
            echo "Release branch version: ${RC_VERSION}"
