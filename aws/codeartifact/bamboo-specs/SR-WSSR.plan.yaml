                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Sync develop branch
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U versions:update-parent versions:update-properties
          -DallowSnapshots=true
          -DgenerateBackupPoms=false
          -DincludeProperties=version.ws-client,version.domain,version.conexus-common,version.vendor-emulator,version.webservices,version.common-rest,version.rest
          -s /tmp/settings-artifactory-${bamboo.buildResultKey}.xml
        description: Update dependencies to latest snapshot versions

    - script:
        interpreter: SHELL
        description: Commit updated dependency versions if changed
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            if ! git diff --quiet; then
              git add --all
              git commit -m "updated-parent-and-properties"
              git push origin HEAD:develop
            else
              echo "No dependency updates to commit"
            fi

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U clean deploy
          -Dmaven.repo.local=/tmp/m2-${bamboo.buildResultKey}
          -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-snapshot-local
          -s /tmp/settings-artifactory-${bamboo.buildResultKey}.xml
        description: Maven Deploy to Artifactory snapshot-local

  artifact-subscriptions: []


Delete release branch if failed:
  key: DRBIF
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mount
        scripts:
          - |
            set -eu
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -eu
            SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml

            cat > "${SETTINGS_FILE}" <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Cleanup only if RC deploy never completed
        scripts:
          - |
            #!/usr/bin/env bash
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            if [ "${bamboo.buildFailed}" != "true" ]; then
              echo "Build did not fail, nothing to clean up"
              exit 0
            fi

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "$CURRENT_VERSION" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RC_VERSION="${RELEASE_VERSION}-RC"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"

            echo "Recomputed release branch: ${RELEASE_BRANCH}"
            echo "Computed RC version: ${RC_VERSION}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin

            if ! git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/${RELEASE_BRANCH}$"; then
              echo "No matching release branch found to delete"
              exit 0
            fi

            # Branch-safe cleanup:
            # if the RC deploy already produced the expected primary artifacts,
            # keep the release branch even if a later stage failed.
            BASE_URL="https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-rc-local/gov/gsa/cnxs/ws"
            missing=0

            for rel in \
              "ws-aggregator/${RC_VERSION}/ws-aggregator-${RC_VERSION}.pom" \
              "ws-common/${RC_VERSION}/ws-common-${RC_VERSION}.jar" \
              "ws-api/${RC_VERSION}/ws-api-${RC_VERSION}.jar" \
              "ws-test-support/${RC_VERSION}/ws-test-support-${RC_VERSION}.jar" \
              "ws-core/${RC_VERSION}/ws-core-${RC_VERSION}.jar" \
              "ws-services-order-services-impl/${RC_VERSION}/ws-services-order-services-impl-${RC_VERSION}.jar" \
              "ws-services-health-check/${RC_VERSION}/ws-services-health-check-${RC_VERSION}.jar" \
              "ws-version-war/${RC_VERSION}/ws-version-war-${RC_VERSION}.war" \
              "ws-services-ear/${RC_VERSION}/ws-services-ear-${RC_VERSION}.ear" \
              "ws-integration-api/${RC_VERSION}/ws-integration-api-${RC_VERSION}.jar" \
              "ws-integration-core/${RC_VERSION}/ws-integration-core-${RC_VERSION}.jar" \
              "ws-integration-ear/${RC_VERSION}/ws-integration-ear-${RC_VERSION}.ear"
            do
              url="${BASE_URL}/${rel}"
              if curl -sfL -u "sa_bamboo:${bamboo.artifactory_access_token_secret}" -o /dev/null "${url}"; then
                echo "FOUND: ${rel}"
              else
                echo "MISSING: ${rel}"
                missing=1
              fi
            done

            if [ "${missing}" -eq 0 ]; then
              echo "RC artifacts are present in conexus-rc-local."
              echo "Preserving ${RELEASE_BRANCH} because start release + RC deploy succeeded and a later stage failed."
              exit 0
            fi

            echo "RC artifact set is incomplete."
            echo "Deleting ${RELEASE_BRANCH}"
            git push origin --delete "${RELEASE_BRANCH}" || true

            exit 0

  artifact-subscriptions: []


repositories:
  - WS:
      scope: global

triggers: []

branches:
  create: manually
  delete: never
  link-to-jira: true

notifications: []

labels: []

dependencies:
  require-all-stages-passing: false
