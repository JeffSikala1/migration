---
version: 2
plan:
  project-key: FR
  key: RESTFR
  name: Rest - Finish Release

stages:
  - Promote Release Artifacts:
      manual: false
      final: false
      jobs:
        - Promote Job
  - Finalize Git Release:
      manual: false
      final: false
      jobs:
        - Finalize Job

Promote Job:
  key: JOB1
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        path: ${bamboo.module_name}
        force-clean-build: true
        description: Checkout Default Repository

    - checkout:
        repository: bamboo-deployment
        path: release-scripts
        force-clean-build: true
        description: Checkout release-scripts repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mounts
        scripts:
          - |
            set -euo pipefail
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml

            cat > "${SETTINGS_FILE}" <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Validate exact release branch exists and convert RC back to SNAPSHOT
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            echo "bamboo_skip_release=false" > "${bamboo.build.working.directory}/skip.properties"

            # Discover the highest release branch on remote — never derive from develop
            RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{print $2}' \
              | sed 's|refs/heads/||' \
              | grep '^release/' \
              | sed 's|release/||' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 \
              | sed 's|^|release/|')

            [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
            RELEASE_VERSION="${RELEASE_BRANCH#release/}"

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags >/dev/null 2>&1

            if ! git ls-remote --exit-code --heads origin "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
              TAG_EXISTS=false
              RELEASE_ARTIFACTS_EXIST=false
              found_count=0

              if git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
                TAG_EXISTS=true
              fi

              if [ "${TAG_EXISTS}" = "true" ]; then
                AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "\$or":[
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-aggregator/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/facade/rest-facade/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}"}}
              ]
            }).include("name","repo","path")
            EOF
                )

                RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
                  -H "Content-Type: text/plain" \
                  -X POST \
                  "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
                  --data "${AQL}")

                found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/rest/rest-aggregator/${RELEASE_VERSION}", "rest-aggregator-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}-tests.jar"),
                ("gov/gsa/cnxs/rest/facade/rest-facade/${RELEASE_VERSION}", "rest-facade-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}", "rest-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}", "rest-war-${RELEASE_VERSION}.war"),
                ("gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}", "rest-ear-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}", "rest-ear-${RELEASE_VERSION}.ear"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}-tests.jar"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
                )

                total_expected=12

                if [ "${found_count}" -eq "${total_expected}" ]; then
                  RELEASE_ARTIFACTS_EXIST=true
                fi
              fi

              echo "INFO: tag_exists=${TAG_EXISTS}, branch_exists=false, release_artifacts_found=${found_count:-0}"

              if [ "${TAG_EXISTS}" = "true" ] && [ "${RELEASE_ARTIFACTS_EXIST}" = "true" ]; then
                echo "INFO: release ${RELEASE_VERSION} already finalized based on remote tag + missing release branch + release artifacts present; skipping."
                echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
                exit 0
              fi

              echo "ERROR: expected release branch ${RELEASE_BRANCH} not found"
              exit 1
            fi

            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}" >/dev/null 2>&1

            find . -type f -name "*.xml" -exec sed -i 's/-RC/-SNAPSHOT/g' {} +

            if ! git diff --quiet; then
              git commit -am "Updated versions from release-candidate to snapshot"
              git push origin HEAD:"${RELEASE_BRANCH}"
            else
              echo "No RC versions found to convert back to SNAPSHOT"
            fi

    - inject-variables:
        file: skip.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        description: Install USDA root certificate in system wide trusted certificate location
        scripts:
          - |
            set -euo pipefail
            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            curl -ks "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov:443/artifactory/file-local/certificates/USDA_Enterprise_Root_CA.crt" \
              -o /etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.pem
            update-ca-trust

    - script:
        interpreter: SHELL
        description: Validate release state before promotion
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            # Discover the highest release branch on remote — never derive from develop
            RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{print $2}' \
              | sed 's|refs/heads/||' \
              | grep '^release/' \
              | sed 's|release/||' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 \
              | sed 's|^|release/|')

            [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
            RELEASE_VERSION="${RELEASE_BRANCH#release/}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags >/dev/null 2>&1

            if ! git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | grep -q .; then
              TAG_EXISTS=false
              RELEASE_ARTIFACTS_EXIST=false
              found_count=0

              if git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
                TAG_EXISTS=true
              fi

              if [ "${TAG_EXISTS}" = "true" ]; then
                AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "\$or":[
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-aggregator/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/facade/rest-facade/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}"}}
              ]
            }).include("name","repo","path")
            EOF
                )

                RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
                  -H "Content-Type: text/plain" \
                  -X POST \
                  "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
                  --data "${AQL}")

                found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/rest/rest-aggregator/${RELEASE_VERSION}", "rest-aggregator-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}-tests.jar"),
                ("gov/gsa/cnxs/rest/facade/rest-facade/${RELEASE_VERSION}", "rest-facade-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}", "rest-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}", "rest-war-${RELEASE_VERSION}.war"),
                ("gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}", "rest-ear-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}", "rest-ear-${RELEASE_VERSION}.ear"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}-tests.jar"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
                )

                total_expected=12

                if [ "${found_count}" -eq "${total_expected}" ]; then
                  RELEASE_ARTIFACTS_EXIST=true
                fi
              fi

              echo "INFO: tag_exists=${TAG_EXISTS}, branch_exists=false, release_artifacts_found=${found_count:-0}"

              if [ "${TAG_EXISTS}" = "true" ] && [ "${RELEASE_ARTIFACTS_EXIST}" = "true" ]; then
                echo "INFO: release ${RELEASE_VERSION} already finalized based on remote tag + missing release branch + release artifacts present; skipping."
                echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
                exit 0
              fi

              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist."
              exit 1
            fi

            echo "Release state validation passed."

    - inject-variables:
        file: skip.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        description: Pre-check Rest release artifacts in Artifactory
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            echo "bamboo_skip_release=false" > "${bamboo.build.working.directory}/skip.properties"

            # Discover the highest release branch on remote — never derive from develop
            RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{print $2}' \
              | sed 's|refs/heads/||' \
              | grep '^release/' \
              | sed 's|release/||' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 \
              | sed 's|^|release/|')

            [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
            RELEASE_VERSION="${RELEASE_BRANCH#release/}"

            AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "\$or":[
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-aggregator/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/facade/rest-facade/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}"}}
              ]
            }).include("name","repo","path")
            EOF
            )

            RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -H "Content-Type: text/plain" \
              -X POST \
              "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
              --data "${AQL}")

            echo "${RESULT}" > "${bamboo.build.working.directory}/release-check.json"

            found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/rest/rest-aggregator/${RELEASE_VERSION}", "rest-aggregator-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}-tests.jar"),
                ("gov/gsa/cnxs/rest/facade/rest-facade/${RELEASE_VERSION}", "rest-facade-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}", "rest-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}", "rest-war-${RELEASE_VERSION}.war"),
                ("gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}", "rest-ear-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}", "rest-ear-${RELEASE_VERSION}.ear"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}-tests.jar"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
            )

            total_expected=12

            echo "INFO: found ${found_count} of ${total_expected} expected Rest release artifacts"

            if [ "${found_count}" -eq 0 ]; then
              echo "INFO: no Rest release artifacts found for ${RELEASE_VERSION}; promotion may proceed."
              exit 0
            fi

            if [ "${found_count}" -eq "${total_expected}" ]; then
              echo "INFO: all Rest release artifacts already exist for ${RELEASE_VERSION}; skipping promotion."
              echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
              exit 0
            fi

            echo "ERROR: partial Rest release already exists for ${RELEASE_VERSION}."
            exit 1

    - inject-variables:
        file: skip.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        description: Promote Rest artifacts from RC repo
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release artifacts already exist; skipping promotion."
              exit 0
            fi

            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            # Discover the highest release branch on remote — never derive from develop
            RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{print $2}' \
              | sed 's|refs/heads/||' \
              | grep '^release/' \
              | sed 's|release/||' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 \
              | sed 's|^|release/|')

            [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
            RELEASE_VERSION="${RELEASE_BRANCH#release/}"

            mkdir -p working

            python3 ../release-scripts/promote.py conexus-rc-local gov.gsa.cnxs.rest rest-aggregator "${RELEASE_VERSION}" --username "sa_bamboo" --password "${bamboo.artifactory_access_token_secret}" --settings-xml "${SETTINGS_FILE}" --override
            python3 ../release-scripts/promote.py conexus-rc-local gov.gsa.cnxs.rest.facade facade-api "${RELEASE_VERSION}" --username "sa_bamboo" --password "${bamboo.artifactory_access_token_secret}" --settings-xml "${SETTINGS_FILE}" --override
            python3 ../release-scripts/promote.py conexus-rc-local gov.gsa.cnxs.rest.facade rest-facade "${RELEASE_VERSION}" --username "sa_bamboo" --password "${bamboo.artifactory_access_token_secret}" --settings-xml "${SETTINGS_FILE}" --override
            python3 ../release-scripts/promote.py conexus-rc-local gov.gsa.cnxs.rest rest-war "${RELEASE_VERSION}" --username "sa_bamboo" --password "${bamboo.artifactory_access_token_secret}" --settings-xml "${SETTINGS_FILE}" --override
            python3 ../release-scripts/promote.py conexus-rc-local gov.gsa.cnxs.rest rest-ear "${RELEASE_VERSION}" --username "sa_bamboo" --password "${bamboo.artifactory_access_token_secret}" --settings-xml "${SETTINGS_FILE}" --override
            python3 ../release-scripts/promote.py conexus-rc-local gov.gsa.cnxs.rest.test rest-system-test "${RELEASE_VERSION}" --username "sa_bamboo" --password "${bamboo.artifactory_access_token_secret}" --settings-xml "${SETTINGS_FILE}" --override

  artifact-subscriptions: []

Finalize Job:
  key: JOB2
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        path: ${bamboo.module_name}
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mounts
        scripts:
          - |
            set -euo pipefail
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml

            cat > "${SETTINGS_FILE}" <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Validate release state before finalize
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            echo "bamboo_skip_release=false" > "${bamboo.build.working.directory}/skip.properties"

            # Discover the highest release branch on remote — never derive from develop
            RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{print $2}' \
              | sed 's|refs/heads/||' \
              | grep '^release/' \
              | sed 's|release/||' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 \
              | sed 's|^|release/|')

            [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
            RELEASE_VERSION="${RELEASE_BRANCH#release/}"
            INTEGRATION_BRANCH="${bamboo.integration.branch}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            TAG_EXISTS=false
            INTEGRATION_HAS_TAG=false
            BRANCH_EXISTS=false
            RELEASE_ARTIFACTS_EXIST=false

            if git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
              TAG_EXISTS=true
            fi

            if git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | grep -q "refs/heads/${RELEASE_BRANCH}$"; then
              BRANCH_EXISTS=true
            fi

            if [ "${TAG_EXISTS}" = "true" ]; then
              git tag -d "${RELEASE_VERSION}" >/dev/null 2>&1 || true

              git fetch origin \
                "+refs/heads/${INTEGRATION_BRANCH}:refs/remotes/origin/__validate_integration" \
                "+refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}" \
                >/dev/null 2>&1 || true

              TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_VERSION}" 2>/dev/null || true)"
              INTEGRATION_COMMIT="$(git rev-parse refs/remotes/origin/__validate_integration 2>/dev/null || true)"

              echo "INFO: tag_commit=${TAG_COMMIT:-missing} integration_commit=${INTEGRATION_COMMIT:-missing}"

              if [ -n "${TAG_COMMIT}" ] && [ -n "${INTEGRATION_COMMIT}" ]; then
                if git merge-base --is-ancestor "${TAG_COMMIT}" "refs/remotes/origin/__validate_integration"; then
                  INTEGRATION_HAS_TAG=true
                fi
              fi
            fi

            AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "\$or":[
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-aggregator/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/facade/rest-facade/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}"}}
              ]
            }).include("name","repo","path")
            EOF
            )

            RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -H "Content-Type: text/plain" \
              -X POST \
              "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
              --data "${AQL}")

            found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/rest/rest-aggregator/${RELEASE_VERSION}", "rest-aggregator-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}-tests.jar"),
                ("gov/gsa/cnxs/rest/facade/rest-facade/${RELEASE_VERSION}", "rest-facade-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}", "rest-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}", "rest-war-${RELEASE_VERSION}.war"),
                ("gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}", "rest-ear-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}", "rest-ear-${RELEASE_VERSION}.ear"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}-tests.jar"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
            )

            total_expected=12

            if [ "${found_count}" -eq "${total_expected}" ]; then
              RELEASE_ARTIFACTS_EXIST=true
            fi

            echo "INFO: tag_exists=${TAG_EXISTS}, integration_has_tag=${INTEGRATION_HAS_TAG}, branch_exists=${BRANCH_EXISTS}, release_artifacts_found=${found_count}"

            if [ "${TAG_EXISTS}" = "true" ] && [ "${BRANCH_EXISTS}" = "false" ] && [ "${RELEASE_ARTIFACTS_EXIST}" = "true" ]; then
              echo "INFO: release ${RELEASE_VERSION} already finalized based on remote tag + missing release branch + full release artifacts; skipping."
              echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
              exit 0
            fi

            if [ "${TAG_EXISTS}" = "true" ] && [ "${INTEGRATION_HAS_TAG}" = "true" ] && [ "${BRANCH_EXISTS}" = "true" ] && [ "${RELEASE_ARTIFACTS_EXIST}" = "true" ]; then
              echo "INFO: release ${RELEASE_VERSION} is already finalized; only release-branch cleanup remains."
              echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
              exit 0
            fi

            if [ "${BRANCH_EXISTS}" != "true" ]; then
              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist and release is not proven finalized on ${INTEGRATION_BRANCH}."
              exit 1
            fi

            if ! git ls-remote --heads origin "refs/heads/${INTEGRATION_BRANCH}" | grep -q "refs/heads/${INTEGRATION_BRANCH}$"; then
              echo "ERROR: integration branch ${INTEGRATION_BRANCH} does not exist."
              exit 1
            fi

            echo "Finalize state validation passed."

    - inject-variables:
        file: skip.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        description: Merge release branch to integration branch, set release versions, tag, and push
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            RELEASE_VERSION="${bamboo_inject_bamboo_release_version:-}"
            RELEASE_BRANCH="${bamboo_inject_bamboo_release_branch:-}"
            INTEGRATION_BRANCH="${bamboo_inject_bamboo_integration_branch:-${bamboo.integration.branch}}"
            [ -n "${RELEASE_VERSION}" ] || { echo "ERROR: bamboo_release_version not set"; exit 1; }
            [ -n "${RELEASE_BRANCH}" ]  || { echo "ERROR: bamboo_release_branch not set"; exit 1; }
            RELEASE_TAG="${RELEASE_VERSION}"

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            if ! git ls-remote --exit-code --heads origin "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist. Finish release cannot continue."
              exit 1
            fi

            if ! git ls-remote --exit-code --heads origin "refs/heads/${INTEGRATION_BRANCH}" >/dev/null 2>&1; then
              echo "ERROR: integration branch ${INTEGRATION_BRANCH} does not exist."
              exit 1
            fi

            git fetch origin \
              "+refs/heads/${INTEGRATION_BRANCH}:refs/remotes/origin/${INTEGRATION_BRANCH}" \
              "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" \
              "+refs/tags/*:refs/tags/*" \
              --prune >/dev/null 2>&1

            TAG_EXISTS=false
            TAG_ON_INTEGRATION=false

            if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              TAG_EXISTS=true
              TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}")"
              if git merge-base --is-ancestor "${TAG_COMMIT}" "refs/remotes/origin/${INTEGRATION_BRANCH}"; then
                TAG_ON_INTEGRATION=true
              fi
            fi

            if [ "${TAG_EXISTS}" = "true" ] && [ "${TAG_ON_INTEGRATION}" != "true" ]; then
              echo "ERROR: release tag ${RELEASE_TAG} already exists but is not contained in origin/${INTEGRATION_BRANCH}."
              exit 1
            fi

            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}" >/dev/null 2>&1
            git checkout -B "${INTEGRATION_BRANCH}" "origin/${INTEGRATION_BRANCH}" >/dev/null 2>&1

            git merge -s recursive -X theirs -m "Merge release branch ${RELEASE_BRANCH}" "${RELEASE_BRANCH}"

            find . -type f -name "*.xml" -exec sed -i 's/-SNAPSHOT//g' {} +

            if ! git diff --quiet; then
              git commit -am "Release Versions"
            else
              echo "No SNAPSHOT versions found to remove before tagging"
            fi

            if [ "${TAG_EXISTS}" = "false" ]; then
              git tag "${RELEASE_TAG}"
            fi

            git push origin "${INTEGRATION_BRANCH}"

            if [ "${TAG_EXISTS}" = "false" ]; then
              git push origin "refs/tags/${RELEASE_TAG}"
            fi

    - inject-variables:
        file: skip.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        description: Bump develop to next SNAPSHOT version after release
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            # Discover the highest release branch on remote
            RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{print $2}' \
              | sed 's|refs/heads/||' \
              | grep '^release/' \
              | sed 's|release/||' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 \
              | sed 's|^|release/|')

            [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
            RELEASE_VERSION="${RELEASE_BRANCH#release/}"

            # Increment the last version segment by 1
            NEXT_VERSION=$(echo "${RELEASE_VERSION}" | awk -F. '{OFS="."; $NF=$NF+1; print}')
            NEXT_SNAPSHOT="${NEXT_VERSION}-SNAPSHOT"

            echo "INFO: Bumping ${bamboo.integration.branch} from ${RELEASE_VERSION} to ${NEXT_SNAPSHOT}"

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags --quiet
            git checkout -B "${bamboo.integration.branch}" "origin/${bamboo.integration.branch}"

            find . -type f -name "pom.xml" -exec sed -i "s|<version>${RELEASE_VERSION}</version>|<version>${NEXT_SNAPSHOT}</version>|g" {} +

            if ! git diff --quiet; then
              git commit -am "Bump to next development version ${NEXT_SNAPSHOT}"
              git push origin "${bamboo.integration.branch}"
            else
              echo "WARNING: No version strings matched ${RELEASE_VERSION} in pom.xml files — verify manually"
            fi

    - script:
        interpreter: SHELL
        description: Delete release branch after successful finish
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            RELEASE_VERSION="${bamboo_inject_bamboo_release_version:-}"
            RELEASE_BRANCH="${bamboo_inject_bamboo_release_branch:-}"
            INTEGRATION_BRANCH="${bamboo_inject_bamboo_integration_branch:-${bamboo.integration.branch}}"
            [ -n "${RELEASE_VERSION}" ] || { echo "ERROR: bamboo_release_version not set"; exit 1; }
            [ -n "${RELEASE_BRANCH}" ]  || { echo "ERROR: bamboo_release_branch not set"; exit 1; }

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            TAG_EXISTS=false
            BRANCH_EXISTS=false
            RELEASE_ARTIFACTS_EXIST=false
            INTEGRATION_HAS_TAG=false
            found_count=0

            if git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
              TAG_EXISTS=true
            fi

            if git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | grep -q "refs/heads/${RELEASE_BRANCH}$"; then
              BRANCH_EXISTS=true
            fi

            AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "\$or":[
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-aggregator/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/facade/rest-facade/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}"}}
              ]
            }).include("name","repo","path")
            EOF
            )

            RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -H "Content-Type: text/plain" \
              -X POST \
              "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
              --data "${AQL}")

            found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/rest/rest-aggregator/${RELEASE_VERSION}", "rest-aggregator-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/rest/facade/facade-api/${RELEASE_VERSION}", "facade-api-${RELEASE_VERSION}-tests.jar"),
                ("gov/gsa/cnxs/rest/facade/rest-facade/${RELEASE_VERSION}", "rest-facade-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}", "rest-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-war/${RELEASE_VERSION}", "rest-war-${RELEASE_VERSION}.war"),
                ("gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}", "rest-ear-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/rest-ear/${RELEASE_VERSION}", "rest-ear-${RELEASE_VERSION}.ear"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/rest/test/rest-system-test/${RELEASE_VERSION}", "rest-system-test-${RELEASE_VERSION}-tests.jar"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
            )

            total_expected=12

            if [ "${found_count}" -eq "${total_expected}" ]; then
              RELEASE_ARTIFACTS_EXIST=true
            fi

            if [ "${TAG_EXISTS}" = "true" ]; then
              git tag -d "${RELEASE_VERSION}" >/dev/null 2>&1 || true

              git fetch origin \
                "+refs/heads/${INTEGRATION_BRANCH}:refs/remotes/origin/__validate_integration" \
                "+refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}" \
                >/dev/null 2>&1 || true

              TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_VERSION}" 2>/dev/null || true)"
              INTEGRATION_COMMIT="$(git rev-parse refs/remotes/origin/__validate_integration 2>/dev/null || true)"

              echo "INFO: tag_commit=${TAG_COMMIT:-missing} integration_commit=${INTEGRATION_COMMIT:-missing}"

              if [ -n "${TAG_COMMIT}" ] && [ -n "${INTEGRATION_COMMIT}" ]; then
                if git merge-base --is-ancestor "${TAG_COMMIT}" refs/remotes/origin/__validate_integration; then
                  INTEGRATION_HAS_TAG=true
                fi
              fi
            fi

            echo "INFO: tag_exists=${TAG_EXISTS}, integration_has_tag=${INTEGRATION_HAS_TAG}, branch_exists=${BRANCH_EXISTS}, release_artifacts_found=${found_count}"

            if [ "${TAG_EXISTS}" != "true" ]; then
              echo "ERROR: release tag ${RELEASE_VERSION} does not exist in remote; refusing cleanup."
              exit 1
            fi

            if [ "${RELEASE_ARTIFACTS_EXIST}" != "true" ]; then
              echo "ERROR: release artifacts for ${RELEASE_VERSION} not found in release repo; refusing cleanup."
              exit 1
            fi

            if [ "${BRANCH_EXISTS}" != "true" ]; then
              echo "INFO: release branch ${RELEASE_BRANCH} already absent; release is finalized."
              exit 0
            fi

            if [ "${INTEGRATION_HAS_TAG}" = "true" ]; then
              echo "INFO: final-state signals confirmed; attempting to delete remote release branch ${RELEASE_BRANCH}"
            else
              echo "WARNING: could not re-prove ancestry, but remote tag and full release artifacts already exist."
              echo "WARNING: treating release as finalized and attempting best-effort cleanup for ${RELEASE_BRANCH}"
            fi

            delete_output="$(git push origin --delete "${RELEASE_BRANCH}" 2>&1)" && delete_rc=0 || delete_rc=$?
            echo "${delete_output}"

            if [ "${delete_rc}" -eq 0 ]; then
              echo "INFO: deleted remote release branch ${RELEASE_BRANCH}"
              exit 0
            fi

            if echo "${delete_output}" | grep -Eqi 'remote ref does not exist|unable to delete|not found|could not remove|cannot lock ref'; then
              echo "WARNING: remote release branch ${RELEASE_BRANCH} was not deletable or no longer exists."
              echo "WARNING: release remains finalized based on remote tag + release artifacts."
              exit 0
            fi

            echo "WARNING: failed to delete remote release branch ${RELEASE_BRANCH}"
            echo "WARNING: release remains finalized based on remote tag + release artifacts."
            exit 0

