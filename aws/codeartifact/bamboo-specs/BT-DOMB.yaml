---
version: 2
plan:
  project-key: BT
  key: DOMB
  name: Domain - Build

stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Default Job

Default Job:
  key: JOB1
  other:
    clean-working-dir: true
    all-other-apps:
      custom:
        auto: {}
        buildHangingConfig.enabled: "false"

  tasks:
    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - checkout:
        repository: bamboo-deployment
        path: bamboo-deployment
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: BINSH_OR_CMDEXE
        scripts:
          - "#rm -rf ~/.m2/repository/gov/gsa/cnxs/\n#Bas: made below change; this only deletes snapshot folders so we don't download\n# the big released datafile artifact each time.\ndirName=~/.m2/repository/gov/gsa/cnxs/\nif [ -d \"$dirName\" ]; then\n\techo \"Removing snapshot folders from $dirName\"\n    find \"$dirName\" -type d -name '*SNAPSHOT' -exec rm -rf {} +\nfi"
        description: Remove existing cnxs maven repo directory

    - script:
        interpreter: SHELL
        file: bamboo-deployment/build-determination-migration.sh
        description: Determine parent branch and pass correct variables

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject
        description: Inject values

    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.bamboo-variable-inject-plugin:dump
        configuration: {}

    - script:
        interpreter: SHELL
        scripts:
          - |-
            cat > settings-artifactory.xml <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>${bamboo.inject.pluginRepositoryUrl}</url>
                </mirror>
              </mirrors>

              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>${bamboo.inject.pluginRepositoryUrl}</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>${bamboo.inject.pluginRepositoryUrl}</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>

              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>

              <servers>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML
        description: Write Artifactory Maven settings

    - script:
        interpreter: SHELL
        scripts:
          - |-
            /usr/share/maven/bin/mvn -s settings-artifactory.xml \
              clean verify -B -U -P integration-test \
              -Dbamboo.inject.BranchName=${bamboo.inject.BranchName} \
              -Dbamboo.inject.mavenFeatureRepositoryUrl=${bamboo.inject.mavenFeatureRepositoryUrl} \
              -Dbamboo.inject.pluginRepositoryUrl=${bamboo.inject.pluginRepositoryUrl} \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        description: Common Build and Verify

    - test-parser:
        type: junit
        ignore-time: false
        test-results: domain/target/surefire-reports
        description: domain surefire reports

    - script:
        interpreter: SHELL
        file: bamboo-deployment/deploy-to-artifactory-skip-bamboo-version-migrate.sh
        description: Determine if deploy to Artifactory is needed

    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.bamboo-variable-inject-plugin:dump
        configuration: {}

  artifacts:
    - name: Jboss Log
      location: integration/integration-test/target/
      pattern: jboss.log
      shared: false
      required: false

    - name: Oracle Log
      location: integration/integration-test/target/
      pattern: oracle.log
      shared: false
      required: false

  artifact-subscriptions: []

repositories:
  - Domain:
      scope: global
  - bamboo-deployment:
      scope: global

triggers:
  - bitbucket-server-trigger:
      repositories:
        - Domain

branches:
  create: for-new-branch
  delete:
    after-deleted-days: 30
    after-inactive-days: 200
  link-to-jira: true

notifications:
  - events:
      - plan-failed
    recipients:
      - responsible
      - committers

  - events:
      - plan-completed
    recipients:
      - watchers

  - events:
      - plan-failed
    recipients:
      - responsible
      - committers

labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: block_if_parent_in_progress
  plans:
    - BT-COMRST
    - BT-WEBSV
    - BT-CON
    - BT-VE
    - BT-TASK
    - BT-PRIC
