---
version: 2
plan:
  project-key: FR
  key: ENVFR
  name: Env - Finish Release

stages:
  - Promote Release Artifacts:
      manual: false
      final: false
      jobs:
        - Promote Job
  - Finalize Git Release:
      manual: false
      final: false
      jobs:
        - Finalize Job

Promote Job:
  key: JOB1
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        path: ${bamboo.module_name}
        force-clean-build: true
        description: Checkout Default Repository

    - checkout:
        repository: bamboo-deployment
        path: release-scripts
        force-clean-build: true
        description: Checkout release-scripts repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mounts
        scripts:
          - |
            set -euo pipefail
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }
            ls -l /opt/bamboo-keys/bitbucket_ci*

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml

            cat > "${SETTINGS_FILE}" <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Determine Maven version and exact release branch
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"

            echo "Detected version: ${CURRENT_VERSION}"
            echo "Exact release branch: ${RELEASE_BRANCH}"

    - script:
        interpreter: SHELL
        description: Validate exact release branch exists and convert RC back to SNAPSHOT
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags

            if ! git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/${RELEASE_BRANCH}$"; then
              if git ls-remote --tags origin | grep -q "refs/tags/${RELEASE_VERSION}$"; then
                echo "ERROR: release branch ${RELEASE_BRANCH} is already deleted and tag ${RELEASE_VERSION} already exists."
                echo "This usually means finish release already completed for this version."
              else
                echo "ERROR: expected release branch ${RELEASE_BRANCH} not found"
              fi
              exit 1
            fi

            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"

            find . -type f -name "pom.xml" -exec sed -i 's/-RC/-SNAPSHOT/g' {} +

            if ! git diff --quiet; then
              git commit -am "Updated versions from release-candidate to snapshot"
              git push origin HEAD:"${RELEASE_BRANCH}"
            else
              echo "No RC versions found to convert back to SNAPSHOT"
            fi

    - script:
        interpreter: SHELL
        description: Install USDA root certificate in system wide trusted certificate location
        scripts:
          - |
            set -euo pipefail
            curl -k "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov:443/artifactory/file-local/certificates/USDA_Enterprise_Root_CA.crt" -o /etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.pem
            update-ca-trust

    - script:
        interpreter: SHELL
        description: Validate release state before promotion
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags

            if git ls-remote --tags origin | grep -q "refs/tags/${RELEASE_VERSION}$"; then
              echo "ERROR: release tag ${RELEASE_VERSION} already exists."
              echo "This suggests finish release may already have been completed."
              exit 1
            fi

            if ! git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/${RELEASE_BRANCH}$"; then
              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist."
              exit 1
            fi

            echo "Release state validation passed."

    - script:
        interpreter: SHELL
        description: Promote artifacts from RC repo
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"

            mkdir -p working

            echo "Using promote.py from:"
            realpath ../release-scripts/promote.py

            echo "Server default inside script:"
            grep -i server ../release-scripts/promote.py

            python3 ../release-scripts/promote.py \
              conexus-rc-local \
              gov.gsa.cnxs \
              bom \
              "${RELEASE_VERSION}" \
              --username "sa_bamboo" \
              --password "${bamboo.artifactory_access_token_secret}" \
              --settings-xml "${SETTINGS_FILE}"

            python3 ../release-scripts/promote.py \
              conexus-rc-local \
              gov.gsa.cnxs.bom \
              env-base \
              "${RELEASE_VERSION}" \
              --username "sa_bamboo" \
              --password "${bamboo.artifactory_access_token_secret}" \
              --settings-xml "${SETTINGS_FILE}"

  artifact-subscriptions: []

Finalize Job:
  key: JOB2
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        path: ${bamboo.module_name}
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mounts
        scripts:
          - |
            set -euo pipefail
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }
            ls -l /opt/bamboo-keys/bitbucket_ci*

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml

            cat > "${SETTINGS_FILE}" <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Validate release state before finalize
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags

            if ! git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/${RELEASE_BRANCH}$"; then
              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist. Finalize cannot continue."
              exit 1
            fi

            if git ls-remote --tags origin | grep -q "refs/tags/${RELEASE_VERSION}$"; then
              echo "ERROR: release tag ${RELEASE_VERSION} already exists. Finalize cannot continue."
              exit 1
            fi

            echo "Finalize state validation passed."

    - script:
        interpreter: SHELL
        description: Merge release branch to main, set release versions, tag, and push
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"
            RELEASE_TAG="${RELEASE_VERSION}"

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags

            if ! git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/${RELEASE_BRANCH}$"; then
              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist. Finish release cannot continue."
              exit 1
            fi

            if git ls-remote --tags origin | grep -q "refs/tags/${RELEASE_TAG}$"; then
              echo "ERROR: release tag ${RELEASE_TAG} already exists. This release may already have been finished."
              exit 1
            fi

            if ! git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/main$"; then
              echo "ERROR: origin/main not found"
              git branch -r
              exit 1
            fi

            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"
            git checkout -B main origin/main

            git merge -s recursive -X theirs -m "Merge release branch ${RELEASE_BRANCH}" "${RELEASE_BRANCH}"

            find . -type f -name "pom.xml" -exec sed -i 's/-SNAPSHOT//g' {} +

            if ! git diff --quiet; then
              git commit -am "Release Versions"
            else
              echo "No SNAPSHOT versions found to remove before tagging"
            fi

            git tag "${RELEASE_TAG}"

            git push origin main
            git push origin "refs/tags/${RELEASE_TAG}"

    - script:
        interpreter: SHELL
        description: Delete release branch after successful finish
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags

            if ! git ls-remote --tags origin | grep -q "refs/tags/${RELEASE_VERSION}$"; then
              echo "ERROR: release tag ${RELEASE_VERSION} does not exist; refusing to delete release branch."
              exit 1
            fi

            if git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/${RELEASE_BRANCH}$"; then
              echo "Deleting remote release branch ${RELEASE_BRANCH}"
              git push origin --delete "${RELEASE_BRANCH}"
            else
              echo "Release branch ${RELEASE_BRANCH} already absent"
            fi

  artifact-subscriptions: []

variables:
  maven.artifactId: env-base
  maven.groupId: gov.gsa.cnxs.bom
  module_name: env

repositories:
  - Env:
      scope: global
  - bamboo-deployment:
      scope: global

triggers: []

branches:
  create: manually
  delete: never
  link-to-jira: true

notifications: []

labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []
