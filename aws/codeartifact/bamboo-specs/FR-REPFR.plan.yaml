---
version: 2
plan:
  project-key: FR
  key: REPFR
  name: Reporting - Finish Release
stages:
- Default Stage:
    manual: false
    final: false
    jobs:
    - Default Job
Default Job:
  key: JOB1
  other:
    clean-working-dir: true
  tasks:
  - clean
  - checkout:
      repository: Reporting
      path: ${bamboo.module_name}
      force-clean-build: true
      description: Checkout Reporting repository
  - checkout:
      repository: bamboo-deployment
      path: release-scripts
      force-clean-build: true
      description: Checkout release-scripts repository
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }
      description: Validate SSH key mounts
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml

        cat > "${SETTINGS_FILE}" <<XML
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/maven-settings-1.0.0.xsd">
          <mirrors>
            <mirror>
              <id>artifactory</id>
              <mirrorOf>*</mirrorOf>
              <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
            </mirror>
          </mirrors>
          <profiles>
            <profile>
              <id>use-artifactory</id>
              <repositories>
                <repository>
                  <id>artifactory</id>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>artifactory</id>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>use-artifactory</activeProfile>
          </activeProfiles>
          <servers>
            <server>
              <id>central</id>
              <username>sa_bamboo</username>
              <password>${bamboo.artifactory_access_token_secret}</password>
            </server>
            <server>
              <id>artifactory</id>
              <username>sa_bamboo</username>
              <password>${bamboo.artifactory_access_token_secret}</password>
            </server>
          </servers>
        </settings>
        XML
      description: Write Maven settings for current Artifactory
  - script:
      interpreter: SHELL
      scripts:
      - |
        #!/usr/bin/env bash
        set -euo pipefail

        git remote set-url origin ${bamboo.planRepository.repositoryUrl}
        git pull

        source ../release-scripts/get-release-branch.sh

        echo "Checking out ${RELEASE_BRANCH}"
        git checkout "${RELEASE_BRANCH}"

        find . -type f -name "*.xml" -exec sed -i 's/-RC/-SNAPSHOT/g' {} +
        git commit -a -m "Updated versions from release-candidate to snapshot"
        git push --set-upstream origin "${RELEASE_BRANCH}"
      environment: GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
      working-dir: ${bamboo.module_name}
      description: Release script
  - script:
      interpreter: SHELL
      scripts:
      - |
        #!/usr/bin/env bash
        set -euo pipefail
        curl -ks "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov:443/artifactory/file-local/certificates/USDA_Enterprise_Root_CA.crt" \
          -o /etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.pem
        update-ca-trust
      description: Install USDA root certificate in system wide trusted certificate location
  - script:
      interpreter: SHELL
      scripts:
      - |
        #!/usr/bin/env bash
        set -euo pipefail
        SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

        source ../release-scripts/get-release-branch.sh

        mkdir -p working

        for coord in \
          "gov.gsa.cnxs.reporting:reporting-aggregator" \
          "gov.gsa.cnxs.reporting:reporting-core" \
          "gov.gsa.cnxs.reporting:reporting-war" \
          "gov.gsa.cnxs.reporting.test:reporting-integration-test"; do
          groupId="${coord%%:*}"
          artifactId="${coord##*:}"
          python3 ../release-scripts/promote.py \
            conexus-rc-local \
            "${groupId}" \
            "${artifactId}" \
            "${RELEASE_VERSION}" \
            --username "sa_bamboo" \
            --password "${bamboo.artifactory_access_token_secret}" \
            --settings-xml "${SETTINGS_FILE}" \
            --override
        done
      working-dir: ${bamboo.module_name}
      description: Promote Artifacts
  - script:
      interpreter: SHELL
      scripts:
      - |
        #!/usr/bin/env bash
        set -euo pipefail

        git remote set-url origin ${bamboo.planRepository.repositoryUrl}
        git pull

        source ../release-scripts/get-release-branch.sh

        echo "Checking out ${RELEASE_BRANCH}"
        git checkout "${RELEASE_BRANCH}"

        git checkout main
        git merge -s recursive -X theirs -m "Merge Release Branch" "${RELEASE_BRANCH}"
        git tag "${RELEASE_VERSION}"
        find . -type f -name "*.xml" -exec sed -i 's/-SNAPSHOT//g' {} +
        git commit -a -m "Release Versions"
        git push --set-upstream origin main
        git push origin "refs/tags/${RELEASE_VERSION}"
      environment: GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
      working-dir: ${bamboo.module_name}
      description: Merge Release branch
  artifact-subscriptions: []
variables:
  module_name: reporting
  maven.artifactId: reporting-aggregator
  maven.groupId: gov.gsa.cnxs.reporting
repositories:
- Reporting:
    scope: global
- bamboo-deployment:
    scope: global
triggers: []
branches:
  create: manually
  delete: never
  link-to-jira: true
notifications: []
labels: []
dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []
other:
  concurrent-build-plugin:
    number-of-concurrent-builds: system-default
    execution-strategy: block-triggering
  force-stop-build: true