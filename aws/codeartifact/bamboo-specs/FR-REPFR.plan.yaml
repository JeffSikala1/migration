---
version: 2
plan:
  project-key: FR
  key: REPFR
  name: Reporting - Finish Release

stages:
  - Promote Release Artifacts:
      manual: false
      final: false
      jobs:
        - Promote Job
  - Finalize Git Release:
      manual: false
      final: false
      jobs:
        - Finalize Job

Promote Job:
  key: JOB1
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        repository: Reporting
        path: reporting
        force-clean-build: true
        description: Checkout Reporting repository

    - checkout:
        repository: bamboo-deployment
        path: release-scripts
        force-clean-build: true
        description: Checkout release-scripts repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mounts
        scripts:
          - |
            set -euo pipefail
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml

            cat > "${SETTINGS_FILE}" <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Validate exact release branch exists and convert RC back to SNAPSHOT
        working-dir: reporting
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            echo "bamboo_skip_release=false" > "${bamboo.build.working.directory}/skip.properties"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"
            REPO_URL="${bamboo.repo_url}"

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            echo "INFO: using git remote ${REPO_URL}"

            git fetch "${REPO_URL}" --prune --tags >/dev/null 2>&1 || true

            if ! git ls-remote --exit-code --heads "${REPO_URL}" "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
              TAG_EXISTS=false
              RELEASE_ARTIFACTS_EXIST=false
              found_count=0
              total_expected=9

              if git ls-remote --tags "${REPO_URL}" "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
                TAG_EXISTS=true
              fi

              if [ "${TAG_EXISTS}" = "true" ]; then
                AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "\$or":[
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-aggregator/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}"}}
              ]
            }).include("name","repo","path")
            EOF
                )

                RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
                  -H "Content-Type: text/plain" \
                  -X POST \
                  "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
                  --data "${AQL}")

                found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/reporting/reporting-aggregator/${RELEASE_VERSION}", "reporting-aggregator-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}-tests.jar"),
                ("gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}", "reporting-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}", "reporting-war-${RELEASE_VERSION}.war"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}-tests.jar"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
                )

                if [ "${found_count}" -eq "${total_expected}" ]; then
                  RELEASE_ARTIFACTS_EXIST=true
                fi
              fi

              echo "INFO: tag_exists=${TAG_EXISTS}, branch_exists=false, release_artifacts_found=${found_count:-0}"

              if [ "${TAG_EXISTS}" = "true" ] && [ "${RELEASE_ARTIFACTS_EXIST}" = "true" ]; then
                echo "INFO: release ${RELEASE_VERSION} already finalized based on remote tag + missing release branch + release artifacts present; skipping."
                echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
                exit 0
              fi

              echo "ERROR: expected release branch ${RELEASE_BRANCH} not found"
              exit 1
            fi

            git fetch "${REPO_URL}" \
              "+refs/heads/${RELEASE_BRANCH}:refs/remotes/validate/${RELEASE_BRANCH}" \
              --prune >/dev/null 2>&1

            git checkout -B "${RELEASE_BRANCH}" "refs/remotes/validate/${RELEASE_BRANCH}" >/dev/null 2>&1

            find . -type f -name "*.xml" -exec sed -i 's/-RC/-SNAPSHOT/g' {} +

            if ! git diff --quiet; then
              git commit -am "Updated versions from release-candidate to snapshot"
              git push "${REPO_URL}" HEAD:"${RELEASE_BRANCH}"
            else
              echo "No RC versions found to convert back to SNAPSHOT"
            fi

    - inject-variables:
        file: skip.properties
        scope: LOCAL

    - script:
        interpreter: SHELL
        description: Install USDA root certificate in system wide trusted certificate location
        scripts:
          - |
            set -euo pipefail
            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            curl -ks "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov:443/artifactory/file-local/certificates/USDA_Enterprise_Root_CA.crt" \
              -o /etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.pem
            update-ca-trust

    - script:
        interpreter: SHELL
        description: Validate release state before promotion
        working-dir: reporting
        scripts:
          - |
            set -euo pipefail
            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"
            REPO_URL="${bamboo.repo_url}"

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git fetch "${REPO_URL}" --prune --tags >/dev/null 2>&1 || true

            if ! git ls-remote --exit-code --heads "${REPO_URL}" "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
              TAG_EXISTS=false
              RELEASE_ARTIFACTS_EXIST=false
              found_count=0
              total_expected=9

              if git ls-remote --tags "${REPO_URL}" "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
                TAG_EXISTS=true
              fi

              if [ "${TAG_EXISTS}" = "true" ]; then
                AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "\$or":[
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-aggregator/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}"}}
              ]
            }).include("name","repo","path")
            EOF
                )

                RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
                  -H "Content-Type: text/plain" \
                  -X POST \
                  "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
                  --data "${AQL}")

                found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/reporting/reporting-aggregator/${RELEASE_VERSION}", "reporting-aggregator-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}-tests.jar"),
                ("gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}", "reporting-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}", "reporting-war-${RELEASE_VERSION}.war"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}-tests.jar"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
                )

                if [ "${found_count}" -eq "${total_expected}" ]; then
                  RELEASE_ARTIFACTS_EXIST=true
                fi
              fi

              echo "INFO: tag_exists=${TAG_EXISTS}, branch_exists=false, release_artifacts_found=${found_count:-0}"

              if [ "${TAG_EXISTS}" = "true" ] && [ "${RELEASE_ARTIFACTS_EXIST}" = "true" ]; then
                echo "INFO: release ${RELEASE_VERSION} already finalized based on remote tag + missing release branch + release artifacts present; skipping."
                echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
                exit 0
              fi

              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist."
              exit 1
            fi

            echo "Release state validation passed."

    - inject-variables:
        file: skip.properties
        scope: LOCAL

    - script:
        interpreter: SHELL
        description: Pre-check Reporting release artifacts in Artifactory
        working-dir: reporting
        scripts:
          - |
            set -euo pipefail

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            echo "bamboo_skip_release=false" > "${bamboo.build.working.directory}/skip.properties"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"

            AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "\$or":[
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-aggregator/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}"}}
              ]
            }).include("name","repo","path")
            EOF
            )

            RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -H "Content-Type: text/plain" \
              -X POST \
              "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
              --data "${AQL}")

            found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/reporting/reporting-aggregator/${RELEASE_VERSION}", "reporting-aggregator-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}-tests.jar"),
                ("gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}", "reporting-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}", "reporting-war-${RELEASE_VERSION}.war"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}-tests.jar"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
            )

            total_expected=9

            echo "INFO: found ${found_count} of ${total_expected} expected Reporting release artifacts"

            if [ "${found_count}" -eq 0 ]; then
              echo "INFO: no Reporting release artifacts found for ${RELEASE_VERSION}; promotion may proceed."
              exit 0
            fi

            if [ "${found_count}" -eq "${total_expected}" ]; then
              echo "INFO: all Reporting release artifacts already exist for ${RELEASE_VERSION}; skipping promotion."
              echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
              exit 0
            fi

            echo "ERROR: partial Reporting release already exists for ${RELEASE_VERSION}."
            exit 1

    - inject-variables:
        file: skip.properties
        scope: LOCAL

    - script:
        interpreter: SHELL
        description: Promote Reporting artifacts from RC repo
        working-dir: reporting
        scripts:
          - |
            set -euo pipefail

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release artifacts already exist; skipping promotion."
              exit 0
            fi

            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"

            mkdir -p working

            python3 ../release-scripts/promote.py conexus-rc-local gov.gsa.cnxs.reporting reporting-aggregator "${RELEASE_VERSION}" --username "sa_bamboo" --password "${bamboo.artifactory_access_token_secret}" --settings-xml "${SETTINGS_FILE}" --override
            python3 ../release-scripts/promote.py conexus-rc-local gov.gsa.cnxs.reporting reporting-core "${RELEASE_VERSION}" --username "sa_bamboo" --password "${bamboo.artifactory_access_token_secret}" --settings-xml "${SETTINGS_FILE}" --override
            python3 ../release-scripts/promote.py conexus-rc-local gov.gsa.cnxs.reporting reporting-war "${RELEASE_VERSION}" --username "sa_bamboo" --password "${bamboo.artifactory_access_token_secret}" --settings-xml "${SETTINGS_FILE}" --override
            python3 ../release-scripts/promote.py conexus-rc-local gov.gsa.cnxs.reporting.test reporting-integration-test "${RELEASE_VERSION}" --username "sa_bamboo" --password "${bamboo.artifactory_access_token_secret}" --settings-xml "${SETTINGS_FILE}" --override

  artifact-subscriptions: []

Finalize Job:
  key: JOB2
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        repository: Reporting
        path: reporting
        force-clean-build: true
        description: Checkout Reporting repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mounts
        scripts:
          - |
            set -euo pipefail
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml

            cat > "${SETTINGS_FILE}" <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Validate release state before finalize
        working-dir: reporting
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            echo "bamboo_skip_release=false" > "${bamboo.build.working.directory}/skip.properties"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"
            INTEGRATION_BRANCH="${bamboo.integration.branch}"
            REPO_URL="${bamboo.repo_url}"
            VALIDATE_INTEGRATION_REF="refs/remotes/validate_integration"

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            TAG_EXISTS=false
            INTEGRATION_HAS_TAG=false
            BRANCH_EXISTS=false
            RELEASE_ARTIFACTS_EXIST=false
            total_expected=9

            if git ls-remote --tags "${REPO_URL}" "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
              TAG_EXISTS=true
            fi

            if git ls-remote --heads "${REPO_URL}" "refs/heads/${RELEASE_BRANCH}" | grep -q "refs/heads/${RELEASE_BRANCH}$"; then
              BRANCH_EXISTS=true
            fi

            if [ "${TAG_EXISTS}" = "true" ]; then
              git tag -d "${RELEASE_VERSION}" >/dev/null 2>&1 || true

              git fetch "${REPO_URL}" \
                "+refs/heads/${INTEGRATION_BRANCH}:${VALIDATE_INTEGRATION_REF}" \
                "+refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}" \
                --prune

              TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_VERSION}" 2>/dev/null || true)"
              INTEGRATION_COMMIT="$(git rev-parse "${VALIDATE_INTEGRATION_REF}" 2>/dev/null || true)"

              echo "INFO: tag_commit=${TAG_COMMIT:-missing} integration_commit=${INTEGRATION_COMMIT:-missing}"

              if [ -n "${TAG_COMMIT}" ] && [ -n "${INTEGRATION_COMMIT}" ]; then
                if git merge-base --is-ancestor "${TAG_COMMIT}" "${VALIDATE_INTEGRATION_REF}"; then
                  INTEGRATION_HAS_TAG=true
                fi
              fi
            fi

            AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "\$or":[
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-aggregator/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}"}}
              ]
            }).include("name","repo","path")
            EOF
            )

            RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -H "Content-Type: text/plain" \
              -X POST \
              "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
              --data "${AQL}")

            found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/reporting/reporting-aggregator/${RELEASE_VERSION}", "reporting-aggregator-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}-tests.jar"),
                ("gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}", "reporting-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}", "reporting-war-${RELEASE_VERSION}.war"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}-tests.jar"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
            )

            if [ "${found_count}" -eq "${total_expected}" ]; then
              RELEASE_ARTIFACTS_EXIST=true
            fi

            echo "INFO: tag_exists=${TAG_EXISTS}, integration_has_tag=${INTEGRATION_HAS_TAG}, branch_exists=${BRANCH_EXISTS}, release_artifacts_found=${found_count}"

            if [ "${TAG_EXISTS}" = "true" ] && [ "${INTEGRATION_HAS_TAG}" = "true" ] && [ "${BRANCH_EXISTS}" = "false" ]; then
              echo "INFO: release ${RELEASE_VERSION} already fully finalized; skipping."
              echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
              exit 0
            fi

            if [ "${TAG_EXISTS}" = "true" ] && [ "${BRANCH_EXISTS}" = "false" ] && [ "${RELEASE_ARTIFACTS_EXIST}" = "true" ]; then
              echo "INFO: release ${RELEASE_VERSION} appears already finalized based on remote tag + missing release branch + release artifacts present; skipping."
              echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
              exit 0
            fi

            if [ "${BRANCH_EXISTS}" != "true" ]; then
              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist and release is not proven finalized on ${INTEGRATION_BRANCH}."
              exit 1
            fi

            if ! git ls-remote --heads "${REPO_URL}" "refs/heads/${INTEGRATION_BRANCH}" | grep -q "refs/heads/${INTEGRATION_BRANCH}$"; then
              echo "ERROR: integration branch ${INTEGRATION_BRANCH} does not exist."
              exit 1
            fi

            echo "Finalize state validation passed."

    - inject-variables:
        file: skip.properties
        scope: LOCAL

    - script:
        interpreter: SHELL
        description: Merge release branch to integration branch, set release versions, tag, and push
        working-dir: reporting
        scripts:
          - |
            set -euo pipefail
            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"
            RELEASE_TAG="${RELEASE_VERSION}"
            INTEGRATION_BRANCH="${bamboo.integration.branch}"
            REPO_URL="${bamboo.repo_url}"
            VALIDATE_RELEASE_REF="refs/remotes/validate_release"
            VALIDATE_INTEGRATION_REF="refs/remotes/validate_integration"

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            if ! git ls-remote --exit-code --heads "${REPO_URL}" "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist. Finish release cannot continue."
              exit 1
            fi

            if ! git ls-remote --exit-code --heads "${REPO_URL}" "refs/heads/${INTEGRATION_BRANCH}" >/dev/null 2>&1; then
              echo "ERROR: integration branch ${INTEGRATION_BRANCH} does not exist."
              exit 1
            fi

            git fetch "${REPO_URL}" \
              "+refs/heads/${INTEGRATION_BRANCH}:${VALIDATE_INTEGRATION_REF}" \
              "+refs/heads/${RELEASE_BRANCH}:${VALIDATE_RELEASE_REF}" \
              --prune

            TAG_EXISTS=false
            TAG_ON_INTEGRATION=false

            if git ls-remote --tags "${REPO_URL}" "refs/tags/${RELEASE_TAG}" | grep -q "refs/tags/${RELEASE_TAG}$"; then
              TAG_EXISTS=true

              git fetch "${REPO_URL}" \
                "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
                --prune

              TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}")"
              if git merge-base --is-ancestor "${TAG_COMMIT}" "${VALIDATE_INTEGRATION_REF}"; then
                TAG_ON_INTEGRATION=true
              fi
            fi

            if [ "${TAG_EXISTS}" = "true" ] && [ "${TAG_ON_INTEGRATION}" != "true" ]; then
              echo "ERROR: release tag ${RELEASE_TAG} already exists but is not contained in ${INTEGRATION_BRANCH}."
              exit 1
            fi

            git checkout -B "${RELEASE_BRANCH}" "${VALIDATE_RELEASE_REF}"
            git checkout -B "${INTEGRATION_BRANCH}" "${VALIDATE_INTEGRATION_REF}"

            git merge -s recursive -X theirs -m "Merge release branch ${RELEASE_BRANCH}" "${RELEASE_BRANCH}"

            find . -type f -name "*.xml" -exec sed -i 's/-SNAPSHOT//g' {} +

            if ! git diff --quiet; then
              git commit -am "Release Versions"
            else
              echo "No SNAPSHOT versions found to remove before tagging"
            fi

            if [ "${TAG_EXISTS}" = "false" ]; then
              git tag "${RELEASE_TAG}"
            fi

            git push "${REPO_URL}" "${INTEGRATION_BRANCH}"

            if [ "${TAG_EXISTS}" = "false" ]; then
              git push "${REPO_URL}" "refs/tags/${RELEASE_TAG}"
            fi

    - inject-variables:
        file: skip.properties
        scope: LOCAL

    - script:
        interpreter: SHELL
        description: Delete release branch after successful finish
        working-dir: reporting
        scripts:
          - |
            set -euo pipefail

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"
            INTEGRATION_BRANCH="${bamboo.integration.branch}"
            REPO_URL="${bamboo.repo_url}"
            VALIDATE_INTEGRATION_REF="refs/remotes/validate_integration"

            TAG_EXISTS=false
            BRANCH_EXISTS=false
            RELEASE_ARTIFACTS_EXIST=false
            INTEGRATION_HAS_TAG=false
            found_count=0
            total_expected=9

            if git ls-remote --tags "${REPO_URL}" "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
              TAG_EXISTS=true
            fi

            if git ls-remote --heads "${REPO_URL}" "refs/heads/${RELEASE_BRANCH}" | grep -q "refs/heads/${RELEASE_BRANCH}$"; then
              BRANCH_EXISTS=true
            fi

            AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "\$or":[
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-aggregator/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}"}}
              ]
            }).include("name","repo","path")
            EOF
            )

            RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -H "Content-Type: text/plain" \
              -X POST \
              "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
              --data "${AQL}")

            found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/reporting/reporting-aggregator/${RELEASE_VERSION}", "reporting-aggregator-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/reporting/reporting-core/${RELEASE_VERSION}", "reporting-core-${RELEASE_VERSION}-tests.jar"),
                ("gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}", "reporting-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/reporting-war/${RELEASE_VERSION}", "reporting-war-${RELEASE_VERSION}.war"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}.jar"),
                ("gov/gsa/cnxs/reporting/test/reporting-integration-test/${RELEASE_VERSION}", "reporting-integration-test-${RELEASE_VERSION}-tests.jar"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
            )

            if [ "${found_count}" -eq "${total_expected}" ]; then
              RELEASE_ARTIFACTS_EXIST=true
            fi

            if [ "${TAG_EXISTS}" = "true" ]; then
              git tag -d "${RELEASE_VERSION}" >/dev/null 2>&1 || true

              git fetch "${REPO_URL}" \
                "+refs/heads/${INTEGRATION_BRANCH}:${VALIDATE_INTEGRATION_REF}" \
                "+refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}" \
                --prune

              TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_VERSION}" 2>/dev/null || true)"
              INTEGRATION_COMMIT="$(git rev-parse "${VALIDATE_INTEGRATION_REF}" 2>/dev/null || true)"

              echo "INFO: tag_commit=${TAG_COMMIT:-missing} integration_commit=${INTEGRATION_COMMIT:-missing}"

              if [ -n "${TAG_COMMIT}" ] && [ -n "${INTEGRATION_COMMIT}" ]; then
                if git merge-base --is-ancestor "${TAG_COMMIT}" "${VALIDATE_INTEGRATION_REF}"; then
                  INTEGRATION_HAS_TAG=true
                fi
              fi
            fi

            echo "INFO: tag_exists=${TAG_EXISTS}, integration_has_tag=${INTEGRATION_HAS_TAG}, branch_exists=${BRANCH_EXISTS}, release_artifacts_found=${found_count}"

            if [ "${TAG_EXISTS}" != "true" ]; then
              echo "ERROR: release tag ${RELEASE_VERSION} does not exist in remote; refusing cleanup."
              exit 1
            fi

            if [ "${RELEASE_ARTIFACTS_EXIST}" != "true" ]; then
              echo "ERROR: release artifacts for ${RELEASE_VERSION} not found in release repo; refusing cleanup."
              exit 1
            fi

            if [ "${BRANCH_EXISTS}" = "true" ]; then
              if [ "${INTEGRATION_HAS_TAG}" = "true" ]; then
                echo "INFO: final-state signals confirmed; attempting to delete remote release branch ${RELEASE_BRANCH}"
                if git push "${REPO_URL}" --delete "${RELEASE_BRANCH}"; then
                  echo "INFO: deleted remote release branch ${RELEASE_BRANCH}"
                else
                  echo "WARNING: failed to delete remote release branch ${RELEASE_BRANCH}"
                  echo "WARNING: release is still finalized because tag exists on ${INTEGRATION_BRANCH} and full release artifacts are present."
                fi
                exit 0
              fi

              echo "WARNING: could not re-prove ancestry, but tag and full release artifacts already exist."
              echo "WARNING: treating release as finalized and attempting best-effort cleanup for ${RELEASE_BRANCH}."
              if git push "${REPO_URL}" --delete "${RELEASE_BRANCH}"; then
                echo "INFO: deleted remote release branch ${RELEASE_BRANCH}"
              else
                echo "WARNING: failed to delete remote release branch ${RELEASE_BRANCH}"
                echo "WARNING: release remains finalized based on remote tag + release artifacts."
              fi
              exit 0
            fi

            echo "INFO: release branch ${RELEASE_BRANCH} already absent; release is finalized."
            exit 0

  artifact-subscriptions: []

variables:
  module_name: reporting
  repo_url: ssh://git@bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov:7999/cnxs/reporting.git
  maven.artifactId: reporting-aggregator
  maven.groupId: gov.gsa.cnxs.reporting
  integration.branch: main

repositories:
  - Reporting:
      scope: global
  - bamboo-deployment:
      scope: global

triggers: []

branches:
  create: manually
  delete: never
  link-to-jira: true

notifications: []

labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []
