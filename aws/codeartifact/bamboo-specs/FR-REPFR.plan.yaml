---
version: 2
plan:
  project-key: FR
  key: REPFR
  name: Reporting - Finish Release
stages:
- Promote Release Artifacts:
    manual: false
    final: false
    jobs:
    - Promote Job
- Finalize Git Release:
    manual: false
    final: false
    jobs:
    - Finalize Job
Promote Job:
  key: JOB1
  other:
    clean-working-dir: true
  tasks:
  - clean
  - checkout:
      repository: Reporting
      path: reporting
      force-clean-build: true
      description: Checkout Reporting repository
  - checkout:
      repository: bamboo-deployment
      path: release-scripts
      force-clean-build: true
      description: Checkout release-scripts repository
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }
      description: Validate SSH key mounts
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml
 
        cat > "${SETTINGS_FILE}" <<XML
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
          <mirrors>
            <mirror>
              <id>artifactory</id>
              <mirrorOf>*</mirrorOf>
              <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
            </mirror>
          </mirrors>
          <profiles>
            <profile>
              <id>use-artifactory</id>
              <repositories>
                <repository>
                  <id>artifactory</id>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>artifactory</id>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>use-artifactory</activeProfile>
          </activeProfiles>
          <servers>
            <server>
              <id>central</id>
              <username>sa_bamboo</username>
              <password>${bamboo.artifactory_access_token_secret}</password>
            </server>
            <server>
              <id>artifactory</id>
              <username>sa_bamboo</username>
              <password>${bamboo.artifactory_access_token_secret}</password>
            </server>
          </servers>
        </settings>
        XML
      description: Write Maven settings for current Artifactory
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
        REPO_URL="${bamboo.repo_url}"
 
        git config user.name "bamboo"
        git config user.email "bamboo@local"
 
        # Discover the highest release branch on remote
        RELEASE_BRANCH=$(git ls-remote --heads "${REPO_URL}" 'refs/heads/release/*' \
          | awk '{print $2}' \
          | sed 's|refs/heads/||' \
          | grep '^release/' \
          | sed 's|release/||' \
          | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
          | tail -1 \
          | sed 's|^|release/|')
 
        [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
        RELEASE_VERSION="${RELEASE_BRANCH#release/}"
        echo "INFO: release branch=${RELEASE_BRANCH} version=${RELEASE_VERSION}"
 
        git fetch "${REPO_URL}" \
          "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" \
          --prune >/dev/null 2>&1
 
        git checkout -B "${RELEASE_BRANCH}" "refs/remotes/origin/${RELEASE_BRANCH}"
 
        find . -type f -name "*.xml" -exec sed -i 's/-RC/-SNAPSHOT/g' {} +
 
        if ! git diff --quiet; then
          git commit -am "Updated versions from release-candidate to snapshot"
          git push "${REPO_URL}" HEAD:"${RELEASE_BRANCH}"
        else
          echo "No RC versions found to convert back to SNAPSHOT"
        fi
      working-dir: reporting
      description: Convert RC versions back to SNAPSHOT on release branch
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        curl -ks "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov:443/artifactory/file-local/certificates/USDA_Enterprise_Root_CA.crt" \
          -o /etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.pem
        update-ca-trust
      description: Install USDA root certificate in system wide trusted certificate location
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
        REPO_URL="${bamboo.repo_url}"
        SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
 
        # Discover the highest release branch on remote
        RELEASE_BRANCH=$(git ls-remote --heads "${REPO_URL}" 'refs/heads/release/*' \
          | awk '{print $2}' \
          | sed 's|refs/heads/||' \
          | grep '^release/' \
          | sed 's|release/||' \
          | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
          | tail -1 \
          | sed 's|^|release/|')
 
        [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
        RELEASE_VERSION="${RELEASE_BRANCH#release/}"
 
        mkdir -p working
 
        python3 ../release-scripts/promote.py \
          conexus-rc-local \
          gov.gsa.cnxs.reporting \
          reporting-aggregator \
          "${RELEASE_VERSION}" \
          --username "sa_bamboo" \
          --password "${bamboo.artifactory_access_token_secret}" \
          --settings-xml "${SETTINGS_FILE}" \
          --override
 
        python3 ../release-scripts/promote.py \
          conexus-rc-local \
          gov.gsa.cnxs.reporting \
          reporting-core \
          "${RELEASE_VERSION}" \
          --username "sa_bamboo" \
          --password "${bamboo.artifactory_access_token_secret}" \
          --settings-xml "${SETTINGS_FILE}" \
          --override
 
        python3 ../release-scripts/promote.py \
          conexus-rc-local \
          gov.gsa.cnxs.reporting \
          reporting-war \
          "${RELEASE_VERSION}" \
          --username "sa_bamboo" \
          --password "${bamboo.artifactory_access_token_secret}" \
          --settings-xml "${SETTINGS_FILE}" \
          --override
 
        python3 ../release-scripts/promote.py \
          conexus-rc-local \
          gov.gsa.cnxs.reporting.test \
          reporting-integration-test \
          "${RELEASE_VERSION}" \
          --username "sa_bamboo" \
          --password "${bamboo.artifactory_access_token_secret}" \
          --settings-xml "${SETTINGS_FILE}" \
          --override
      working-dir: reporting
      description: Promote Reporting artifacts from RC repo
  artifact-subscriptions: []
Finalize Job:
  key: JOB2
  other:
    clean-working-dir: true
  tasks:
  - clean
  - checkout:
      repository: Reporting
      path: reporting
      force-clean-build: true
      description: Checkout Reporting repository
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }
      description: Validate SSH key mounts
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml
 
        cat > "${SETTINGS_FILE}" <<XML
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
          <mirrors>
            <mirror>
              <id>artifactory</id>
              <mirrorOf>*</mirrorOf>
              <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
            </mirror>
          </mirrors>
          <profiles>
            <profile>
              <id>use-artifactory</id>
              <repositories>
                <repository>
                  <id>artifactory</id>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>artifactory</id>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>use-artifactory</activeProfile>
          </activeProfiles>
          <servers>
            <server>
              <id>central</id>
              <username>sa_bamboo</username>
              <password>${bamboo.artifactory_access_token_secret}</password>
            </server>
            <server>
              <id>artifactory</id>
              <username>sa_bamboo</username>
              <password>${bamboo.artifactory_access_token_secret}</password>
            </server>
          </servers>
        </settings>
        XML
      description: Write Maven settings for current Artifactory
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
        REPO_URL="${bamboo.repo_url}"
 
        git config user.name "bamboo"
        git config user.email "bamboo@local"
 
        # Discover the highest release branch on remote
        RELEASE_BRANCH=$(git ls-remote --heads "${REPO_URL}" 'refs/heads/release/*' \
          | awk '{print $2}' \
          | sed 's|refs/heads/||' \
          | grep '^release/' \
          | sed 's|release/||' \
          | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
          | tail -1 \
          | sed 's|^|release/|')
 
        [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
        RELEASE_VERSION="${RELEASE_BRANCH#release/}"
        echo "INFO: release branch=${RELEASE_BRANCH} version=${RELEASE_VERSION}"
 
        # Fetch both main and release branch
        git fetch "${REPO_URL}" \
          "+refs/heads/main:refs/remotes/origin/main" \
          "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" \
          --prune >/dev/null 2>&1
 
        git checkout -B "${RELEASE_BRANCH}" "refs/remotes/origin/${RELEASE_BRANCH}"
        git checkout -B main "refs/remotes/origin/main"
 
        git merge -s recursive -X theirs \
          -m "Merge Release Branch" \
          "${RELEASE_BRANCH}"
 
        git tag "${RELEASE_VERSION}"
 
        find . -type f -name "*.xml" -exec sed -i 's/-SNAPSHOT//g' {} +
 
        if ! git diff --quiet; then
          git commit -am "Release Versions"
        else
          echo "No SNAPSHOT versions found to strip"
        fi
 
        git push "${REPO_URL}" main
        git push "${REPO_URL}" "refs/tags/${RELEASE_VERSION}"
      working-dir: reporting
      description: Merge release branch to main, tag, set release versions, and push
  artifact-subscriptions: []
variables:
  module_name: reporting
  repo_url: ssh://git@bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov:7999/cnxs/reporting.git
  maven.artifactId: reporting-aggregator
  maven.groupId: gov.gsa.cnxs.reporting
repositories:
- Reporting:
    scope: global
- bamboo-deployment:
    scope: global
triggers: []
branches:
  create: manually
  delete: never
  link-to-jira: true
notifications: []
labels: []
dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []
other:
  concurrent-build-plugin:
    number-of-concurrent-builds: system-default
    execution-strategy: block-triggering
  force-stop-build: true