---
version: 2
plan:
  project-key: FR
  key: REPFR
  name: Reporting - Finish Release

stages:
  - Promote Release Artifacts:
      jobs:
        - Promote Job

  - Finalize Git Release:
      jobs:
        - Finalize Job

# =========================
# PROMOTE STAGE
# =========================

Promote Job:
  key: JOB1
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        path: ${bamboo.module_name}
        force-clean-build: true

    - checkout:
        repository: bamboo-deployment
        path: release-scripts
        force-clean-build: true

    # -------------------------
    # SSH VALIDATION
    # -------------------------
    - script:
        interpreter: SHELL
        description: Validate SSH key
        scripts:
          - |
            set -euo pipefail
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }

    # -------------------------
    # MAVEN SETTINGS
    # -------------------------
    - script:
        interpreter: SHELL
        description: Write Maven settings
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE=/tmp/settings-${bamboo.buildResultKey}.xml

            cat > "${SETTINGS_FILE}" <<XML
            <settings>
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    # -------------------------
    # VALIDATE + SNAPSHOT CONVERT
    # -------------------------
    - script:
        interpreter: SHELL
        working-dir: ${bamboo.module_name}
        description: Validate release branch + convert RC → SNAPSHOT
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"
            echo "bamboo_skip_release=false" > "${bamboo.build.working.directory}/skip.properties"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version | tail -1)
            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags >/dev/null 2>&1

            if ! git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" >/dev/null; then
              echo "ERROR: release branch ${RELEASE_BRANCH} not found"
              exit 1
            fi

            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"

            find . -name "*.xml" -exec sed -i 's/-RC/-SNAPSHOT/g' {} +

            if ! git diff --quiet; then
              git commit -am "Convert RC → SNAPSHOT"
              git push origin HEAD:"${RELEASE_BRANCH}"
            fi

    - inject-variables:
        file: skip.properties
        scope: LOCAL

    # -------------------------
    # CERT INSTALL
    # -------------------------
    - script:
        interpreter: SHELL
        description: Install USDA cert
        scripts:
          - |
            set -euo pipefail
            curl -ks https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/file-local/certificates/USDA_Enterprise_Root_CA.crt \
              -o /etc/pki/ca-trust/source/anchors/usda.pem
            update-ca-trust

    # -------------------------
    # ARTIFACT CHECK
    # -------------------------
    - script:
        interpreter: SHELL
        working-dir: ${bamboo.module_name}
        description: Validate release artifacts
        scripts:
          - |
            set -euo pipefail

            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"
            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version | tail -1)
            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"

            RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -X POST \
              https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql \
              -d "items.find({\"repo\":\"conexus-release-local\",\"path\":{\"\$match\":\"*${RELEASE_VERSION}\"}})")

            COUNT=$(echo "$RESULT" | jq '.results | length')

            if [ "$COUNT" -gt 0 ]; then
              echo "Artifacts already exist → skipping"
              echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
            fi

    - inject-variables:
        file: skip.properties
        scope: LOCAL

    # -------------------------
    # PROMOTE
    # -------------------------
    - script:
        interpreter: SHELL
        working-dir: ${bamboo.module_name}
        description: Promote artifacts
        scripts:
          - |
            set -euo pipefail

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "Skipping promotion"
              exit 0
            fi

            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"
            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version | tail -1)
            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"

            mkdir -p working

            python3 ../release-scripts/promote.py \
              conexus-rc-local \
              gov.gsa.cnxs.reporting \
              reporting-aggregator \
              "${RELEASE_VERSION}" \
              --username sa_bamboo \
              --password "${bamboo.artifactory_access_token_secret}" \
              --settings-xml "${SETTINGS_FILE}" \
              --override

# =========================
# FINALIZE STAGE
# =========================

Finalize Job:
  key: JOB2
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        path: ${bamboo.module_name}
        force-clean-build: true

    - script:
        interpreter: SHELL
        description: Validate SSH key
        scripts:
          - |
            test -s /opt/bamboo-keys/bitbucket_ci || exit 1

    - script:
        interpreter: SHELL
        working-dir: ${bamboo.module_name}
        description: Finalize release
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes'

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout help:evaluate -Dexpression=project.version | tail -1)
            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"
            TAG="${RELEASE_VERSION}"
            INTEGRATION="${bamboo.integration.branch}"

            git fetch origin --prune --tags

            git checkout -B "${INTEGRATION}" "origin/${INTEGRATION}"
            git merge -X theirs "${RELEASE_BRANCH}"

            find . -name "*.xml" -exec sed -i 's/-SNAPSHOT//g' {} +

            if ! git diff --quiet; then
              git commit -am "Release Versions"
            fi

            if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
              git tag "${TAG}"
            fi

            git push origin "${INTEGRATION}"
            git push origin "${TAG}"

    # -------------------------
    # CLEANUP (SAFE)
    # -------------------------
    - script:
        interpreter: SHELL
        working-dir: ${bamboo.module_name}
        description: Cleanup release branch
        scripts:
          - |
            set -euo pipefail

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci'

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout help:evaluate -Dexpression=project.version | tail -1)
            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"

            if git ls-remote --heads origin "${RELEASE_BRANCH}" | grep -q "${RELEASE_BRANCH}"; then
              git push origin --delete "${RELEASE_BRANCH}" || echo "Cleanup failed but OK"
            fi