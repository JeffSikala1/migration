---
version: 2
plan:
  project-key: BT
  key: UIPUBPACK
  name: UI Public - Package

stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Default Job

Default Job:
  key: JOB1
  tasks:
    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - checkout:
        repository: bamboo-deployment
        path: bamboo-deployment
        force-clean-build: true
        description: Checkout bamboo-deployment Repository

    - script:
        interpreter: BINSH_OR_CMDEXE
        description: Remove existing cnxs maven repo directory
        scripts:
          - rm -rf ~/.m2/repository/gov/gsa/cnxs/

    - script:
        interpreter: SHELL
        file: bamboo-deployment/build-determination-migration.sh
        description: Determine parent branch and pass correct variables

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        scripts:
          - |-
            #!/usr/bin/env bash
            set -e
            cat > settings-artifactory.xml << 'EOF'
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
              <mirrors>
                <mirror>
                  <id>ArtifactoryPluginRepos</id>
                  <mirrorOf>*,!conexus-snapshot-local</mirrorOf>
                  <url>${bamboo.inject.pluginRepositoryUrl}</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>conexus-plugin-repository</id>
                      <url>${bamboo.inject.pluginRepositoryUrl}</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                    <repository>
                      <id>conexus-snapshot-local</id>
                      <url>${bamboo.inject.mavenFeatureRepositoryUrl}</url>
                      <releases><enabled>false</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>conexus-plugin-repository</id>
                      <url>${bamboo.inject.pluginRepositoryUrl}</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server><id>cnxs-artifactory</id><username>sa_bamboo</username><password>${bamboo.artifactory_access_token_secret}</password></server>
                <server><id>artifactory</id><username>sa_bamboo</username><password>${bamboo.artifactory_access_token_secret}</password></server>
                <server><id>conexus-plugin-repository</id><username>sa_bamboo</username><password>${bamboo.artifactory_access_token_secret}</password></server>
                <server><id>conexus-snapshot-local</id><username>sa_bamboo</username><password>${bamboo.artifactory_access_token_secret}</password></server>
                <server><id>ArtifactoryPluginRepos</id><username>sa_bamboo</username><password>${bamboo.artifactory_access_token_secret}</password></server>
                <server><id>ArtifactoryMavenFeatureRepos</id><username>sa_bamboo</username><password>${bamboo.artifactory_access_token_secret}</password></server>
              </servers>
            </settings>
            EOF
        description: Write Artifactory Maven settings

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: clean verify -B -U -s settings-artifactory.xml -Dbamboo.inject.BranchName=${bamboo.inject.BranchName} -Dbamboo.inject.mavenFeatureRepositoryUrl=${bamboo.inject.mavenFeatureRepositoryUrl} -Dbamboo.inject.pluginRepositoryUrl=${bamboo.inject.pluginRepositoryUrl} -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        description: Build

    - script:
        interpreter: SHELL
        description: Extract Maven version
        scripts:
          - |-
            #!/usr/bin/env bash
            set -eux

            MVN_VERSION="$(awk '
              /<project/ { inproject=1 }
              inproject && /<version>/ {
                gsub(/.*<version>/,"")
                gsub(/<\/version>.*/,"")
                print
                exit
              }
            ' pom.xml)"

            if [[ -z "${MVN_VERSION}" ]]; then
              echo "ERROR: Could not determine Maven version from pom.xml"
              exit 1
            fi

            echo "mavenVersion=${MVN_VERSION}" >> file.properties
            echo "Wrote mavenVersion=${MVN_VERSION} to file.properties"
            cat file.properties

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        file: bamboo-deployment/deploy-to-artifactory-and-create-bamboo-version-migrate.sh
        environment: buildVersionQueryArtifact=${bamboo.buildVersionQueryArtifact} buildVersionQueryGroup=${bamboo.buildVersionQueryGroup} mavenVersion=${bamboo.inject.mavenVersion}
        description: Deploy to Artifactory if needed

    - inject-variables:
        file: file.properties
        scope: RESULT
        namespace: inject

  artifact-subscriptions: []

variables:
  buildVersionQueryArtifact: ui-public
  buildVersionQueryGroup: gov.gsa.cnxs.ui-public

repositories:
  - UI-Public:
      scope: global
  - bamboo-deployment:
      scope: global

triggers:
  - bitbucket-server-trigger:
      repositories:
        - UI-Public

branches:
  create: for-new-branch
  delete:
    after-deleted-days: 7
    after-inactive-days: 200
  link-to-jira: true

notifications:
  - events:
      - plan-completed
    recipients:
      - watchers
  - events:
      - plan-failed
    recipients:
      - responsible
      - committers

labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []
