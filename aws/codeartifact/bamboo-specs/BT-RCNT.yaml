---
version: 2
plan:
  project-key: BT
  key: RCNT
  name: Reconciliation - Nightly Testing

stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Default Job

Default Job:
  key: JOB1
  other:
    clean-working-dir: true
    all-other-apps:
      custom:
        auto: {}
        buildHangingConfig.enabled: "false"

  tasks:
    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - checkout:
        repository: bamboo-deployment
        path: bamboo-deployment
        force-clean-build: true
        description: Checkout bamboo-deployment

    - script:
        interpreter: SHELL
        scripts:
          - |-
            rm -rf .m2
            mkdir -p .m2/repository
        description: Prepare isolated Maven repo

    - script:
        interpreter: SHELL
        file: bamboo-deployment/build-determination-migration.sh
        description: Determine parent branch and pass correct variables

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject
        description: Inject values

    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.bamboo-variable-inject-plugin:dump
        configuration: {}

    - script:
        interpreter: SHELL
        scripts:
          - |-
            cat > settings-artifactory.xml <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
              <mirrors>
                <mirror>
                  <id>ArtifactoryPluginRepos</id>
                  <mirrorOf>*,!conexus-snapshot-local</mirrorOf>
                  <url>${bamboo.inject.pluginRepositoryUrl}</url>
                </mirror>
              </mirrors>

              <profiles>
                <profile>
                  <id>use-artifactory</id>

                  <repositories>
                    <repository>
                      <id>conexus-plugin-repository</id>
                      <url>${bamboo.inject.pluginRepositoryUrl}</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>

                    <repository>
                      <id>conexus-snapshot-local</id>
                      <url>${bamboo.inject.mavenFeatureRepositoryUrl}</url>
                      <releases><enabled>false</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>

                  <pluginRepositories>
                    <pluginRepository>
                      <id>conexus-plugin-repository</id>
                      <url>${bamboo.inject.pluginRepositoryUrl}</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>

              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>

              <servers>
                <server>
                  <id>cnxs-artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>

                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>

                <server>
                  <id>conexus-plugin-repository</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>

                <server>
                  <id>conexus-snapshot-local</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>

                <server>
                  <id>ArtifactoryPluginRepos</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>

                <server>
                  <id>ArtifactoryMavenFeatureRepos</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML
        description: Write Artifactory Maven settings

    - script:
        interpreter: SHELL
        scripts:
          - |-
            sed -E 's#<password>.*</password>#<password>***</password>#g' settings-artifactory.xml
        description: Debug generated Maven settings

    - script:
        interpreter: SHELL
        scripts:
          - |-
            set -e
            curl -sf -u sa_bamboo:${bamboo.artifactory_access_token_secret} \
              "${bamboo.inject.mavenFeatureRepositoryUrl}gov/gsa/cnxs/bom/env/02.00.000.167-SNAPSHOT/maven-metadata.xml" \
              >/dev/null
            echo "Artifactory dependency auth check passed"
        description: Validate Artifactory dependency access

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >
          -Dmaven.repo.local=${bamboo.build.working.directory}/.m2/repository
          -s settings-artifactory.xml
          clean verify -B -U
          -DskipTests=true -DskipSurefire=true -DskipITs=true -Dmaven.test.skip=true
          -Dbamboo.inject.BranchName=${bamboo.inject.BranchName}
          -Dbamboo.inject.RawBranchName=${bamboo.inject.RawBranchName}
          -Dbamboo.inject.ParentBranchName=${bamboo.inject.ParentBranchName}
          -Dbamboo.inject.ChildBranchName=${bamboo.inject.ChildBranchName}
          -Dbamboo.inject.mavenFeatureRepositoryUrl=${bamboo.inject.mavenFeatureRepositoryUrl}
          -Dbamboo.inject.pluginRepositoryUrl=${bamboo.inject.pluginRepositoryUrl}
          -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        description: Nightly build and verify using Artifactory settings

  artifact-subscriptions: []

repositories:
  - Reconciliation:
      scope: global
  - bamboo-deployment:
      scope: global

triggers: []
  # Trigger type TriggerProperties{name='Single daily build', description='Nightly run', conditions=[], enabled=true} is not supported yet

branches:
  create: manually
  delete:
    after-deleted-days: 7
    after-inactive-days: 7
  link-to-jira: true

notifications:
  - events:
      - plan-failed
    recipients:
      - users:
          - jeff.sikala
      - watchers

  - events:
      - plan-completed
    recipients:
      - watchers

  - events:
      - plan-failed
    recipients:
      - responsible
      - committers
      - users:
          - jeff.sikala

labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []