---
version: 2
plan:
  project-key: FR
  key: CRFR
  name: CommonRest - Finish Release

stages:
  - Promote Release Artifacts:
      manual: false
      final: false
      jobs:
        - Promote Job
  - Finalize Git Release:
      manual: false
      final: false
      jobs:
        - Finalize Job

Promote Job:
  key: JOB1
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        path: ${bamboo.module_name}
        force-clean-build: true
        description: Checkout Default Repository

    - checkout:
        repository: bamboo-deployment
        path: release-scripts
        force-clean-build: true
        description: Checkout release-scripts repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mounts
        scripts:
          - |
            set -euo pipefail
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml

            cat > "${SETTINGS_FILE}" <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Validate exact release branch exists and convert RC back to SNAPSHOT
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            echo "bamboo_skip_release=false" > "${bamboo.build.working.directory}/skip.properties"

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags >/dev/null 2>&1 || true

            # Discover the highest release branch on remote — never derive from develop
            RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{print $2}' \
              | sed 's|refs/heads/||' \
              | grep '^release/' \
              | sed 's|release/||' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 \
              | sed 's|^|release/|')

            if [ -z "${RELEASE_BRANCH}" ]; then
              # No release branch — check if already finalized via tag
              RELEASE_VERSION=$(git ls-remote --tags origin 'refs/tags/*' \
                | awk '{print $2}' \
                | sed 's|refs/tags/||' \
                | grep -v '\^{}' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
                | tail -1)
              if [ -n "${RELEASE_VERSION}" ] && git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
                echo "INFO: no release branch found; release ${RELEASE_VERSION} appears already finalized via tag; skipping."
                echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
                exit 0
              fi
              echo "ERROR: no release branch found on remote and no finalized tag detected"
              exit 1
            fi

            RELEASE_VERSION="${RELEASE_BRANCH#release/}"

            if git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
              echo "INFO: release ${RELEASE_VERSION} already finalized; skipping."
              echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
              exit 0
            fi

            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}" >/dev/null 2>&1

            find . -type f -name "*.xml" -exec sed -i 's/-RC/-SNAPSHOT/g' {} +

            if ! git diff --quiet; then
              git commit -am "Updated versions from release-candidate to snapshot"
              git push origin HEAD:"${RELEASE_BRANCH}"
            else
              echo "No RC versions found to convert back to SNAPSHOT"
            fi

    - inject-variables:
        file: skip.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        description: Install USDA root certificate in system wide trusted certificate location
        scripts:
          - |
            set -euo pipefail
            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            curl -ks "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov:443/artifactory/file-local/certificates/USDA_Enterprise_Root_CA.crt" \
              -o /etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.pem
            update-ca-trust

    - script:
        interpreter: SHELL
        description: Validate release state before promotion
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune >/dev/null 2>&1 || true

            # Discover the highest release branch on remote
            RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{print $2}' \
              | sed 's|refs/heads/||' \
              | grep '^release/' \
              | sed 's|release/||' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 \
              | sed 's|^|release/|')

            [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
            RELEASE_VERSION="${RELEASE_BRANCH#release/}"

            if ! git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | grep -q .; then
              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist."
              exit 1
            fi

            echo "Release state validation passed for ${RELEASE_BRANCH}."

    - inject-variables:
        file: skip.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        description: Pre-check CommonRest release artifacts in Artifactory
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            echo "bamboo_skip_release=false" > "${bamboo.build.working.directory}/skip.properties"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune >/dev/null 2>&1 || true

            # Discover the highest release branch on remote
            RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{print $2}' \
              | sed 's|refs/heads/||' \
              | grep '^release/' \
              | sed 's|release/||' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 \
              | sed 's|^|release/|')

            [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
            RELEASE_VERSION="${RELEASE_BRANCH#release/}"
            GROUP_PATH="gov/gsa/cnxs/common-rest"

            AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "\$or":[
                {"path":{"\$eq":"${GROUP_PATH}/common-rest/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"${GROUP_PATH}/common-rest-shiro/${RELEASE_VERSION}"}},
                {"path":{"\$eq":"${GROUP_PATH}/common-rest-test-utils/${RELEASE_VERSION}"}}
              ]
            }).include("name","repo","path")
            EOF
            )

            RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -H "Content-Type: text/plain" \
              -X POST \
              "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
              --data "${AQL}")

            found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            names = {item["name"] for item in data.get("results", [])}
            expected = [
              "common-rest-aggregator-${RELEASE_VERSION}.pom",
              "common-rest-${RELEASE_VERSION}.pom",
              "common-rest-${RELEASE_VERSION}.jar",
              "common-rest-${RELEASE_VERSION}-tests.jar",
              "common-rest-shiro-${RELEASE_VERSION}.pom",
              "common-rest-shiro-${RELEASE_VERSION}.jar",
              "common-rest-shiro-${RELEASE_VERSION}-tests.jar",
              "common-rest-test-utils-${RELEASE_VERSION}.pom",
              "common-rest-test-utils-${RELEASE_VERSION}.jar",
              "common-rest-test-utils-${RELEASE_VERSION}-tests.jar",
            ]
            print(sum(1 for x in expected if x in names))
            PY
            )

            total_expected=10

            echo "INFO: found ${found_count} of ${total_expected} expected CommonRest release artifacts"

            if [ "${found_count}" -eq 0 ]; then
              echo "INFO: no CommonRest release artifacts found for ${RELEASE_VERSION}; promotion may proceed."
              exit 0
            fi

            if [ "${found_count}" -eq "${total_expected}" ]; then
              echo "INFO: all CommonRest release artifacts already exist for ${RELEASE_VERSION}; skipping promotion."
              echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
              exit 0
            fi

            echo "ERROR: partial CommonRest release already exists for ${RELEASE_VERSION}."
            exit 1

    - inject-variables:
        file: skip.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        description: Promote CommonRest artifacts from RC repo
        working-dir: .
        scripts:
          - |
            set -euo pipefail

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release artifacts already exist; skipping promotion."
              exit 0
            fi

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            git -C "${bamboo.module_name}" remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git -C "${bamboo.module_name}" fetch origin --prune >/dev/null 2>&1 || true

            # Discover the highest release branch on remote
            RELEASE_BRANCH=$(git -C "${bamboo.module_name}" ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{print $2}' \
              | sed 's|refs/heads/||' \
              | grep '^release/' \
              | sed 's|release/||' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 \
              | sed 's|^|release/|')

            [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
            RELEASE_VERSION="${RELEASE_BRANCH#release/}"

            mkdir -p "${bamboo.module_name}/working"

            python3 release-scripts/promote.py \
              conexus-rc-local \
              gov.gsa.cnxs.common-rest \
              common-rest \
              "${RELEASE_VERSION}" \
              --username "sa_bamboo" \
              --password "${bamboo.artifactory_access_token_secret}" \
              --settings-xml "${SETTINGS_FILE}" \
              --override

            python3 release-scripts/promote.py \
              conexus-rc-local \
              gov.gsa.cnxs.common-rest \
              common-rest-shiro \
              "${RELEASE_VERSION}" \
              --username "sa_bamboo" \
              --password "${bamboo.artifactory_access_token_secret}" \
              --settings-xml "${SETTINGS_FILE}" \
              --override

            python3 release-scripts/promote.py \
              conexus-rc-local \
              gov.gsa.cnxs.common-rest \
              common-rest-test-utils \
              "${RELEASE_VERSION}" \
              --username "sa_bamboo" \
              --password "${bamboo.artifactory_access_token_secret}" \
              --settings-xml "${SETTINGS_FILE}" \
              --override

            python3 release-scripts/promote.py \
              conexus-rc-local \
              gov.gsa.cnxs.common-rest \
              common-rest-aggregator \
              "${RELEASE_VERSION}" \
              --username "sa_bamboo" \
              --password "${bamboo.artifactory_access_token_secret}" \
              --settings-xml "${SETTINGS_FILE}" \
              --override

            echo "INFO: CommonRest release artifacts successfully promoted for ${RELEASE_VERSION}"

  artifact-subscriptions: []

Finalize Job:
  key: JOB2
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        path: ${bamboo.module_name}
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mounts
        scripts:
          - |
            set -euo pipefail
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml

            cat > "${SETTINGS_FILE}" <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Validate release state before finalize
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            INTEGRATION_BRANCH="${bamboo.integration.branch}"
            echo "bamboo_skip_release=false" > "${bamboo.build.working.directory}/skip.properties"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags >/dev/null 2>&1 || true

            # Discover the highest release branch on remote — never derive from develop
            RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{print $2}' \
              | sed 's|refs/heads/||' \
              | grep '^release/' \
              | sed 's|release/||' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 \
              | sed 's|^|release/|')

            TAG_EXISTS=false
            INTEGRATION_HAS_TAG=false
            BRANCH_EXISTS=false

            if [ -n "${RELEASE_BRANCH}" ]; then
              RELEASE_VERSION="${RELEASE_BRANCH#release/}"
              BRANCH_EXISTS=true
            else
              # No release branch — try to find version from latest release tag
              RELEASE_VERSION=$(git ls-remote --tags origin 'refs/tags/*' \
                | awk '{print $2}' \
                | sed 's|refs/tags/||' \
                | grep -v '\^{}' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
                | tail -1)

              if [ -z "${RELEASE_VERSION}" ]; then
                echo "ERROR: no release branch and no release tags found; cannot determine release version"
                exit 1
              fi

              RELEASE_BRANCH="release/${RELEASE_VERSION}"
            fi

            {
              echo "bamboo_skip_release=false"
              echo "bamboo_release_version=${RELEASE_VERSION}"
              echo "bamboo_release_branch=${RELEASE_BRANCH}"
              echo "bamboo_integration_branch=${INTEGRATION_BRANCH}"
            } > "${bamboo.build.working.directory}/skip.properties"

            if git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
              TAG_EXISTS=true
            fi

            if [ "${TAG_EXISTS}" = "true" ]; then
              git tag -d "${RELEASE_VERSION}" >/dev/null 2>&1 || true
              git fetch origin \
                "+refs/heads/${INTEGRATION_BRANCH}:refs/remotes/origin/__validate_integration" \
                "+refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}" \
                >/dev/null 2>&1 || true

              TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_VERSION}" 2>/dev/null || true)"
              INTEGRATION_COMMIT="$(git rev-parse refs/remotes/origin/__validate_integration 2>/dev/null || true)"

              if [ -n "${TAG_COMMIT}" ] && [ -n "${INTEGRATION_COMMIT}" ]; then
                if git merge-base --is-ancestor "${TAG_COMMIT}" "refs/remotes/origin/__validate_integration"; then
                  INTEGRATION_HAS_TAG=true
                fi
              fi
            fi

            echo "INFO: tag_exists=${TAG_EXISTS}, integration_has_tag=${INTEGRATION_HAS_TAG}, branch_exists=${BRANCH_EXISTS}"

            if [ "${TAG_EXISTS}" = "true" ] && [ "${INTEGRATION_HAS_TAG}" = "true" ] && [ "${BRANCH_EXISTS}" = "false" ]; then
              echo "INFO: release ${RELEASE_VERSION} already fully finalized; skipping."
              {
                echo "bamboo_skip_release=true"
                echo "bamboo_release_version=${RELEASE_VERSION}"
                echo "bamboo_release_branch=${RELEASE_BRANCH}"
                echo "bamboo_integration_branch=${INTEGRATION_BRANCH}"
              } > "${bamboo.build.working.directory}/skip.properties"
              exit 0
            fi

            if [ "${BRANCH_EXISTS}" != "true" ]; then
              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist and release is not proven finalized on ${INTEGRATION_BRANCH}."
              exit 1
            fi

            if ! git ls-remote --heads origin "refs/heads/${INTEGRATION_BRANCH}" | grep -q "refs/heads/${INTEGRATION_BRANCH}$"; then
              echo "ERROR: integration branch ${INTEGRATION_BRANCH} does not exist."
              exit 1
            fi

            echo "Finalize state validation passed."

    - inject-variables:
        file: skip.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        description: Merge release branch to integration branch, set release versions, tag, and push
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail

            clear_index_lock() {
              rm -f .git/index.lock >/dev/null 2>&1 || true
            }

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            RELEASE_VERSION="${bamboo_inject_bamboo_release_version:-}"
            RELEASE_BRANCH="${bamboo_inject_bamboo_release_branch:-}"
            INTEGRATION_BRANCH="${bamboo_inject_bamboo_integration_branch:-${bamboo.integration.branch}}"

            [ -n "${RELEASE_VERSION}" ] || { echo "ERROR: bamboo_release_version not set"; exit 1; }
            [ -n "${RELEASE_BRANCH}" ]  || { echo "ERROR: bamboo_release_branch not set"; exit 1; }

            RELEASE_TAG="${RELEASE_VERSION}"

            git config user.name "bamboo"
            git config user.email "bamboo@local"
            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            if ! git ls-remote --exit-code --heads origin "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist. Finish release cannot continue."
              exit 1
            fi

            if ! git ls-remote --exit-code --heads origin "refs/heads/${INTEGRATION_BRANCH}" >/dev/null 2>&1; then
              echo "ERROR: integration branch ${INTEGRATION_BRANCH} does not exist."
              exit 1
            fi

            git fetch origin \
              "+refs/heads/${INTEGRATION_BRANCH}:refs/remotes/origin/${INTEGRATION_BRANCH}" \
              "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" \
              "+refs/tags/*:refs/tags/*" \
              --prune >/dev/null 2>&1

            TAG_EXISTS=false
            TAG_ON_INTEGRATION=false

            if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              TAG_EXISTS=true
              TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}")"
              if git merge-base --is-ancestor "${TAG_COMMIT}" "refs/remotes/origin/${INTEGRATION_BRANCH}"; then
                TAG_ON_INTEGRATION=true
              fi
            fi

            if [ "${TAG_EXISTS}" = "true" ] && [ "${TAG_ON_INTEGRATION}" != "true" ]; then
              echo "ERROR: release tag ${RELEASE_TAG} already exists but is not contained in origin/${INTEGRATION_BRANCH}."
              exit 1
            fi

            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}" >/dev/null 2>&1
            git checkout -B "${INTEGRATION_BRANCH}" "origin/${INTEGRATION_BRANCH}" >/dev/null 2>&1

            if git merge -s recursive -X theirs -m "Merge release branch ${RELEASE_BRANCH}" "${RELEASE_BRANCH}"; then
              echo "INFO: merge completed without manual conflict resolution"
            else
              echo "INFO: merge reported conflicts; resolving remaining conflicts in favor of ${RELEASE_BRANCH}"

              clear_index_lock
              git status --porcelain >/dev/null 2>&1 || true
              clear_index_lock

              while IFS= read -r f; do
                [ -n "${f}" ] || continue
                clear_index_lock
                code="$(git status --porcelain -- "${f}" | awk '{print $1}')"

                case "${code}" in
                  UD|DD|AU)
                    git rm -f -- "${f}" || true
                    ;;
                  DU|UU|AA|UA)
                    git checkout --theirs -- "${f}" || true
                    git add -A -- "${f}" || true
                    ;;
                  *)
                    echo "ERROR: unhandled merge conflict state ${code} for ${f}"
                    git status --short
                    exit 1
                    ;;
                esac
              done < <(git diff --name-only --diff-filter=U)

              clear_index_lock

              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "ERROR: unresolved merge conflicts remain after auto-resolution"
                git status --short
                exit 1
              fi

              clear_index_lock
              git add -A
              clear_index_lock
              git commit --no-edit
            fi

            find . -type f -name "*.xml" -exec sed -i 's/-SNAPSHOT//g' {} +

            if ! git diff --quiet; then
              git commit -am "Release Versions"
            else
              echo "No SNAPSHOT versions found to remove before tagging"
            fi

            if [ "${TAG_EXISTS}" = "false" ]; then
              git tag "${RELEASE_TAG}"
            fi

            git push origin "${INTEGRATION_BRANCH}"

            if [ "${TAG_EXISTS}" = "false" ]; then
              git push origin "refs/tags/${RELEASE_TAG}"
            fi

    - inject-variables:
        file: skip.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        description: Bump develop to next SNAPSHOT version after release
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            # Discover the highest release branch on remote
            RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{print $2}' \
              | sed 's|refs/heads/||' \
              | grep '^release/' \
              | sed 's|release/||' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 \
              | sed 's|^|release/|')

            [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
            RELEASE_VERSION="${RELEASE_BRANCH#release/}"

            # Increment the last version segment by 1
            NEXT_VERSION=$(echo "${RELEASE_VERSION}" | awk -F. '{OFS="."; $NF=$NF+1; print}')
            NEXT_SNAPSHOT="${NEXT_VERSION}-SNAPSHOT"

            echo "INFO: Bumping ${bamboo.integration.branch} from ${RELEASE_VERSION} to ${NEXT_SNAPSHOT}"

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags --quiet
            git checkout -B "${bamboo.integration.branch}" "origin/${bamboo.integration.branch}"

            find . -type f -name "pom.xml" -exec sed -i "s|<version>${RELEASE_VERSION}</version>|<version>${NEXT_SNAPSHOT}</version>|g" {} +

            if ! git diff --quiet; then
              git commit -am "Bump to next development version ${NEXT_SNAPSHOT}"
              git push origin "${bamboo.integration.branch}"
            else
              echo "WARNING: No version strings matched ${RELEASE_VERSION} in pom.xml files — verify manually"
            fi

    - script:
        interpreter: SHELL
        description: Delete release branch after successful finish
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            RELEASE_VERSION="${bamboo_inject_bamboo_release_version:-}"
            RELEASE_BRANCH="${bamboo_inject_bamboo_release_branch:-}"

            if [ -z "${RELEASE_VERSION}" ] || [ -z "${RELEASE_BRANCH}" ]; then
              echo "WARNING: cleanup metadata missing from injected variables; skipping destructive cleanup."
              exit 0
            fi

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            if git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
              if git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | grep -q "refs/heads/${RELEASE_BRANCH}$"; then
                echo "INFO: attempting best-effort deletion of ${RELEASE_BRANCH}"
                if git push origin --delete "${RELEASE_BRANCH}"; then
                  echo "INFO: deleted remote release branch ${RELEASE_BRANCH}"
                else
                  echo "WARNING: failed to delete remote release branch ${RELEASE_BRANCH}"
                fi
              else
                echo "INFO: release branch ${RELEASE_BRANCH} already absent"
              fi
            else
              echo "INFO: tag ${RELEASE_VERSION} not confirmed; skipping branch deletion."
            fi

            exit 0

  artifact-subscriptions: []

variables:
  module_name: common-rest
  maven.artifactId: common-rest-aggregator
  maven.groupId: gov.gsa.cnxs.common-rest
  integration.branch: develop

repositories:
  - CommonRest:
      scope: global
  - bamboo-deployment:
      scope: global

triggers: []

branches:
  create: manually
  delete: never
  link-to-jira: true

notifications: []

labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []