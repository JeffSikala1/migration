---
version: 2
plan:
  project-key: BT
  key: PRIC
  name: Pricing - Build

stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Default Job

Default Job:
  key: JOB1
  other:
    clean-working-dir: true
    all-other-apps:
      custom:
        auto: {}
        buildHangingConfig.enabled: "false"

  tasks:
    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - checkout:
        repository: bamboo-deployment
        path: bamboo-deployment
        force-clean-build: true
        description: Checkout Default Repository

    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.scripttask:task.builder.script
        configuration:
          interpreter: BINSH_OR_CMDEXE
          inlineBody: |
            rm -rf ~/.m2/repository/gov/gsa/
        description: Remove existing cnxs maven repo directory

    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.scripttask:task.builder.script
        configuration:
          interpreter: SHELL
          scriptFile: bamboo-deployment/build-determination-migration.sh
        description: Determine parent branch and pass correct variables

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject
        description: Inject values

    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.bamboo-variable-inject-plugin:dump
        configuration: {}

    # NEW (any-task): write settings-artifactory.xml
    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.scripttask:task.builder.script
        configuration:
          interpreter: SHELL
          inlineBody: |
            cat > settings-artifactory.xml <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>${bamboo.inject.pluginRepositoryUrl}</url>
                </mirror>
              </mirrors>

              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>${bamboo.inject.pluginRepositoryUrl}</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>${bamboo.inject.pluginRepositoryUrl}</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>

              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>

              <servers>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML
        description: Write Artifactory Maven settings

    # UPDATED: add -s settings-artifactory.xml to Maven goal
    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.maven:task.maven
        configuration:
          executable: Maven 3
          jdk: JDK 17
          goal: >
            -s settings-artifactory.xml
            clean verify -B -U
            -Dbamboo.inject.BranchName=${bamboo.inject.BranchName}
            -Dbamboo.inject.mavenFeatureRepositoryUrl=${bamboo.inject.mavenFeatureRepositoryUrl}
            -Dbamboo.inject.pluginRepositoryUrl=${bamboo.inject.pluginRepositoryUrl}
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          tests: "**/target/surefire-reports/*.xml,**/target/failsafe-reports/*.xml"
        description: Common Build and Verify

    # NEW (any-task): derive mavenVersion without the missing variable-extractor plugin
    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.scripttask:task.builder.script
        configuration:
          interpreter: SHELL
          inlineBody: |
            MVN_VERSION=$(/usr/share/maven/bin/mvn -s settings-artifactory.xml -q -DforceStdout help:evaluate -Dexpression=project.version)
            echo "mavenVersion=${MVN_VERSION}" >> file.properties
            echo "Detected mavenVersion=${MVN_VERSION}"
        description: Determine Maven version

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject
        description: Inject updated values (mavenVersion)

    # UPDATED: pass injected mavenVersion
    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.scripttask:task.builder.script
        configuration:
          interpreter: SHELL
          scriptFile: bamboo-deployment/deploy-to-artifactory-skip-bamboo-version-migrate.sh
          environmentVariables: |
            buildVersionQueryArtifact=${bamboo.buildVersionQueryArtifact}
            buildVersionQueryGroup=${bamboo.buildVersionQueryGroup}
            mavenVersion=${bamboo.inject.mavenVersion}
        description: Deploy to Artifactory if needed

  artifact-subscriptions: []

variables:
  # only keep these if they are NOT already defined globally in Bamboo
  buildVersionQueryArtifact: pricing-war
  buildVersionQueryGroup: gov.gsa.cnxs.pricing

repositories:
  - Pricing:
      scope: global
  - bamboo-deployment:
      scope: global

triggers:
  - bitbucket-server-trigger:
      repositories:
        - Pricing

branches:
  create: for-new-branch
  delete:
    after-deleted-days: 7
    after-inactive-days: 200
  link-to-jira: true

notifications:
  - events:
      - plan-failed
    recipients:
      - responsible
      - committers

  - events:
      - plan-completed
    recipients:
      - watchers

labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans:
    - BT-REC
    - BT-REST