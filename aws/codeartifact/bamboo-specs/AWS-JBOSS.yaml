version: 2

plan:
  project-key: AWS
  key: JBOSS
  name: JBoss Build and Push (AWS)

stages:
  - Build:
      manual: false
      final: false
      jobs:
        - Build_And_Push

Build_And_Push:
  key: JOB1
  requirements:
    - system.docker.executable
    - system.builder.command.aws
    - system.builder.command.kubectl

  tasks:
    - checkout:
        repository: bamboo-deployment
        path: bamboo-deployment
        force-clean-build: true
        description: Checkout bamboo-deployment repository

    - checkout:
        repository: scripts
        path: scripts
        force-clean-build: true
        description: Checkout scripts repository

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Preflight - verify required tools and workspace
        scripts:
          - |
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            echo "== Preflight: tools =="
            command -v git >/dev/null 2>&1 || { echo "ERROR: git not found"; exit 1; }
            command -v docker >/dev/null 2>&1 || { echo "ERROR: docker not found"; exit 1; }
            command -v aws >/dev/null 2>&1 || { echo "ERROR: aws not found"; exit 1; }
            command -v bash >/dev/null 2>&1 || { echo "ERROR: bash not found"; exit 1; }
            command -v mvn >/dev/null 2>&1 || { echo "ERROR: mvn not found"; exit 1; }

            echo "== Preflight: workspace =="
            pwd
            ls -la
            [ -d "${bamboo.build.working.directory}/bamboo-deployment" ] || { echo "ERROR: bamboo-deployment checkout missing"; exit 1; }
            [ -d "${bamboo.build.working.directory}/scripts" ] || { echo "ERROR: scripts checkout missing"; exit 1; }

            echo "== Preflight: versions =="
            git --version
            docker --version
            aws --version
            mvn -v | head -3

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Ensure bamboo-deployment branch is synced to develop
        scripts:
          - |
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            git fetch --all --prune

            if git show-ref --verify --quiet refs/heads/develop; then
              git checkout develop >/dev/null 2>&1 || git checkout -b develop origin/develop
            else
              git checkout -b develop origin/develop
            fi

            git reset --hard origin/develop
            git clean -fd
            git --no-pager log -1 --oneline

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Determine build metadata
        scripts:
          - |
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            if [ -f ./build-determination-migration.sh ]; then
              WRITE_MAVEN_SETTINGS=0 bash ./build-determination-migration.sh || true
            else
              echo "WARN: build-determination-migration.sh not found; continuing"
            fi

    - script:
        interpreter: BINSH_OR_CMDEXE
        description: Stage JBoss Dockerfiles from scripts repo
        scripts:
          - |
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            SCRIPTS_DIR="${bamboo.build.working.directory}/scripts/devvpc/dockers/jboss"
            DEST_DIR="${bamboo.build.working.directory}/bamboo-deployment"

            [ -d "$SCRIPTS_DIR" ] || { echo "ERROR: missing scripts dir: $SCRIPTS_DIR"; exit 1; }
            [ -d "$DEST_DIR" ] || { echo "ERROR: missing dest dir: $DEST_DIR"; exit 1; }

            for f in PortalDockerfile JmsDockerfile WebserviceDockerfile BrmsDockerfile ReportingDockerfile; do
              [ -f "$SCRIPTS_DIR/$f" ] || { echo "ERROR: missing Dockerfile: $SCRIPTS_DIR/$f"; exit 1; }
              cp -v "$SCRIPTS_DIR/$f" "$DEST_DIR/"
            done

            echo "Staged Dockerfiles:"
            ls -l "$DEST_DIR"/*Dockerfile

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Make helper scripts executable
        scripts:
          - |
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            [ -f ./download_artifacts.sh ] || { echo "ERROR: download_artifacts.sh missing"; exit 1; }
            [ -f ./builder.sh ] || { echo "ERROR: builder.sh missing"; exit 1; }

            chmod +x ./download_artifacts.sh
            chmod +x ./builder.sh

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Download JBoss artifacts from Artifactory
        scripts:
          - |
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            export ARTIFACTORY_BASE_URL="https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov"
            export ARTIFACTORY_USER="sa_bamboo"
            export ARTIFACTORY_TOKEN="${bamboo.artifactory_access_token_secret}"

            if [ -z "$ARTIFACTORY_TOKEN" ]; then
              echo "ERROR: missing bamboo.artifactory_access_token_secret"
              exit 1
            fi

            export INCLUDE_REPOS="conexus-snapshot-local,ll-tops-task-order-ahcs,conexus-plugin-repository,conexus-dependencies,ll-postgres"

            export INCLUDE_COORDS="gov.gsa.cnxs.ui:ui-war,gov.gsa.cnxs.rest:rest-ear,gov.gsa.cnxs.task:task-ear,gov.gsa.cnxs.ws:ws-services-ear,gov.gsa.cnxs.webservices:cnxs-ws-ear,gov.gsa.cnxs.dpa:dpa-ear,gov.gsa.cnxs.reconciliation:reconciliation-war,gov.gsa.cnxs.contract-mod:contract-mod-war,gov.gsa.cnxs.emulator:vendor-emulator-war,gov.gsa.cnxs.emulator:vendor-emulator-ear,gov.gsa.cnxs.reporting:reporting-war"

            export VERSION_HINTS="gov.gsa.cnxs.ui:ui-war:01.00.000.99-SNAPSHOT,gov.gsa.cnxs.rest:rest-ear:02.00.000.174-SNAPSHOT,gov.gsa.cnxs.task:task-ear:02.00.000.214-SNAPSHOT,gov.gsa.cnxs.ws:ws-services-ear:02.00.000.152-SNAPSHOT,gov.gsa.cnxs.webservices:cnxs-ws-ear:02.00.000.173-SNAPSHOT,gov.gsa.cnxs.dpa:dpa-ear:02.00.000.132-SNAPSHOT,gov.gsa.cnxs.reconciliation:reconciliation-war:02.00.000.148-SNAPSHOT,gov.gsa.cnxs.contract-mod:contract-mod-war:02.00.000.48-SNAPSHOT,gov.gsa.cnxs.emulator:vendor-emulator-war:02.00.000.140-SNAPSHOT,gov.gsa.cnxs.emulator:vendor-emulator-ear:02.00.000.139.1-SNAPSHOT,gov.gsa.cnxs.reporting:reporting-war:02.00.000.114-SNAPSHOT"

            export DL_DIR="${bamboo.build.working.directory}/bamboo-deployment/artifacts"
            export DEBUG=1

            mkdir -p "$DL_DIR"
            ./download_artifacts.sh

            echo "Downloaded artifacts:"
            ls -lh "$DL_DIR"

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Validate required artifacts
        scripts:
          - |
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            ARTIFACTS_DIR="${bamboo.build.working.directory}/bamboo-deployment/artifacts"
            rc=0

            [ -d "$ARTIFACTS_DIR" ] || { echo "ERROR: artifacts dir missing: $ARTIFACTS_DIR"; exit 1; }

            check_artifact() {
              label="$1"
              pattern="$2"
              if ls "${ARTIFACTS_DIR}"/${pattern} >/dev/null 2>&1; then
                echo "OK: ${label} -> ${pattern}"
              else
                echo "ERROR: Missing required artifact for ${label} (${pattern})"
                rc=1
              fi
            }

            check_artifact "portal" "ui-war-*.war"
            check_artifact "portal" "rest-ear-*.ear"

            check_artifact "jms" "task-ear-*.ear"

            check_artifact "webservice" "ws-services-ear-*.ear"
            check_artifact "webservice" "cnxs-ws-ear-*.ear"
            check_artifact "webservice" "dpa-ear-*.ear"

            check_artifact "brms" "reconciliation-war-*.war"
            check_artifact "brms" "contract-mod-war-*.war"
            check_artifact "brms" "vendor-emulator-war-*.war"

            check_artifact "reporting" "reporting-war-*.war"
            check_artifact "reporting" "vendor-emulator-ear-*.ear"

            if [ "$rc" -ne 0 ]; then
              echo "Artifact preflight failed."
              exit 1
            fi

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Verify Docker socket access
        scripts:
          - |
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            id
            groups
            stat -c '%U %G %a %n' /var/run/docker.sock || true

            docker info >/dev/null 2>&1 || {
              echo "ERROR: Docker CLI cannot access /var/run/docker.sock"
              echo "Hint: ensure Bamboo agent user is mapped to the docker socket GID and restart the agent container/service"
              exit 1
            }

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Login to ECR and pull base image
        scripts:
          - |
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            AWS_REGION="us-east-1"
            AWS_ACCOUNT_ID="339713019047"
            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            BASE_IMAGE="${ECR_REGISTRY}/conexus-jboss:ib8.0.8"

            aws sts get-caller-identity >/dev/null 2>&1 || { echo "ERROR: AWS credentials unavailable"; exit 1; }
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$BASE_IMAGE"

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Build JBoss service images
        scripts:
          - |
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            export ARTIFACTS_DIR="${bamboo.build.working.directory}/bamboo-deployment/artifacts"
            export DOCKER_BUILDKIT=0

            build_one() {
              svc="$1"
              echo "=================================================="
              echo "STARTING JBoss build for service: ${svc}"
              echo "=================================================="

              ./builder.sh -s "${svc}"
              echo "SUCCESS: ${svc} build completed."
            }

            for svc in portal jms webservice brms reporting; do
              build_one "$svc"
            done

            echo "Built releases:"
            ls -1 .release.* || true

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Compute release names for downstream deployment
        scripts:
          - |
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            OUT="${bamboo.build.working.directory}/bamboo-deployment/inject.properties"
            : > "$OUT"

            write_release() {
              svc="$1"
              file=".release.${svc}"
              key="release_${svc}"

              if [ -s "$file" ]; then
                val="$(head -n1 "$file")"
                echo "${key}=${val}" >> "$OUT"
                echo "Computed ${key}=${val}"
              else
                echo "ERROR: Missing release file ${file}"
                exit 1
              fi
            }

            for svc in portal jms webservice brms reporting; do
              write_release "$svc"
            done

            echo "inject.properties contents:"
            cat "$OUT"

    - inject-variables:
        description: Expose release names to deployment/project variables
        file: bamboo-deployment/inject.properties
        namespace: inject
        scope: RESULT

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Verify target ECR repositories exist
        scripts:
          - |
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            AWS_REGION="us-east-1"

            for repo in \
              conexus-jboss-portal \
              conexus-jboss-jms \
              conexus-jboss-webservice \
              conexus-jboss-brms \
              conexus-jboss-reporting
            do
              aws ecr describe-repositories \
                --region "$AWS_REGION" \
                --repository-names "$repo" >/dev/null 2>&1 || {
                  echo "ERROR: ECR repository does not exist: $repo"
                  exit 1
                }
              echo "OK: $repo exists"
            done

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Push built JBoss images to ECR
        scripts:
          - |
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            AWS_REGION="us-east-1"
            AWS_ACCOUNT_ID="339713019047"
            ECR_REPO_BASE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

            aws ecr get-authorization-token --region "$AWS_REGION" >/dev/null 2>&1 || {
              echo "ERROR: missing ecr:GetAuthorizationToken permission"
              exit 1
            }

            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REPO_BASE"

            repo_for() {
              case "$1" in
                portal) echo "conexus-jboss-portal" ;;
                jms) echo "conexus-jboss-jms" ;;
                webservice) echo "conexus-jboss-webservice" ;;
                brms) echo "conexus-jboss-brms" ;;
                reporting) echo "conexus-jboss-reporting" ;;
                *) echo "ERROR: unknown service: $1" >&2; return 1 ;;
              esac
            }

            : > image-digests.txt

            for svc in portal jms webservice brms reporting; do
              rel_file=".release.${svc}"
              [ -f "$rel_file" ] || { echo "ERROR: Expected release file missing: $rel_file"; exit 1; }

              rel="$(cat "$rel_file")"
              local_tag="conexus-jboss:${rel}"
              ecr_repo="$(repo_for "$svc")"
              ecr_tag="${ECR_REPO_BASE}/${ecr_repo}:${rel}"

              docker image inspect "$local_tag" >/dev/null 2>&1 || {
                echo "ERROR: local image not found: $local_tag"
                exit 1
              }

              echo "Pushing ${svc} -> ${ecr_tag}"
              docker tag "$local_tag" "$ecr_tag"
              docker push "$ecr_tag"

              dig="$(docker inspect --format='{{index .RepoDigests 0}}' "$ecr_tag" 2>/dev/null || true)"
              [ -n "$dig" ] && echo "${svc} ${rel} ${dig}" | tee -a image-digests.txt
            done

            echo "Final image digests:"
            cat image-digests.txt || true

  artifacts:
    - name: releases
      pattern: bamboo-deployment/.release.*
      required: false
      shared: false

    - name: digests
      pattern: bamboo-deployment/image-digests.txt
      required: false
      shared: false

    - name: inject-properties
      pattern: bamboo-deployment/inject.properties
      required: false
      shared: false

repositories:
  - bamboo-deployment:
      scope: global
  - scripts:
      scope: global

triggers:
  - polling:
      period: "10"