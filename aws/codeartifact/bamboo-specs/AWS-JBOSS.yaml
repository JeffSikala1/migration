version: 2

plan:
  project-key: AWS
  key: JBOSS
  name: JBoss Build and Push (AWS)

stages:
  - Build:
      manual: false
      final: false
      jobs:
        - Build_And_Push

Build_And_Push:
  key: JOB1
  requirements:
    - system.docker.executable
    - system.builder.command.aws
    - system.builder.command.kubectl

  tasks:
    - checkout:
        repository: "bamboo-deployment"
        path: bamboo-deployment
        force-clean-build: true
        description: Checkout bamboo-deployment repository

    - checkout:
        repository: "scripts"
        path: scripts
        force-clean-build: true
        description: Checkout scripts repository (Dockerfiles)

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Ensure bamboo-deployment branch (develop)
        scripts:
          - |
            set -eu
            git fetch --all --prune
            git checkout -B develop origin/develop || git checkout develop
            git reset --hard origin/develop || true
            git --no-pager log -1 --oneline

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Determine parent/target repos and write properties
        scripts:
          - |
            set -eu
            WRITE_MAVEN_SETTINGS=0 bash ./build-determination-migration.sh || true

    - script:
        interpreter: BINSH_OR_CMDEXE
        description: Stage service Dockerfiles from scripts repo
        scripts:
          - |
            set -e
            set -u
            ( set -o pipefail ) 2>/dev/null || true

            SCRIPTS_DIR="${bamboo.build.working.directory}/scripts/devvpc/dockers/jboss"
            DEST_DIR="${bamboo.build.working.directory}/bamboo-deployment"

            ls -l "$SCRIPTS_DIR" || true
            cp -v "$SCRIPTS_DIR"/PortalDockerfile     "$DEST_DIR"/ || true
            cp -v "$SCRIPTS_DIR"/JmsDockerfile        "$DEST_DIR"/ || true
            cp -v "$SCRIPTS_DIR"/WebserviceDockerfile "$DEST_DIR"/ || true
            cp -v "$SCRIPTS_DIR"/BrmsDockerfile       "$DEST_DIR"/ || true
            cp -v "$SCRIPTS_DIR"/ReportingDockerfile  "$DEST_DIR"/ || true

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Make scripts executable
        scripts:
          - |
            set -e
            set -u
            ( set -o pipefail ) 2>/dev/null || true
            chmod +x ./download_artifacts.sh || true
            chmod +x ./builder.sh || true

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Sanity – toolchain present?
        scripts:
          - |
            set -e
            docker --version
            aws --version
            mvn -v | head -3

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Download JBoss artifacts from Artifactory
        scripts:
          - |
            set -e
            set -u
            ( set -o pipefail ) 2>/dev/null || true

            export ARTIFACTORY_BASE_URL="https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov"
            export ARTIFACTORY_USER="sa_bamboo"
            export ARTIFACTORY_TOKEN="${bamboo.artifactory_access_token_secret}"

            export INCLUDE_REPOS="conexus-snapshot-local,conexus-plugin-repository,conexus-dependencies,ll-postgres,ll-tops-task-order-ahcs"

            export INCLUDE_COORDS="gov.gsa.cnxs.ui:ui-war,gov.gsa.cnxs.rest:rest-ear,gov.gsa.cnxs.task:task-ear,gov.gsa.cnxs.ws:ws-services-ear,gov.gsa.cnxs.webservices:cnxs-ws-ear,gov.gsa.cnxs.dpa:dpa-ear,gov.gsa.cnxs.reconciliation:reconciliation-war,gov.gsa.cnxs.contract-mod:contract-mod-war,gov.gsa.cnxs.emulator:vendor-emulator-war,gov.gsa.cnxs.emulator:vendor-emulator-ear,gov.gsa.cnxs.reporting:reporting-war"

            export VERSION_HINTS="gov.gsa.cnxs.ui:ui-war:01.00.000.99-SNAPSHOT,gov.gsa.cnxs.rest:rest-ear:02.00.000.174-SNAPSHOT,gov.gsa.cnxs.task:task-ear:02.00.000.214-SNAPSHOT,gov.gsa.cnxs.ws:ws-services-ear:02.00.000.152-SNAPSHOT,gov.gsa.cnxs.webservices:cnxs-ws-ear:02.00.000.173-SNAPSHOT,gov.gsa.cnxs.dpa:dpa-ear:02.00.000.132-SNAPSHOT,gov.gsa.cnxs.reconciliation:reconciliation-war:02.00.000.148-SNAPSHOT,gov.gsa.cnxs.contract-mod:contract-mod-war:02.00.000.48-SNAPSHOT,gov.gsa.cnxs.emulator:vendor-emulator-war:02.00.000.140-SNAPSHOT,gov.gsa.cnxs.reporting:reporting-war:02.00.000.114-SNAPSHOT"

            export DL_DIR="${bamboo.build.working.directory}/bamboo-deployment/artifacts"
            export DEBUG=1

            ./download_artifacts.sh
            ls -lh "${DL_DIR}" || true

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Preflight artifact validation for JBoss services
        scripts:
          - |
            set -eu

            ARTIFACTS_DIR="${bamboo.build.working.directory}/bamboo-deployment/artifacts"
            rc=0

            check_artifact() {
              label="$1"
              pattern="$2"
              if ls "${ARTIFACTS_DIR}"/${pattern} >/dev/null 2>&1; then
                echo "OK: ${label} -> ${pattern}"
              else
                echo "ERROR: Missing required artifact for ${label} (${pattern})"
                rc=1
              fi
            }

            check_artifact "portal" "ui-war-*.war"
            check_artifact "portal" "rest-ear-*.ear"

            check_artifact "jms" "task-ear-*.ear"

            check_artifact "webservice" "ws-services-ear-*.ear"
            check_artifact "webservice" "cnxs-ws-ear-*.ear"
            check_artifact "webservice" "dpa-ear-*.ear"

            check_artifact "brms" "reconciliation-war-*.war"
            check_artifact "brms" "contract-mod-war-*.war"
            check_artifact "brms" "vendor-emulator-war-*.war"

            check_artifact "reporting" "reporting-war-*.war"
            check_artifact "reporting" "vendor-emulator-ear-*.ear"

            if [ "$rc" -ne 0 ]; then
              echo "Artifact preflight failed."
              exit 1
            fi

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Build JBoss service images
        scripts:
          - |
            id; groups; stat -c '%U %G %a %n' /var/run/docker.sock
            docker info >/dev/null || { echo "ERROR: docker unusable from agent task"; exit 2; }

            if ! docker info >/dev/null 2>&1; then
              echo "ERROR: Docker CLI cannot access /var/run/docker.sock. Check group mapping & restart agent."
              echo "Hint: add bamboo to GID $(stat -c '%g' /var/run/docker.sock) inside the container, then docker restart <agent>."
              exit 1
            fi

            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            export ARTIFACTS_DIR="${bamboo.build.working.directory}/bamboo-deployment/artifacts"
            export DOCKER_BUILDKIT=0

            build_one() {
              svc="$1"
              echo "=================================================="
              echo "STARTING JBoss build for service: ${svc}"
              echo "=================================================="

              if ./builder.sh -s "${svc}"; then
                echo "SUCCESS: ${svc} build completed."
              else
                rc=$?
                echo "ERROR: ${svc} build failed with exit code ${rc}."
                echo "Check the log section above for the exact missing artifact, Dockerfile issue, or docker build failure."
                exit "${rc}"
              fi
            }

            build_one portal
            build_one jms
            build_one webservice
            build_one brms
            build_one reporting

            echo "Built releases:"
            ls -1 .release.* || true

    - script:
        description: Compute release names for JBoss services
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        scripts:
          - |
            #!/bin/sh
            set -eu

            OUT="${bamboo.build.working.directory}/inject.properties"
            : > "$OUT"

            write_release() {
              svc="$1"
              file=".release.${svc}"
              key="release_${svc}"

              if [ -s "$file" ]; then
                val="$(head -n1 "$file")"
                echo "${key}=${val}" >> "$OUT"
                echo "Computed ${key}=${val}"
              else
                echo "ERROR: Missing release file ${file}"
                exit 1
              fi
            }

            write_release portal
            write_release jms
            write_release webservice
            write_release brms
            write_release reporting

    - inject-variables:
        description: Expose release names to Deployment
        file: "inject.properties"
        namespace: "inject"
        scope: RESULT

    - script:
        interpreter: BINSH_OR_CMDEXE
        working-dir: bamboo-deployment
        description: Push built JBoss images to ECR
        scripts:
          - |
            id; groups; stat -c '%U %G %a %n' /var/run/docker.sock
            docker info >/dev/null || { echo "ERROR: docker unusable from agent task"; exit 2; }

            if ! docker info >/dev/null 2>&1; then
              echo "ERROR: Docker CLI cannot access /var/run/docker.sock. Check group mapping & restart agent."
              echo "Hint: add bamboo to GID $(stat -c '%g' /var/run/docker.sock) inside the container, then docker restart <agent>."
              exit 1
            fi

            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            AWS_REGION="us-east-1"
            AWS_ACCOUNT_ID="339713019047"
            ECR_REPO_BASE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

            if ! aws ecr get-authorization-token --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "ERROR: missing ecr:GetAuthorizationToken on this role." >&2
              exit 1
            fi

            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPO_BASE}"

            repo_for() {
              case "$1" in
                portal) echo "conexus-jboss-portal" ;;
                jms) echo "conexus-jboss-jms" ;;
                webservice) echo "conexus-jboss-webservice" ;;
                brms) echo "conexus-jboss-brms" ;;
                reporting) echo "conexus-jboss-reporting" ;;
                *) echo "" ;;
              esac
            }

            : > image-digests.txt

            for svc in portal jms webservice brms reporting; do
              rel_file=".release.${svc}"

              if [ ! -f "$rel_file" ]; then
                echo "ERROR: Expected release file missing for ${svc}: ${rel_file}"
                exit 1
              fi

              rel="$(cat "$rel_file")"
              local_tag="conexus-jboss:${rel}"
              ecr_repo="$(repo_for "$svc")"
              ecr_tag="${ECR_REPO_BASE}/${ecr_repo}:${rel}"

              echo "→ Pushing ${svc}:${rel}"
              docker tag "$local_tag" "$ecr_tag"
              docker push "$ecr_tag"

              dig="$(docker inspect --format='{{index .RepoDigests 0}}' "$ecr_tag" 2>/dev/null || true)"
              [ -n "$dig" ] && echo "${svc} ${rel} ${dig}" | tee -a image-digests.txt
            done

  artifacts:
    - name: releases
      pattern: "bamboo-deployment/.release.*"
      required: false

    - name: digests
      pattern: "bamboo-deployment/image-digests.txt"
      required: false

repositories:
  - bamboo-deployment:
      scope: global
  - scripts:
      scope: global

triggers:
  - polling:
      period: "10"