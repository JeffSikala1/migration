---
version: 2
plan:
  project-key: BT
  key: REC
  name: Reconciliation - Build

stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Default Job

Default Job:
  key: JOB1
  other:
    clean-working-dir: true
    all-other-apps:
      custom:
        auto: {}
        buildHangingConfig.enabled: 'false'

  tasks:
    # com.atlassian.bamboo.plugins.bamboo-docker-plugin:task.docker.cli is disabled. This state is not supported at YAML
    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - checkout:
        repository: bamboo-deployment
        path: bamboo-deployment
        force-clean-build: true
        description: Checkout bamboo-deployment

    - script:
        interpreter: SHELL
        scripts:
          - rm -rf ~/.m2/repository/gov/gsa/
        description: Remove existing cnxs maven repo directory

    - script:
        interpreter: SHELL
        file: bamboo-deployment/build-determination-migration.sh
        description: Determine parent branch and pass correct variables

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject
        description: Inject values

    - script:
        interpreter: SHELL
        scripts:
          - |-
            cat > settings-artifactory.xml <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
              <mirrors>
                <mirror>
                  <id>ArtifactoryPluginRepos</id>
                  <!-- Mirror everything EXCEPT snapshot-local so SNAPSHOT deps can come from snapshot-local -->
                  <mirrorOf>*,!conexus-snapshot-local</mirrorOf>
                  <url>${bamboo.inject.pluginRepositoryUrl}</url>
                </mirror>
              </mirrors>

              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>conexus-plugin-repository</id>
                      <url>${bamboo.inject.pluginRepositoryUrl}</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                    <repository>
                      <id>conexus-snapshot-local</id>
                      <url>${bamboo.inject.mavenFeatureRepositoryUrl}</url>
                      <releases><enabled>false</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>

                  <pluginRepositories>
                    <pluginRepository>
                      <id>conexus-plugin-repository</id>
                      <url>${bamboo.inject.pluginRepositoryUrl}</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>

              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>

              <servers>
                <server>
                  <id>cnxs-artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>

                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>

                <server>
                  <id>conexus-plugin-repository</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>

                <server>
                  <id>conexus-snapshot-local</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>

                <server>
                  <id>ArtifactoryPluginRepos</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>

                <server>
                  <id>ArtifactoryMavenFeatureRepos</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML
        description: Write Artifactory Maven settings

    - script:
        interpreter: SHELL
        scripts:
          - >-
            /usr/share/maven/bin/mvn
            -s settings-artifactory.xml
            -Djava.io.tmpdir=/tmp/BT-REC-JOB1
            clean package -B -U
            -pl :reconciliation-war -am
            -DskipTests -DskipITs=true -Dmaven.test.skip=true
            -Dbamboo.inject.BranchName=${bamboo.inject.BranchName}
            -Dbamboo.inject.RawBranchName=${bamboo.inject.RawBranchName}
            -Dbamboo.inject.ParentBranchName=${bamboo.inject.ParentBranchName}
            -Dbamboo.inject.ChildBranchName=${bamboo.inject.ChildBranchName}
            -Dbamboo.inject.mavenFeatureRepositoryUrl=${bamboo.inject.mavenFeatureRepositoryUrl}
            -Dbamboo.inject.pluginRepositoryUrl=${bamboo.inject.pluginRepositoryUrl}
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        description: Build (package only, skip tests/ITs) using Artifactory settings

    - script:
        interpreter: SHELL
        scripts:
          - |-
            ARTIFACT_ID=$(/usr/share/maven/bin/mvn -f war/pom.xml -s settings-artifactory.xml -q -DforceStdout help:evaluate -Dexpression=project.artifactId | sed '/^\[/d' | grep -v '^$' | tail -1)
            MVN_VERSION=$(/usr/share/maven/bin/mvn -f war/pom.xml -s settings-artifactory.xml -q -DforceStdout help:evaluate -Dexpression=project.version | sed '/^\[/d' | grep -v '^$' | tail -1)

            [ -n "${ARTIFACT_ID}" ] || { echo "ERROR: could not determine artifactId"; exit 1; }
            [ -n "${MVN_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            echo "mavenVersion=${ARTIFACT_ID}-${MVN_VERSION}" >> file.properties
            echo "mavenArtifactId=${ARTIFACT_ID}" >> file.properties
            echo "mavenRawVersion=${MVN_VERSION}" >> file.properties

            echo "Detected mavenVersion=${ARTIFACT_ID}-${MVN_VERSION}"
        description: Determine deployable module version

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject
        description: Inject updated values (mavenVersion)

    - script:
        interpreter: SHELL
        scripts:
          - >-
            /usr/share/maven/bin/mvn
            -s settings-artifactory.xml
            -Djava.io.tmpdir=/tmp/BT-REC-JOB1
            deploy -B -U
            -pl :reconciliation-war -am
            -DaltDeploymentRepository=artifactory::${bamboo.inject.mavenFeatureRepositoryUrl}
            -DskipTests -DskipITs=true -Dmaven.test.skip=true
            -Dbamboo.inject.BranchName=${bamboo.inject.BranchName}
            -Dbamboo.inject.RawBranchName=${bamboo.inject.RawBranchName}
            -Dbamboo.inject.ParentBranchName=${bamboo.inject.ParentBranchName}
            -Dbamboo.inject.ChildBranchName=${bamboo.inject.ChildBranchName}
            -Dbamboo.inject.mavenFeatureRepositoryUrl=${bamboo.inject.mavenFeatureRepositoryUrl}
            -Dbamboo.inject.pluginRepositoryUrl=${bamboo.inject.pluginRepositoryUrl}
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        description: Deploy WAR only to Artifactory (skip tests/ITs)

    - inject-variables:
        file: file.properties
        scope: RESULT
        namespace: inject
        description: Inject the build information to be used in Bamboo Deploy

  artifacts: []

  artifact-subscriptions: []

variables:
  buildVersionQueryArtifact: reconciliation-war
  buildVersionQueryGroup: gov.gsa.cnxs.reconciliation

repositories:
  - Reconciliation:
      scope: global
  - bamboo-deployment:
      scope: global

triggers:
  - bitbucket-server-trigger:
      repositories:
        - Reconciliation

branches:
  create: for-new-branch
  delete:
    after-deleted-days: 7
    after-inactive-days: 200
  link-to-jira: true

notifications:
  - events:
      - plan-failed
    recipients:
      - responsible
      - committers
      - watchers

  - events:
      - plan-completed
    recipients:
      - watchers

  - events:
      - plan-failed
    recipients:
      - responsible
      - committers

labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []