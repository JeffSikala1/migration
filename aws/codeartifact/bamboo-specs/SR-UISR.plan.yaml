---
version: 2
plan:
  project-key: SR
  key: UISR
  name: (03b) UI - Start Release

stages:
  - Default Stage:
      jobs:
        - Gitflow release start

  - Deploy RC:
      jobs:
        - Deploy RC

  - Update dependencies to latest snapshot versions:
      jobs:
        - Update dependencies to latest snapshot versions

  - Delete release branch if failed:
      final: true
      jobs:
        - Delete release branch if failed

Gitflow release start:
  key: JOB1
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true

    - script:
        interpreter: SHELL
        description: Validate SSH keys
        scripts:
          - |
            set -eu
            test -s /opt/bamboo-keys/bitbucket_ci
            test -s /opt/bamboo-keys/bitbucket_ci_jgit

    - script:
        interpreter: SHELL
        description: Write Maven settings
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            cat > "${SETTINGS_FILE}" <<XML
            <settings>
              <mirrors>
                <mirror>
                  <id>central</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Determine release metadata
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version | grep -v '^\[' | tail -1)
            RELEASE_BRANCH="release/${VERSION%-SNAPSHOT}"

            echo "VERSION=${VERSION}" > .release-context
            echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> .release-context

            echo "Version: ${VERSION}"
            echo "Release branch: ${RELEASE_BRANCH}"

    - script:
        interpreter: SHELL
        description: Validate release preconditions
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
              echo "ERROR: final tag ${RELEASE_VERSION} already exists"
              exit 1
            fi

            ACTIVE_RELEASES=$(git ls-remote --heads origin 'refs/heads/release/*' | awk '{sub("refs/heads/","",$2); print $2}' || true)

            if printf '%s\n' "${ACTIVE_RELEASES}" | grep -qx "${RELEASE_BRANCH}"; then
              echo "Target release branch ${RELEASE_BRANCH} already exists; allowing rerun"
            else
              echo "Target release branch ${RELEASE_BRANCH} does not yet exist"
            fi

            OTHER_RELEASES=$(printf '%s\n' "${ACTIVE_RELEASES}" | grep -v '^$' | grep -v "^${RELEASE_BRANCH}$" || true)

            if [ -n "${OTHER_RELEASES}" ]; then
              echo "WARNING: other remote release branches exist, but continuing:"
              printf '  %s\n' ${OTHER_RELEASES}
            else
              echo "No other remote release branches found"
            fi

            git fetch origin +refs/heads/*:refs/remotes/origin/* --prune --tags
            git checkout -B develop origin/develop
            git reset --hard origin/develop

    - script:
        interpreter: SHELL
        description: Prepare SSH environment for JGit/JSch
        scripts:
          - |
            set -eu
            export HOME="${HOME:-/root}"

            mkdir -p "${HOME}/.ssh"
            chmod 700 "${HOME}/.ssh"

            cp /opt/bamboo-keys/bitbucket_ci_jgit "${HOME}/.ssh/id_rsa"
            chmod 600 "${HOME}/.ssh/id_rsa"

            cat > "${HOME}/.ssh/config" <<EOF
            Host bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov
              HostName bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov
              User git
              Port 7999
              IdentityFile ${HOME}/.ssh/id_rsa
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
            EOF
            chmod 600 "${HOME}/.ssh/config"

            ssh-keyscan -p 7999 bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov >> "${HOME}/.ssh/known_hosts" 2>/dev/null || true
            chmod 644 "${HOME}/.ssh/known_hosts"

    - script:
        interpreter: SHELL
        description: Create release branch from develop
        scripts:
          - |
            set -eu
            . ./.release-context

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            git fetch origin +refs/heads/*:refs/remotes/origin/* --prune --tags
            git checkout -B develop origin/develop
            git reset --hard origin/develop

            if git ls-remote --exit-code --heads origin "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
              echo "${RELEASE_BRANCH} already exists; allowing rerun"
            else
              git checkout -b "${RELEASE_BRANCH}"
              git push origin "${RELEASE_BRANCH}"
            fi

    - script:
        interpreter: SHELL
        description: Convert SNAPSHOT to RC on release branch
        scripts:
          - |
            set -eu
            . ./.release-context

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes'
            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            git fetch origin +refs/heads/*:refs/remotes/origin/* --tags
            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"

            if find . -name pom.xml -print | xargs grep -q -- '-SNAPSHOT'; then
              find . -name pom.xml -exec sed -i 's/-SNAPSHOT/-RC/g' {} +

              git config user.name "bamboo"
              git config user.email "bamboo@local"

              find . -name pom.xml -print0 | xargs -0 git add

              if ! git diff --cached --quiet; then
                git commit -m "Update SNAPSHOT to RC"
                git push origin HEAD:"${RELEASE_BRANCH}"
              fi
            else
              echo "No SNAPSHOT versions found in pom.xml files"
            fi

Deploy RC:
  key: DR
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true

    - script:
        interpreter: SHELL
        description: Validate SSH keys
        scripts:
          - |
            set -eu
            test -s /opt/bamboo-keys/bitbucket_ci

    - script:
        interpreter: SHELL
        description: Write Maven settings
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            cat > "${SETTINGS_FILE}" <<XML
            <settings>
              <mirrors>
                <mirror>
                  <id>central</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Determine release metadata
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version | grep -v '^\[' | tail -1)
            RELEASE_BRANCH="release/${VERSION%-SNAPSHOT}"

            echo "VERSION=${VERSION}" > .release-context
            echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> .release-context

            echo "Version: ${VERSION}"
            echo "Release branch: ${RELEASE_BRANCH}"

    - script:
        interpreter: SHELL
        description: Checkout release branch
        scripts:
          - |
            set -eu
            . ./.release-context

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes'
            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            git fetch origin +refs/heads/*:refs/remotes/origin/* --tags
            git rev-parse --verify "origin/${RELEASE_BRANCH}" >/dev/null 2>&1
            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"

    - script:
        interpreter: SHELL
        description: Angular build
        working-dir: web/src/main/
        scripts:
          - |
            set -euo pipefail

            export NODE_EXTRA_CA_CERTS=/etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.crt

            NEW_NPM_REGISTRY="https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/npm/npm-remote/"
            NPM_HOST_PATH="//artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/npm/npm-remote/"

            yum install -y google-chrome-stable || true

            echo "Checking for npm config sources..."
            npm config get registry || true
            [ -f ~/.npmrc ] && { echo "=== ~/.npmrc ==="; cat ~/.npmrc; } || true
            [ -f .npmrc ] && { echo "=== local .npmrc ==="; cat .npmrc; } || true
            [ -f package-lock.json ] && echo "package-lock.json exists" || true

            echo "Removing old npm config overrides..."
            npm config delete registry || true
            rm -f ~/.npmrc .npmrc

            echo "Writing clean authenticated ~/.npmrc for current Artifactory..."
            cat > ~/.npmrc <<EOF
            registry=${NEW_NPM_REGISTRY}
            always-auth=true
            ${NPM_HOST_PATH}:username=sa_bamboo
            ${NPM_HOST_PATH}:_password=$(printf '%s' "${bamboo.artifactory_access_token_secret}" | base64 -w0)
            ${NPM_HOST_PATH}:email=bamboo@local
            EOF

            echo "Removing stale lockfile so npm does not reuse old resolved tarball URLs..."
            rm -f package-lock.json

            npm cache clean --force || true

            echo "Effective registry:"
            npm config get registry

            echo "Checking required Angular package in target registry..."
            if ! npm view @angular-devkit/architect version --registry="${NEW_NPM_REGISTRY}" >/dev/null 2>&1; then
              echo "ERROR: @angular-devkit/architect is not available in ${NEW_NPM_REGISTRY}"
              echo "This is now an Artifactory npm repository content/configuration issue, not a Bamboo auth or stale-lockfile issue."
              exit 1
            fi

            npm install --registry="${NEW_NPM_REGISTRY}"
            npm test --registry="${NEW_NPM_REGISTRY}"

            ./node_modules/.bin/ng build --configuration production --output-hashing=all --optimization

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U clean deploy
          -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-rc-local
          -s /tmp/settings-${bamboo.buildResultKey}.xml

Update dependencies to latest snapshot versions:
  key: SMD
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true

    - script:
        interpreter: SHELL
        description: Validate SSH keys
        scripts:
          - |
            set -eu
            test -s /opt/bamboo-keys/bitbucket_ci

    - script:
        interpreter: SHELL
        description: Write Maven settings
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            cat > "${SETTINGS_FILE}" <<XML
            <settings>
              <mirrors>
                <mirror>
                  <id>central</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Sync develop
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes'
            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            git fetch origin +refs/heads/*:refs/remotes/origin/* --tags
            git checkout -B develop origin/develop
            git reset --hard origin/develop

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U versions:update-parent versions:update-properties
          -DallowSnapshots=true
          -DgenerateBackupPoms=false
          -s /tmp/settings-${bamboo.buildResultKey}.xml

    - script:
        interpreter: SHELL
        description: Commit updated dependency versions if changed
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes'
            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            if ! git diff --quiet; then
              git add --all
              git commit -m "updated-parent-and-properties"
              git push origin HEAD:develop
            else
              echo "No dependency updates to commit"
            fi

    - script:
        interpreter: SHELL
        description: Angular build
        working-dir: web/src/main/
        scripts:
          - |
            set -euo pipefail

            export NODE_EXTRA_CA_CERTS=/etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.crt

            NEW_NPM_REGISTRY="https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/npm/npm-remote/"
            NPM_HOST_PATH="//artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/npm/npm-remote/"

            yum install -y google-chrome-stable || true

            echo "Checking for npm config sources..."
            npm config get registry || true
            [ -f ~/.npmrc ] && { echo "=== ~/.npmrc ==="; cat ~/.npmrc; } || true
            [ -f .npmrc ] && { echo "=== local .npmrc ==="; cat .npmrc; } || true
            [ -f package-lock.json ] && echo "package-lock.json exists" || true

            echo "Removing old npm config overrides..."
            npm config delete registry || true
            rm -f ~/.npmrc .npmrc

            echo "Writing clean authenticated ~/.npmrc for current Artifactory..."
            cat > ~/.npmrc <<EOF
            registry=${NEW_NPM_REGISTRY}
            always-auth=true
            ${NPM_HOST_PATH}:username=sa_bamboo
            ${NPM_HOST_PATH}:_password=$(printf '%s' "${bamboo.artifactory_access_token_secret}" | base64 -w0)
            ${NPM_HOST_PATH}:email=bamboo@local
            EOF

            echo "Removing stale lockfile so npm does not reuse old resolved tarball URLs..."
            rm -f package-lock.json

            npm cache clean --force || true

            echo "Effective registry:"
            npm config get registry

            echo "Checking required Angular package in target registry..."
            if ! npm view @angular-devkit/architect version --registry="${NEW_NPM_REGISTRY}" >/dev/null 2>&1; then
              echo "ERROR: @angular-devkit/architect is not available in ${NEW_NPM_REGISTRY}"
              echo "This is now an Artifactory npm repository content/configuration issue, not a Bamboo auth or stale-lockfile issue."
              exit 1
            fi

            npm install --registry="${NEW_NPM_REGISTRY}"
            npm test --registry="${NEW_NPM_REGISTRY}"

            ./node_modules/.bin/ng build --configuration production --output-hashing=all --optimization

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U clean deploy
          -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository
          -s /tmp/settings-${bamboo.buildResultKey}.xml

Delete release branch if failed:
  key: DRBIF
  other:
    clean-working-dir: true

  tasks:
    - checkout:
        force-clean-build: true

    - script:
        interpreter: SHELL
        description: Validate SSH keys
        scripts:
          - |
            set -eu
            test -s /opt/bamboo-keys/bitbucket_ci

    - script:
        interpreter: SHELL
        description: Write Maven settings
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            cat > "${SETTINGS_FILE}" <<XML
            <settings>
              <mirrors>
                <mirror>
                  <id>central</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Cleanup on failure
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            if [ "${bamboo.buildFailed}" != "true" ]; then
              echo "Build did not fail, nothing to clean up"
              exit 0
            fi

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1 || true)

            if [ -z "${CURRENT_VERSION}" ]; then
              echo "Could not determine Maven version during cleanup; skipping cleanup"
              exit 0
            fi

            RELEASE_BRANCH="release/${CURRENT_VERSION%-SNAPSHOT}"
            echo "Computed release branch: ${RELEASE_BRANCH}"

            if git ls-remote --exit-code --heads origin "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
              echo "Deleting ${RELEASE_BRANCH}"
              git push origin --delete "${RELEASE_BRANCH}" || true
            else
              echo "No matching release branch found to delete"
            fi

            exit 0

repositories:
  - UI:
      scope: global
