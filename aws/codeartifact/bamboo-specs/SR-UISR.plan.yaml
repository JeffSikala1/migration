---
version: 2
plan:
  project-key: SR
  key: UISR
  name: (03b) UI - Start Release
stages:
- Default Stage:
    manual: false
    final: false
    jobs:
    - Gitflow release start
- Deploy RC:
    manual: false
    final: false
    jobs:
    - Deploy RC
- Snapshot Maven Deploy:
    manual: false
    final: false
    jobs:
    - Snapshot Maven Deploy
Gitflow release start:
  key: JOB1
  tasks:
  - clean
  - checkout:
      force-clean-build: true
      description: Checkout Default Repository
  - script:
      interpreter: SHELL
      scripts:
      - |-
        #!/usr/bin/env bash

        # Copy in the SSH Key
        echo "Writing private key"
        curl -k -u sa_conexus:${bamboo_artifactory_auth} "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/keys/s_bamboo_git" -o ~/.ssh/id_rsa
        chmod 400 ~/.ssh/id_rsa

        # Configure git to use this key
        echo "Host *" &gt; ~/.ssh/config
        echo "    IdentityFile ~/.ssh/id_rsa" &gt;&gt; ~/.ssh/config
      description: Install SSH key
  - any-task:
      plugin-key: com.atlassian.bamboo.plugins.variable.updater.variable-updater-generic:variable-extractor
      configuration:
        variable: currentVersion
        removeSnapshot: 'true'
        variableScope: JOB
      description: Get current version
  - script:
      interpreter: SHELL
      scripts:
      - |-
        #!/usr/bin/env bash
        echo "Checking for tag version ${bamboo_currentVersion}"

        git remote set-url origin ${bamboo.planRepository.repositoryUrl}

        # If the currentVersionm, from the previous Maven version variable
        # extractor, is also a tag version, then the tag version/name will be in
        # the variable $does_tag_exist
        # Else $does_tag_exist will be a null string
        does_tag_exist=$(git tag -l ${bamboo.currentVersion})
        echo $does_tag_exist

        if [ $does_tag_exist ]; then
          echo "Deleting the tag $does_tag_exist"
          echo "git tag -d $does_tag_exist"
          git tag -d $does_tag_exist
          echo "git push --delete origin $does_tag_exist"
          git push --delete origin $does_tag_exist
        else
            echo "No tag found"
        fi
      environment: GIT_SSH_COMMAND='ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes'
      description: Delete tag, if it already exists
  - script:
      interpreter: SHELL
      scripts:
      - "#!/usr/bin/env bash\n\ngit remote set-url origin ${bamboo.planRepository.repositoryUrl}\ngit pull\nrelease_branch=$(git branch -r | grep -oP '(?&lt;=origin\\/)release\\/.*')\n\n# Handle the case of more than one release branch\nif [ -n \"${release_branch}\" ]; then\n  for i in \"${release_branch[@]}\"; do\n    echo \"Deleting the release branch $i\"\n        git push origin --delete $i\n        git branch -D $i\n        git fetch\n  done\nelse\n        echo \"No release branch\"\n        exit 0 \nfi"
      environment: GIT_SSH_COMMAND='ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes'
      description: Delete Release Branch
  - script:
      interpreter: SHELL
      scripts:
      - |-
        #!/usr/bin/env bash

        git checkout develop
        git branch -a
      environment: GIT_SSH_COMMAND='ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes'
      description: Pull latest Develop branch
  - maven:
      executable: Maven 3
      jdk: JDK 17
      goal: -U -B external.atlassian.jgitflow:jgitflow-maven-plugin:release-start -DpushReleases=true -DallowSnapshots=true -DenableSshAgent=true -DdefaultOriginUrl=${bamboo.planRepository.repositoryUrl} -s /usr/share/maven/conf/settings-release.xml
      environment: GIT_SSH_COMMAND='ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes'
      description: GitFlow Release Start
  - script:
      interpreter: SHELL
      scripts:
      - |-
        #!/usr/bin/env bash

        git remote set-url origin ${bamboo.planRepository.repositoryUrl}
        git pull

        git branch

        find . -type f -name pom.xml -exec sed -i 's/SNAPSHOT/RC/g' {} +
        git commit -a -m "Updated versions from SNAPSHOT to RC"
        git config --global push.default simple
        git push
        #git push --set-upstream origin $BRANCH_NAME
      environment: GIT_SSH_COMMAND='ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes'
      description: Update SNAPSHOT with RC
  artifact-subscriptions: []
Deploy RC:
  key: DR
  tasks:
  - checkout:
      force-clean-build: true
  - script:
      interpreter: SHELL
      scripts:
      - |-
        #!/usr/bin/env bash

        # Copy in the SSH Key
        echo "Writing private key"
        curl -k -u sa_conexus:${bamboo_artifactory_auth} "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/keys/s_bamboo_git" -o ~/.ssh/id_rsa
        chmod 400 ~/.ssh/id_rsa
      description: Obtain SSH Key
  - script:
      interpreter: SHELL
      scripts:
      - |-
        #!/usr/bin/env bash

        git remote set-url origin ${bamboo.planRepository.repositoryUrl}
        git pull

        release_branch=$(git branch -r | grep -oP '(?&lt;=origin\/)release\/.*')

        echo "Release branch is set from grep above is $release_branch"

        if [ -z "${release_branch}" ]; then
            echo "Failed to match release branch from the following: "
            git branch -r
            #exit 1
        else
            echo "Checking out ${release_branch}"
            git checkout "${release_branch}"
        fi
      environment: GIT_SSH_COMMAND='ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes'
      description: Checkout release branch
  - script:
      interpreter: SHELL
      scripts:
      - |-
        #!/usr/bin/env bash
        source ~/.bashrc

        export NODE_EXTRA_CA_CERTS=/etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.crt

        # Install/Update Google Chrome for Headless testing
        curl https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/file-local/google-chrome.repo &gt; /etc/yum.repos.d/google-chrome.repo
        yum install -y google-chrome-stable

        npm config set registry https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/npm/npm-remote/

        #SASS_BINARY_SITE='https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/file-local/node-sass/' npm install
        npm install
        npm test


        # pre angular 14
        #ng build --prod --build-optimizer --output-hashing=all --vendor-chunk --optimization --progress
        ng build --configuration production --output-hashing=all --optimization --progress

        # New - needs extra node parameters because source-map generation takes more memory
        #node --max_old_space_size=8192 \
        #     node_modules/@angular/cli/bin/ng build \
        #     --prod --build-optimizer --output-hashing=all --vendor-chunk  --optimization --source-map=true
      working-dir: web/src/main/
      description: ng build
  - maven:
      executable: Maven 3
      jdk: JDK 17
      goal: -U clean deploy -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-rc-local -s /usr/share/maven/conf/settings-release.xml
      environment: GIT_SSH_COMMAND='ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes'
      description: Deploy RC to RC repo
  artifact-subscriptions: []
Snapshot Maven Deploy:
  key: SMD
  tasks:
  - checkout:
      force-clean-build: true
  - script:
      interpreter: SHELL
      scripts:
      - |-
        #!/usr/bin/env bash

        # Copy in the SSH Key
        echo "Writing private key"
        curl -k -u sa_conexus:${bamboo_artifactory_auth} "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/keys/s_bamboo_git" -o ~/.ssh/id_rsa
        chmod 400 ~/.ssh/id_rsa
      description: Obtain SSH Key
  - script:
      interpreter: SHELL
      scripts:
      - |-
        git remote set-url origin ${bamboo.planRepository.repositoryUrl}
        git pull origin develop
      description: Pull Latest Develop branch
  - script:
      interpreter: SHELL
      scripts:
      - |-
        #!/usr/bin/env bash
        source ~/.bashrc

        export NODE_EXTRA_CA_CERTS=/etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.crt

        # Install/Update Google Chrome for Headless testing
        curl https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/file-local/google-chrome.repo &gt; /etc/yum.repos.d/google-chrome.repo
        yum install -y google-chrome-stable

        npm config set registry https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/npm/npm/

        SASS_BINARY_SITE='https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/file-local/node-sass/' npm install
        npm install
        npm test

        ng build --prod --build-optimizer --output-hashing=all --vendor-chunk --progress
      working-dir: web/src/main/
      description: ng build
  - maven:
      executable: Maven 3
      jdk: JDK 11
      goal: -U clean deploy -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository -s /usr/share/maven/conf/settings-release.xml
      description: Maven Deploy to Artifactory
  artifact-subscriptions: []
variables:
  bamboo_artifactory_auth: AP2cdT4jUtzhqTLUr5cuWQDEYWPLmHqXWmY6WiewBbibWDB2n2ivK2oD1o2GCJY3j3QRqtw
repositories:
- UI:
    scope: global
triggers: []
branches:
  create: manually
  delete: never
  link-to-jira: true
notifications: []
labels: []
dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []