---
version: 2
plan:
  project-key: SR
  key: UISR
  name: (03b) UI - Start Release

stages:
  - Default Stage:
      jobs:
        - Gitflow release start

  - Deploy RC:
      jobs:
        - Deploy RC

  - Update dependencies to latest snapshot versions:
      jobs:
        - Update dependencies to latest snapshot versions

  - Delete release branch if failed:
      final: true
      jobs:
        - Delete release branch if failed


Gitflow release start:
  key: JOB1
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true

    - script:
        interpreter: SHELL
        description: Validate SSH keys
        scripts:
          - |
            set -eu
            test -s /opt/bamboo-keys/bitbucket_ci
            test -s /opt/bamboo-keys/bitbucket_ci_jgit

    - script:
        interpreter: SHELL
        description: Write Maven settings
        scripts:
          - |
            set -eu
            SETTINGS_FILE=/tmp/settings-${bamboo.buildResultKey}.xml

            cat > "$SETTINGS_FILE" <<XML
            <settings>
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <servers>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Determine version + branch
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "$SETTINGS_FILE" help:evaluate -Dexpression=project.version | grep -v '\[' | tail -1)
            RELEASE_BRANCH="release/${VERSION%-SNAPSHOT}"

            echo "Version: $VERSION"
            echo "Branch: $RELEASE_BRANCH"

    - script:
        interpreter: SHELL
        description: Cleanup old tags
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes'

            VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | grep -v '\[' | tail -1)
            CLEAN=${VERSION%-SNAPSHOT}

            git fetch --tags

            if git tag -l "$CLEAN" | grep -q .; then
              git tag -d "$CLEAN" || true
              git push origin ":refs/tags/$CLEAN"
            fi

    - script:
        interpreter: SHELL
        description: Clean old release branches
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes'

            git fetch origin --prune

            for b in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/release || true); do
              git push origin --delete "$b" || true
            done

    - script:
        interpreter: SHELL
        description: Sync develop
        scripts:
          - |
            set -eu
            git fetch origin
            git checkout develop
            git reset --hard origin/develop

    - script:
        interpreter: SHELL
        description: Prepare JGit SSH
        scripts:
          - |
            set -eu
            mkdir -p ~/.ssh
            cp /opt/bamboo-keys/bitbucket_ci_jgit ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa

    - script:
        interpreter: SHELL
        description: Start Gitflow release
        scripts:
          - |
            set -eu
            /usr/share/maven/bin/mvn -U -B \
              -s "/tmp/settings-${bamboo.buildResultKey}.xml" \
              external.atlassian.jgitflow:jgitflow-maven-plugin:release-start \
              -DpushReleases=true \
              -DallowSnapshots=true \
              -DdefaultOriginUrl="${bamboo.planRepository.repositoryUrl}"

    - script:
        interpreter: SHELL
        description: Convert SNAPSHOT → RC
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes'

            VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | grep -v '\[' | tail -1)
            BRANCH="release/${VERSION%-SNAPSHOT}"

            git fetch origin
            git checkout -B "$BRANCH" "origin/$BRANCH"

            find . -name pom.xml -exec sed -i 's/SNAPSHOT/RC/g' {} +

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            if ! git diff --quiet; then
              git commit -am "Update SNAPSHOT to RC"
              git push origin HEAD:"$BRANCH"
            fi


Deploy RC:
  key: DR
  other:
    clean-working-dir: true

  tasks:
    - clean
    - checkout

    - script:
        interpreter: SHELL
        description: Checkout release branch
        scripts:
          - |
            set -eu
            VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | grep -v '\[' | tail -1)
            BRANCH="release/${VERSION%-SNAPSHOT}"

            git fetch origin
            git checkout -B "$BRANCH" "origin/$BRANCH"

    - script:
        interpreter: SHELL
        description: Angular build
        working-dir: web/src/main/
        scripts:
          - |
            set -eu

            export NODE_EXTRA_CA_CERTS=/etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.crt

            yum install -y google-chrome-stable || true

            npm config set registry https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/npm/npm-remote/

            npm install
            npm test

            ng build --configuration production --output-hashing=all --optimization

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U clean deploy
          -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-rc-local
          -s /tmp/settings-${bamboo.buildResultKey}.xml


Update dependencies to latest snapshot versions:
  key: SMD
  other:
    clean-working-dir: true

  tasks:
    - clean
    - checkout

    - script:
        interpreter: SHELL
        description: Sync develop
        scripts:
          - |
            set -eu
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop

    - script:
        interpreter: SHELL
        description: Angular build
        working-dir: web/src/main/
        scripts:
          - |
            set -eu
            npm install
            npm test
            ng build --configuration production

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U clean deploy
          -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository


Delete release branch if failed:
  key: DRBIF
  other:
    clean-working-dir: true

  tasks:
    - checkout

    - script:
        interpreter: SHELL
        description: Cleanup on failure
        scripts:
          - |
            set -eu
            if [ "${bamboo.buildFailed}" = "true" ]; then
              VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | grep -v '\[' | tail -1)
              BRANCH="release/${VERSION%-SNAPSHOT}"

              git fetch origin
              git push origin --delete "$BRANCH" || true
            fi


repositories:
  - UI:
      scope: global