---
version: 2
plan:
  project-key: SR
  key: UISR
  name: (03b) UI - Start Release

stages:
  - Default Stage:
      jobs:
        - Gitflow release start

  - Deploy RC:
      jobs:
        - Deploy RC

  - Update dependencies to latest snapshot versions:
      jobs:
        - Update dependencies to latest snapshot versions

  - Delete release branch if failed:
      final: true
      jobs:
        - Delete release branch if failed

Gitflow release start:
  key: JOB1
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true

    - script:
        interpreter: SHELL
        description: Validate SSH keys
        scripts:
          - |
            set -eu
            test -s /opt/bamboo-keys/bitbucket_ci
            test -s /opt/bamboo-keys/bitbucket_ci_jgit

    - script:
        interpreter: SHELL
        description: Write Maven settings
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            cat > "${SETTINGS_FILE}" <<XML
            <settings>
              <mirrors>
                <mirror>
                  <id>central</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Determine release metadata
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version | grep -v '^\[' | tail -1)
            RELEASE_BRANCH="release/${VERSION%-SNAPSHOT}"

            echo "VERSION=${VERSION}" > .release-context
            echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> .release-context

            echo "Version: ${VERSION}"
            echo "Release branch: ${RELEASE_BRANCH}"

    - script:
        interpreter: SHELL
        description: Validate release state
        scripts:
          - |
            set -eu
            . ./.release-context

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes'
            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            git ls-remote --exit-code --heads "${bamboo.planRepository.repositoryUrl}" refs/heads/develop >/dev/null

            REMOTE_RELEASES=$(git ls-remote --heads "${bamboo.planRepository.repositoryUrl}" 'refs/heads/release/*' || true)

            if [ -n "${REMOTE_RELEASES}" ]; then
              echo "Remote release branches found:"
              echo "${REMOTE_RELEASES}" | awk '{print $2}'

              OTHER_RELEASES=$(echo "${REMOTE_RELEASES}" | awk '{print $2}' | grep -v "^refs/heads/${RELEASE_BRANCH}$" || true)
              if [ -n "${OTHER_RELEASES}" ]; then
                echo "Another release branch already exists. Finish or remove it before starting ${RELEASE_BRANCH}."
                exit 1
              fi
            fi

            git fetch origin +refs/heads/*:refs/remotes/origin/* --tags
            git checkout -B develop origin/develop
            git reset --hard origin/develop

    - script:
        interpreter: SHELL
        description: Prepare JGit SSH
        scripts:
          - |
            set -eu
            mkdir -p ~/.ssh
            cp /opt/bamboo-keys/bitbucket_ci_jgit ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa

    - script:
        interpreter: SHELL
        description: Start Gitflow release
        scripts:
          - |
            set -eu
            . ./.release-context

            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"
            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            if git ls-remote --exit-code --heads "${bamboo.planRepository.repositoryUrl}" "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
              echo "${RELEASE_BRANCH} already exists; skipping jgitflow release-start"
            else
              /usr/share/maven/bin/mvn -U -B \
                -s "${SETTINGS_FILE}" \
                external.atlassian.jgitflow:jgitflow-maven-plugin:release-start \
                -DpushReleases=true \
                -DallowSnapshots=true \
                -DdefaultOriginUrl="${bamboo.planRepository.repositoryUrl}"
            fi

    - script:
        interpreter: SHELL
        description: Convert SNAPSHOT to RC on release branch
        scripts:
          - |
            set -eu
            . ./.release-context

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes'
            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            git fetch origin +refs/heads/*:refs/remotes/origin/* --tags
            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"

            if find . -name pom.xml -print | xargs grep -q -- '-SNAPSHOT'; then
              find . -name pom.xml -exec sed -i 's/-SNAPSHOT/-RC/g' {} +

              git config user.name "bamboo"
              git config user.email "bamboo@local"

              find . -name pom.xml -print0 | xargs -0 git add

              if ! git diff --cached --quiet; then
                git commit -m "Update SNAPSHOT to RC"
                git push origin HEAD:"${RELEASE_BRANCH}"
              fi
            else
              echo "No SNAPSHOT versions found in pom.xml files"
            fi

Deploy RC:
  key: DR
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true

    - script:
        interpreter: SHELL
        description: Validate SSH keys
        scripts:
          - |
            set -eu
            test -s /opt/bamboo-keys/bitbucket_ci

    - script:
        interpreter: SHELL
        description: Write Maven settings
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            cat > "${SETTINGS_FILE}" <<XML
            <settings>
              <mirrors>
                <mirror>
                  <id>central</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Determine release metadata
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-${bamboo.buildResultKey}.xml"

            VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version | grep -v '^\[' | tail -1)
            RELEASE_BRANCH="release/${VERSION%-SNAPSHOT}"

            echo "VERSION=${VERSION}" > .release-context
            echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> .release-context

            echo "Version: ${VERSION}"
            echo "Release branch: ${RELEASE_BRANCH}"

    - script:
        interpreter: SHELL
        description: Checkout release branch
        scripts:
          - |
            set -eu
            . ./.release-context

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes'
            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            git fetch origin +refs/heads/*:refs/remotes/origin/* --tags
            git rev-parse --verify "origin/${RELEASE_BRANCH}" >/dev/null 2>&1
            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"

    - script:
        interpreter: SHELL
        description: Angular build
        working-dir: web/src/main/
        scripts:
          - |
            set -eu

            export NODE_EXTRA_CA_CERTS=/etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.crt

            yum install -y google-chrome-stable || true

            npm config set registry https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/npm/npm-remote/

            npm install
            npm test

            ng build --configuration production --output-hashing=all --optimization

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U clean deploy
          -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-rc-local
          -s /tmp/settings-${bamboo.buildResultKey}.xml

