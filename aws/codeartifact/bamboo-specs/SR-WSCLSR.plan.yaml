---
version: 2
plan:
  project-key: SR
  key: WSCLSR
  name: (04b) WS-Client - Start Release

stages:
  - Default Stage:
      jobs:
        - Gitflow release start

  - Deploy RC:
      jobs:
        - Deploy RC

  - Update dependencies to latest snapshot versions:
      jobs:
        - Update dependencies to latest snapshot versions

  - Delete release branch if failed:
      final: true
      jobs:
        - Delete release branch if failed

Gitflow release start:
  key: JOB1
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mounts
        scripts:
          - |
            set -eu
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }
            test -s /opt/bamboo-keys/bitbucket_ci_jgit || { echo "ERROR: JGit SSH key missing"; exit 1; }

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            cat > "${SETTINGS_FILE}" <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>

              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>

              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>

              <servers>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Determine release metadata
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"
            RC_VERSION="${RELEASE_VERSION}-RC"

            {
              echo "CURRENT_VERSION=${CURRENT_VERSION}"
              echo "RELEASE_VERSION=${RELEASE_VERSION}"
              echo "RELEASE_BRANCH=${RELEASE_BRANCH}"
              echo "RC_VERSION=${RC_VERSION}"
            } > .release-context

            echo "Detected version: ${CURRENT_VERSION}"
            echo "Target release branch: ${RELEASE_BRANCH}"
            echo "Target RC version: ${RC_VERSION}"

    - script:
        interpreter: SHELL
        description: Validate release preconditions and cleanup stale branches
        scripts:
          - |
            set -eu
            . ./.release-context
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin +refs/heads/*:refs/remotes/origin/* --prune --tags

            if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
              echo "ERROR: final tag ${RELEASE_VERSION} already exists"
              exit 1
            fi

            ACTIVE_RELEASES=$(git ls-remote --heads origin 'refs/heads/release/*' \
              | awk '{sub("refs/heads/","",$2); print $2}' || true)

            if [ -n "${ACTIVE_RELEASES}" ]; then
              echo "Deleting existing remote release branches to allow jgitflow to proceed:"
              printf '  %s\n' ${ACTIVE_RELEASES}
              for branch in ${ACTIVE_RELEASES}; do
                git push origin --delete "${branch}" || true
              done
            else
              echo "No existing remote release branches"
            fi

            git checkout -B develop origin/develop
            git reset --hard origin/develop

    - script:
        interpreter: SHELL
        description: Prepare SSH environment for JGit/JSch
        scripts:
          - |
            set -eu
            export HOME="${HOME:-/root}"

            mkdir -p "${HOME}/.ssh"
            chmod 700 "${HOME}/.ssh"

            cp /opt/bamboo-keys/bitbucket_ci_jgit "${HOME}/.ssh/id_rsa"
            chmod 600 "${HOME}/.ssh/id_rsa"

            cat > "${HOME}/.ssh/config" <<EOF
            Host bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov
              HostName bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov
              User git
              Port 7999
              IdentityFile ${HOME}/.ssh/id_rsa
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
            EOF
            chmod 600 "${HOME}/.ssh/config"

            ssh-keyscan -p 7999 bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov >> "${HOME}/.ssh/known_hosts" 2>/dev/null || true
            chmod 644 "${HOME}/.ssh/known_hosts"

    - script:
        interpreter: SHELL
        description: Force clean git working tree before jgitflow
        scripts:
          - |
            set -euo pipefail

            git reset --hard HEAD
            git clean -fdx

            echo "=== git status --short ==="
            git status --short || true

            echo "=== untracked files ==="
            git ls-files --others --exclude-standard || true

            if [ -n "$(git status --porcelain=v1)" ]; then
              echo "ERROR: working tree is not clean before jgitflow"
              exit 1
            fi

            echo "Working tree is clean for jgitflow"

    - script:
        interpreter: SHELL
        description: Debug repo state before jgitflow
        scripts:
          - |
            set -euo pipefail
            echo "=== pwd ==="
            pwd
            echo "=== git status --short ==="
            git status --short || true
            echo "=== git status --ignored --short ==="
            git status --ignored --short || true
            echo "=== untracked files ==="
            git ls-files --others --exclude-standard || true
            echo "=== top-level files ==="
            find . -maxdepth 2 | sort

    - script:
        interpreter: SHELL
        description: Start Gitflow release
        scripts:
          - |
            set -eu
            export HOME="${HOME:-/root}"

            git clean -fdx
            git reset --hard HEAD

            /usr/share/maven/bin/mvn -U -B \
              -s "/tmp/settings-artifactory-${bamboo.buildResultKey}.xml" \
              external.atlassian.jgitflow:jgitflow-maven-plugin:release-start \
              -DpushReleases=true \
              -DallowSnapshots=true \
              -DallowUntracked=true \
              -DdefaultOriginUrl="${bamboo.planRepository.repositoryUrl}"

    - script:
        interpreter: SHELL
        description: Convert project version to RC
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RC_VERSION="${CURRENT_VERSION%-SNAPSHOT}-RC"
            RELEASE_BRANCH="release/${CURRENT_VERSION%-SNAPSHOT}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin +refs/heads/*:refs/remotes/origin/* --prune --tags

            if ! git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/${RELEASE_BRANCH}$"; then
              echo "ERROR: expected release branch ${RELEASE_BRANCH} was not created"
              git branch -r
              exit 1
            fi

            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"

            /usr/share/maven/bin/mvn -B -U \
              -s "${SETTINGS_FILE}" \
              versions:set \
              -DnewVersion="${RC_VERSION}" \
              -DprocessAllModules=true \
              -DgenerateBackupPoms=false

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            git add pom.xml */pom.xml */*/pom.xml 2>/dev/null || true

            if ! git diff --cached --quiet; then
              git commit -m "Update project version to ${RC_VERSION}"
              git push origin HEAD:"${RELEASE_BRANCH}"
            else
              echo "No project version changes needed"
            fi

  artifact-subscriptions: []

Deploy RC:
  key: DR
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mount
        scripts:
          - |
            set -eu
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -eu
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            cat > "${SETTINGS_FILE}" <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>

              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>

              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>

              <servers>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Checkout release branch
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            # Derive SNAPSHOT version from develop checkout to find branch name
            SNAP_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout \
              -s "${SETTINGS_FILE}" help:evaluate \
              -Dexpression=project.version 2>/dev/null \
              | sed '/^\[/d' | grep -v '^$' | tail -1)
            RELEASE_BRANCH="release/${SNAP_VERSION%-SNAPSHOT}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin

            if ! git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/${RELEASE_BRANCH}$"; then
              echo "ERROR: expected release branch ${RELEASE_BRANCH} not found"
              git branch -r
              exit 1
            fi

            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
            git reset --hard "origin/$RELEASE_BRANCH"

            # Verify RC version is on the branch
            RC_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout \
              -s "${SETTINGS_FILE}" help:evaluate \
              -Dexpression=project.version 2>/dev/null \
              | sed '/^\[/d' | grep -v '^$' | tail -1)
            echo "Release branch version: ${RC_VERSION}"
            if echo "${RC_VERSION}" | grep -q "SNAPSHOT"; then
              echo "ERROR: release branch still has SNAPSHOT version: ${RC_VERSION}"
              exit 1
            fi

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U clean deploy
          -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-rc-local
          -s /tmp/settings-artifactory-${bamboo.buildResultKey}.xml
        description: Deploy RC to RC repo

  artifact-subscriptions: []

Update dependencies to latest snapshot versions:
