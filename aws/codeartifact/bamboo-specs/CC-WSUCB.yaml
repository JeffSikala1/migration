version: 2

plan:
  project-key: CC
  key: WSUCB
  name: WS - Unified Clover Build

stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Default Job

Default Job:
  key: JOB1

  tasks:
    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - checkout:
        repository: bamboo-deployment
        path: bamboo-deployment
        force-clean-build: true
        description: Checkout Deployment Repository

    - script:
        interpreter: SHELL
        scripts:
          - rm -rf ~/.m2/repository/gov/gsa/cnxs/
        description: Remove existing cnxs maven repo directory

    - script:
        interpreter: SHELL
        file: bamboo-deployment/build-determination-migration.sh
        description: Determine parent branch and pass correct variables

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject
        description: Inject values

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >
          clean verify -U
          -Dbamboo.inject.BranchName=${bamboo.inject.BranchName}
          -Dbamboo.inject.mavenFeatureRepositoryUrl=${bamboo.inject.mavenFeatureRepositoryUrl}
          -Dbamboo.inject.pluginRepositoryUrl=${bamboo.inject.pluginRepositoryUrl}
          -Dmaven.clover.repositoryPollutionProtection=false
        tests: "true"
        description: Common Build and Verify

  artifacts:
    - name: Clover Report (System)
      location: target/site/clover
      pattern: "**/*.*"
      shared: false
      required: false

  artifact-subscriptions: []

repositories:
  - WS:
      scope: global
  - bamboo-deployment:
      scope: global

triggers:
  - cron:
      expression: 0 50 1 ? * 2

branches:
  create: manually
  delete:
    after-deleted-days: 60
    after-inactive-days: 30
  link-to-jira: true

notifications: []
labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []
