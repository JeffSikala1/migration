---
version: 2
plan:
  project-key: BT
  key: SB
  name: Schema - Build

stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Default Job

Default Job:
  key: JOB1
  other:
    clean-working-dir: true
    all-other-apps:
      custom:
        auto: {}
        buildHangingConfig.enabled: "false"

  tasks:
    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - checkout:
        repository: bamboo-deployment
        path: bamboo-deployment
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: BINSH_OR_CMDEXE
        scripts:
          - |-
            dirName=~/.m2/repository/gov/gsa/cnxs/
            if [ -d "$dirName" ]; then
              echo "Removing snapshot folders from $dirName"
              find "$dirName" -type d -name '*SNAPSHOT' -exec rm -rf {} +
            fi
        description: Remove existing cnxs maven repo directory

    - script:
        interpreter: SHELL
        file: bamboo-deployment/build-determination-migration.sh
        description: Determine parent branch and pass correct variables

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject
        description: Inject values

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >
          clean verify -U
          -Dbamboo.inject.BranchName=${bamboo.inject.BranchName}
          -Dbamboo.inject.mavenFeatureRepositoryUrl=${bamboo.inject.mavenFeatureRepositoryUrl}
          -Dbamboo.inject.pluginRepositoryUrl=${bamboo.inject.pluginRepositoryUrl}
        description: Common Build and Verify

    - script:
        interpreter: SHELL
        scripts:
          - |-
            set -euxo pipefail
            MVN_VERSION=$(awk '
              /<project/ { inproject=1 }
              inproject && /<version>/ {
                gsub(/.*<version>/,"")
                gsub(/<\/version>.*/,"")
                print
                exit
              }
            ' pom.xml)

            if [[ -z "${MVN_VERSION}" ]]; then
              echo "ERROR: Unable to determine project.version from pom.xml"
              exit 1
            fi

            echo "mavenVersion=${MVN_VERSION}" >> file.properties
            echo "Wrote mavenVersion=${MVN_VERSION} to file.properties"
            cat file.properties
        description: Extract mavenVersion from pom.xml

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject
        description: Inject mavenVersion for downstream tasks

    - script:
        interpreter: SHELL
        scripts:
          - |-
            export buildVersionQueryArtifact=schema
            export buildVersionQueryGroup=gov.gsa.cnxs.db
            export mavenVersion=${bamboo.inject.mavenVersion}
            bamboo-deployment/deploy-to-artifactory-skip-bamboo-version-migrate.sh
        description: Deploy to Artifactory if needed

    - inject-variables:
        file: file.properties
        scope: RESULT
        namespace: inject
        description: Persist variables for deployment plans

  artifact-subscriptions: []

variables:
  buildVersionQueryArtifact: schema
  buildVersionQueryGroup: gov.gsa.cnxs.db

repositories:
  - Schema:
      scope: global
  - bamboo-deployment:
      scope: global

triggers:
  - bitbucket-server-trigger:
      repositories:
        - Schema

branches:
  create: for-new-branch
  delete:
    after-deleted-days: 30
    after-inactive-days: 200
  link-to-jira: true

notifications:
  - events:
      - plan-completed
    recipients:
      - watchers

  - events:
      - plan-failed
    recipients:
      - responsible
      - committers

labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: block_if_parent_in_progress
  plans: []