---
version: 2
plan:
  project-key: BT
  key: COMB
  name: Common - Build
stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Default Job
Default Job:
  key: JOB1
  tasks:
    - clean
    - checkout:
        force-clean-build: true
        description: Checkout Default Repository
    - checkout:
        repository: bamboo-deployment
        path: bamboo-deployment
        force-clean-build: true
        description: Checkout Default Repository
    - script:
        interpreter: BINSH_OR_CMDEXE
        scripts:
          - rm -rf ~/.m2/repository/gov/gsa/
        description: Remove existing cnxs maven repo directory
    - script:
        interpreter: SHELL
        file: bamboo-deployment/build-determination-migration.sh
        description: Determine parent branch and pass correct variables
    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject
        description: Inject values
    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.bamboo-variable-inject-plugin:dump
        configuration: {}
    - script:
        interpreter: SHELL
        scripts:
          - |-
            set -eu pipefail

            # Use the same settings generator pattern as deploy script
            # (If you have a dedicated "write-settings" helper, call it here instead)
            cat > settings-artifactory.xml <<'XML'
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository/</url>
                </mirror>
              </mirrors>

              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository/</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository/</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>

              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>

              <servers>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

            echo "=== settings-artifactory.xml ==="
            sed -n '1,120p' settings-artifactory.xml
            echo "=== end settings ==="

            mvn -B -U -s settings-artifactory.xml -X clean verify \
              -Dbamboo.inject.BranchName="${bamboo.inject.BranchName}" \
              -Dbamboo.inject.mavenFeatureRepositoryUrl="${bamboo.inject.mavenFeatureRepositoryUrl}" \
              -Dbamboo.inject.pluginRepositoryUrl="${bamboo.inject.pluginRepositoryUrl}" \
              -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        description: Common Build and Verify (with Artifactory settings)
    - script:
        interpreter: SHELL
        file: bamboo-deployment/deploy-to-artifactory-skip-bamboo-version-migrate.sh
        description: Determine if deploy to Artifactory is needed
  # com.atlassian.bamboo.warnings.atlassian-bamboo-warnings:task.warnings.parser is disabled. This state is not supported at YAML
  artifact-subscriptions: []
repositories:
  - Common:
      scope: global
  - bamboo-deployment:
      scope: global
triggers:
  - bitbucket-server-trigger:
      repositories:
        - Common
branches:
  create: for-new-branch
  delete:
    after-deleted-days: 7
    after-inactive-days: 90
  link-to-jira: true
notifications:
  - events:
      - plan-failed
    recipients:
      - responsible
      - committers
  - events:
      - plan-completed
    recipients:
      - watchers
  - events:
      - plan-failed
    recipients:
      - responsible
      - committers
labels: []
dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: block_if_parent_in_progress
  plans:
    - BT-WSCLIEN
    - BT-DOMB
