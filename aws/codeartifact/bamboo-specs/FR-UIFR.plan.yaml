            )

            RC_RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -H "Content-Type: text/plain" \
              -X POST \
              "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
              --data "${RC_AQL}" || true)

            REL_RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -H "Content-Type: text/plain" \
              -X POST \
              "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
              --data "${REL_AQL}" || true)

            counts=$(python3 - <<PY
            import json

            release_version = "${RELEASE_VERSION}"

            def load(raw):
                try:
                    return json.loads(raw).get("results", [])
                except Exception:
                    return []

            def valid(item):
                name = item["name"]
                if name.endswith((".md5", ".sha1", ".sha256", ".sha512")):
                    return False
                if "maven-metadata.xml" in name:
                    return False
                return True

            def normalize(item):
                path = item["path"].replace(f"/{release_version}-RC", f"/{release_version}")
                name = item["name"].replace(f"-{release_version}-RC", f"-{release_version}")
                return (path, name)

            rc_items = [x for x in load('''${RC_RESULT}''') if valid(x)]
            rc_expected = {normalize(x) for x in rc_items}
            rel_items = {(x["path"], x["name"]) for x in load('''${REL_RESULT}''') if valid(x)}

            found = sum(1 for x in rc_expected if x in rel_items)
            print(f"{len(rc_expected)} {found}")
            PY
            )

            total_expected="$(echo "${counts}" | awk '{print $1}')"
            found_count="$(echo "${counts}" | awk '{print $2}')"

            if [ "${total_expected}" -gt 0 ] && [ "${found_count}" -eq "${total_expected}" ]; then
              RELEASE_ARTIFACTS_EXIST=true
            fi

            echo "INFO: tag_exists=${TAG_EXISTS}, release_artifacts_found=${found_count}/${total_expected}"

            if [ "${TAG_EXISTS}" = "true" ] && [ "${RELEASE_ARTIFACTS_EXIST}" = "true" ]; then
              echo "INFO: final-state signals confirmed for ${RELEASE_VERSION}"

              if git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | grep -q "refs/heads/${RELEASE_BRANCH}$"; then
                echo "INFO: attempting best-effort deletion of ${RELEASE_BRANCH}"
                if git push origin --delete "${RELEASE_BRANCH}"; then
                  echo "INFO: deleted remote release branch ${RELEASE_BRANCH}"
                else
                  echo "WARNING: failed to delete remote release branch ${RELEASE_BRANCH}"
                  echo "WARNING: release remains successful because tag and full release artifacts exist."
                fi
              else
                echo "INFO: release branch ${RELEASE_BRANCH} already absent"
              fi

              exit 0
            fi

            echo "INFO: cleanup skipped because final-state signals are incomplete."
            exit 0

