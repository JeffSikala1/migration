            if git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
              TAG_EXISTS=true
            fi

            RC_AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-rc-local"},
              "path":{"\$match":"${GROUP_PATH}*"},
              "name":{"\$match":"*${RELEASE_VERSION}*"}
            }).include("name","repo","path")
