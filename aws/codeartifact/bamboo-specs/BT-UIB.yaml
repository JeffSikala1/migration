---
version: 2
plan:
  project-key: BT
  key: UIB
  name: UI - Build

stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Default Job

Default Job:
  key: JOB1
  tasks:
    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - checkout:
        repository: bamboo-deployment
        path: bamboo-deployment
        force-clean-build: true
        description: Checkout bamboo-deployment Repository

    - script:
        interpreter: BINSH_OR_CMDEXE
        scripts:
          - rm -rf ~/.m2/repository/gov/gsa/cnxs/
        description: Remove existing cnxs maven repo directory

    - script:
        interpreter: SHELL
        file: bamboo-deployment/build-determination-migration.sh
        description: Determine parent branch and pass correct variables

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        working-dir: web/src/main/
        description: ng build
        scripts:
          - |-
            #!/usr/bin/env bash
            set -o pipefail

            ARTI_NPM_REGISTRY="https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/npm/npm/"
            OLD_LOCK_PREFIX="https://easartifactory.edc.ds1.usda.gov:443/artifactory/api/npm/npm-virtual/"
            BAD_NEW_LOCK_PREFIX="https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/npm/npm-virtual/"
            GOOD_NEW_LOCK_PREFIX="https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/npm/npm/"

            export NODE_EXTRA_CA_CERTS=/etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.crt
            export NPM_CONFIG_REGISTRY="${ARTI_NPM_REGISTRY}"
            export npm_config_registry="${ARTI_NPM_REGISTRY}"

            command -v node >/dev/null 2>&1 || { echo "ERROR: node is not installed on this Bamboo agent"; exit 1; }
            command -v npm  >/dev/null 2>&1 || { echo "ERROR: npm is not installed on this Bamboo agent"; exit 1; }

            node --version
            npm --version

            echo "HOME=$HOME"
            echo "PWD=$(pwd)"

            echo "----- npm config before cleanup -----"
            npm config get registry || true
            npm config ls -l | grep -Ei 'registry|proxy|cafile|strict-ssl|replace-registry-host' || true

            echo "repo .npmrc present? $([[ -f .npmrc ]] && echo yes || echo no)"
            echo "user .npmrc present? $([[ -f "${HOME}/.npmrc" ]] && echo yes || echo no)"

            npm config set registry "${ARTI_NPM_REGISTRY}"
            npm config delete replace-registry-host || true
            npm config delete proxy || true
            npm config delete https-proxy || true

            echo "----- rewriting package-lock registry paths -----"
            if [[ -f package-lock.json ]]; then
              sed -i "s|${OLD_LOCK_PREFIX}|${GOOD_NEW_LOCK_PREFIX}|g" package-lock.json
              sed -i "s|${BAD_NEW_LOCK_PREFIX}|${GOOD_NEW_LOCK_PREFIX}|g" package-lock.json
            fi

            echo "----- verify lockfile after rewrite -----"
            [[ -f package-lock.json ]] && grep -n "npm-virtual" package-lock.json | sed -n '1,20p' || true
            [[ -f package-lock.json ]] && grep -n "artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/npm/npm/" package-lock.json | sed -n '1,20p' || true

            echo "----- npm config after cleanup -----"
            npm config get registry
            npm config ls -l | grep -Ei 'registry|proxy|cafile|strict-ssl|replace-registry-host' || true

            echo "----- install/test -----"
            npm install --force || echo "npm install failed; continuing"
            npm test || echo "npm test failed; continuing"

            npx ng build --configuration production --output-hashing=all --optimization --source-map=true

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: clean verify -B -U -Dbamboo.inject.BranchName=${bamboo.inject.BranchName} -Dbamboo.inject.mavenFeatureRepositoryUrl=${bamboo.inject.mavenFeatureRepositoryUrl} -Dbamboo.inject.pluginRepositoryUrl=${bamboo.inject.pluginRepositoryUrl} -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        description: Package

    - script:
        interpreter: SHELL
        description: Extract Maven version
        scripts:
          - |-
            #!/usr/bin/env bash
            set -eux

            MVN_VERSION="$(awk '
              /<project/ { inproject=1 }
              inproject && /<version>/ {
                gsub(/.*<version>/,"")
                gsub(/<\/version>.*/,"")
                print
                exit
              }
            ' pom.xml)"

            if [[ -z "${MVN_VERSION}" ]]; then
              echo "ERROR: Could not determine Maven version from pom.xml"
              exit 1
            fi

            echo "mavenVersion=${MVN_VERSION}" >> file.properties
            echo "Wrote mavenVersion=${MVN_VERSION} to file.properties"
            cat file.properties

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject

    - script:
        interpreter: SHELL
        file: bamboo-deployment/deploy-to-artifactory-and-create-bamboo-version-migrate.sh
        environment: buildVersionQueryArtifact=${bamboo.buildVersionQueryArtifact} buildVersionQueryGroup=${bamboo.buildVersionQueryGroup} mavenVersion=${bamboo.inject.mavenVersion}
        description: Deploy to Artifactory if needed

    - inject-variables:
        file: file.properties
        scope: RESULT
        namespace: inject

  artifact-subscriptions: []

variables:
  buildVersionQueryArtifact: ui-war
  buildVersionQueryGroup: gov.gsa.cnxs.ui

repositories:
  - UI:
      scope: global
  - bamboo-deployment:
      scope: global

triggers:
  - bitbucket-server-trigger:
      repositories:
        - UI

branches:
  create: for-new-branch
  delete:
    after-deleted-days: 7
    after-inactive-days: 200
  link-to-jira: true

notifications:
  - events:
      - plan-completed
    recipients:
      - watchers
  - events:
      - plan-failed
    recipients:
      - responsible
      - committers

labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []