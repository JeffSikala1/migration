---
version: 2
plan:
  project-key: SR
  key: ESR
  name: (02) Env - Start Release

stages:
  - Default Stage:
      jobs:
        - Gitflow release start

  - Deploy RC:
      jobs:
        - Deploy RC

  - Snapshot Maven Deploy:
      jobs:
        - Snapshot Maven Deploy

  - Check build plan result:
      final: true
      jobs:
        - Delete release branch if failed


Gitflow release start:
  key: JOB1

  tasks:
    - clean

    - checkout:
        force-clean-build: true

    - script:
        interpreter: SHELL
        description: Validate SSH key mount
        scripts:
          - |
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }

    - script:
        interpreter: SHELL
        description: Determine Maven version
        scripts:
          - |
            set -eu
            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout help:evaluate -Dexpression=project.version | grep -E '^[0-9].*' | tail -1)
            echo "currentVersion=${CURRENT_VERSION}" > release.properties
            echo "Detected version: ${CURRENT_VERSION}"

    - inject-variables:
        file: release.properties
        scope: LOCAL
        namespace: release

    - script:
        interpreter: SHELL
        description: Cleanup existing tag
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            VERSION="${bamboo.release.currentVersion}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch --tags origin

            if git tag -l "${VERSION}" | grep -q .; then
              echo "Deleting tag ${VERSION}"
              git tag -d "${VERSION}" || true
              git push origin ":refs/tags/${VERSION}"
            else
              echo "No existing tag"
            fi

    - script:
        interpreter: SHELL
        description: Cleanup existing release branches
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git fetch origin

            git branch -r | sed 's/^[[:space:]]*//' | grep '^origin/release/' | while read -r RB; do
              BR="${RB#origin/}"
              echo "Deleting ${BR}"
              git push origin --delete "${BR}" || true
            done || true

    - script:
        interpreter: SHELL
        description: Sync develop branch
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git fetch origin
            git checkout develop
            git reset --hard origin/develop

    - script:
        interpreter: SHELL
        description: Start Gitflow release
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            /usr/share/maven/bin/mvn -U -B \
              external.atlassian.jgitflow:jgitflow-maven-plugin:release-start \
              -DpushReleases=true \
              -DallowSnapshots=true \
              -DdefaultOriginUrl="${bamboo.planRepository.repositoryUrl}" \
              -s /usr/share/maven/conf/settings-release.xml

    - script:
        interpreter: SHELL
        description: Convert SNAPSHOT to RC
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git fetch origin

            RELEASE_BRANCH=$(git branch -r | sed 's/^[[:space:]]*//' | grep '^origin/release/' | head -1 | sed 's#^origin/##')

            [ -n "$RELEASE_BRANCH" ] || { echo "ERROR: no release branch"; exit 1; }

            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"

            find . -name pom.xml -exec sed -i 's/SNAPSHOT/RC/g' {} +

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            if ! git diff --quiet; then
              git commit -am "Update SNAPSHOT to RC"
              git push origin HEAD:"$RELEASE_BRANCH"
            fi


Deploy RC:
  key: DR

  tasks:
    - clean

    - checkout:
        force-clean-build: true

    - script:
        interpreter: SHELL
        description: Checkout release branch
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git fetch origin

            RELEASE_BRANCH=$(git branch -r | sed 's/^[[:space:]]*//' | grep '^origin/release/' | head -1 | sed 's#^origin/##')

            [ -n "$RELEASE_BRANCH" ] || { echo "ERROR: no release branch"; exit 1; }

            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U clean deploy
          -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-rc-local
          -s /usr/share/maven/conf/settings-release.xml


Snapshot Maven Deploy:
  key: SMD

  tasks:
    - clean

    - checkout:
        force-clean-build: true

    - script:
        interpreter: SHELL
        description: Sync develop branch
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U clean deploy
          -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository
          -s /usr/share/maven/conf/settings-release.xml


Delete release branch if failed:
  key: DRBIF

  tasks:
    - clean

    - checkout:
        force-clean-build: true

    - script:
        interpreter: SHELL
        description: Cleanup on failure
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            if [ "${bamboo.buildFailed}" = "true" ]; then
              git fetch origin

              RELEASE_BRANCH=$(git branch -r | sed 's/^[[:space:]]*//' | grep '^origin/release/' | head -1 | sed 's#^origin/##' || true)

              if [ -n "$RELEASE_BRANCH" ]; then
                git push origin --delete "$RELEASE_BRANCH" || true
              fi

              exit 1
            fi


repositories:
  - Env:
      scope: global

branches:
  create: manually
  delete: never
  link-to-jira: true

dependencies:
  enabled-for-branches: true