---
version: 2
plan:
  project-key: SR
  key: ESR
  name: (02) Env - Start Release

stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Gitflow release start

  - Deploy RC:
      manual: false
      final: false
      jobs:
        - Deploy RC

  - Snapshot Maven Deploy:
      manual: false
      final: false
      jobs:
        - Snapshot Maven Deploy

  - Check build plan result:
      manual: false
      final: true
      jobs:
        - Delete release branch if failed

Gitflow release start:
  key: JOB1
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: SHELL
        description: Verify mounted Bitbucket SSH key
        scripts:
          - |-
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: mounted SSH key missing"; exit 1; }
            ls -l /opt/bamboo-keys/bitbucket_ci

    - script:
        interpreter: SHELL
        description: Determine current Maven version
        scripts:
          - |-
            set -eu
            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout help:evaluate -Dexpression=project.version | tail -1)
            echo "currentVersion=${CURRENT_VERSION}" > release.properties
            echo "Detected currentVersion=${CURRENT_VERSION}"

    - inject-variables:
        file: release.properties
        scope: LOCAL
        namespace: release
        description: Inject release variables

    - script:
        interpreter: SHELL
        description: Delete tag if it already exists
        scripts:
          - |-
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            VERSION="${bamboo.release.currentVersion}"
            echo "Checking for tag version ${VERSION}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch --tags origin

            DOES_TAG_EXIST=$(git tag -l "${VERSION}" || true)

            if [ -n "${DOES_TAG_EXIST}" ]; then
              echo "Deleting existing tag ${DOES_TAG_EXIST}"
              git tag -d "${DOES_TAG_EXIST}" || true
              git push origin ":refs/tags/${DOES_TAG_EXIST}"
            else
              echo "No existing tag found"
            fi

    - script:
        interpreter: SHELL
        description: Delete existing release branch if present
        scripts:
          - |-
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin

            RELEASE_BRANCHES=$(git branch -r | sed 's/^[[:space:]]*//' | grep '^origin/release/' || true)

            if [ -n "${RELEASE_BRANCHES}" ]; then
              echo "${RELEASE_BRANCHES}" | while read -r RB; do
                BRANCH_NAME="${RB#origin/}"
                echo "Deleting remote release branch ${BRANCH_NAME}"
                git push origin --delete "${BRANCH_NAME}" || true
              done
            else
              echo "No release branch found"
            fi

    - script:
        interpreter: SHELL
        description: Ensure develop is current
        scripts:
          - |-
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin
            git checkout develop
            git reset --hard origin/develop
            git branch -a

    - script:
        interpreter: SHELL
        description: Run GitFlow release start
        scripts:
          - |-
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            /usr/share/maven/bin/mvn -U -B \
              external.atlassian.jgitflow:jgitflow-maven-plugin:release-start \
              -DpushReleases=true \
              -DallowSnapshots=true \
              -DenableSshAgent=true \
              -DdefaultOriginUrl="${bamboo.planRepository.repositoryUrl}" \
              -s /usr/share/maven/conf/settings-release.xml

    - script:
        interpreter: SHELL
        description: Update SNAPSHOT to RC and push release branch
        scripts:
          - |-
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin

            RELEASE_BRANCH=$(git branch -r | sed 's/^[[:space:]]*//' | grep '^origin/release/' | head -1 | sed 's#^origin/##')

            if [ -z "${RELEASE_BRANCH}" ]; then
              echo "ERROR: No release branch found after jgitflow release-start"
              exit 1
            fi

            echo "Using release branch ${RELEASE_BRANCH}"
            git checkout "${RELEASE_BRANCH}"
            git pull origin "${RELEASE_BRANCH}"

            find . -type f -name pom.xml -exec sed -i 's/SNAPSHOT/RC/g' {} +

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            if git diff --quiet; then
              echo "No SNAPSHOT values needed updating"
            else
              git commit -am "Updated versions from SNAPSHOT to RC"
              git push origin HEAD:"${RELEASE_BRANCH}"
            fi

  artifact-subscriptions: []

Deploy RC:
  key: DR
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: SHELL
        description: Verify mounted Bitbucket SSH key
        scripts:
          - |-
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: mounted SSH key missing"; exit 1; }
            ls -l /opt/bamboo-keys/bitbucket_ci

    - script:
        interpreter: SHELL
        description: Checkout release branch
        scripts:
          - |-
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin

            RELEASE_BRANCH=$(git branch -r | sed 's/^[[:space:]]*//' | grep '^origin/release/' | head -1 | sed 's#^origin/##')

            echo "Release branch detected: ${RELEASE_BRANCH}"

            if [ -z "${RELEASE_BRANCH}" ]; then
              echo "Failed to match a release branch from:"
              git branch -r
              exit 1
            fi

            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U clean deploy
          -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-rc-local
          -s /usr/share/maven/conf/settings-release.xml
        description: Deploy RC to RC repo

  artifact-subscriptions: []

Snapshot Maven Deploy:
  key: SMD
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: SHELL
        description: Verify mounted Bitbucket SSH key
        scripts:
          - |-
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: mounted SSH key missing"; exit 1; }
            ls -l /opt/bamboo-keys/bitbucket_ci

    - script:
        interpreter: SHELL
        description: Pull latest develop branch
        scripts:
          - |-
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U clean deploy
          -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository
          -s /usr/share/maven/conf/settings-release.xml
        description: Maven Deploy to Artifactory

  artifact-subscriptions: []

Delete release branch if failed:
  key: DRBIF
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.bamboo-variable-inject-plugin:dump
        configuration: {}

    - script:
        interpreter: SHELL
        description: Verify mounted Bitbucket SSH key
        scripts:
          - |-
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: mounted SSH key missing"; exit 1; }
            ls -l /opt/bamboo-keys/bitbucket_ci

    - script:
        interpreter: SHELL
        description: Delete release branch if previous stages failed
        scripts:
          - |-
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            if [ "${bamboo.buildFailed}" = "true" ]; then
              echo "Build failed, attempting to delete release branch"
              git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
              git fetch origin

              RELEASE_BRANCH=$(git branch -r | sed 's/^[[:space:]]*//' | grep '^origin/release/' | head -1 | sed 's#^origin/##' || true)

              if [ -n "${RELEASE_BRANCH}" ]; then
                echo "Deleting ${RELEASE_BRANCH}"
                git push origin --delete "${RELEASE_BRANCH}" || true
              else
                echo "No release branch found to delete"
              fi

              exit 1
            else
              echo "Build did not fail, nothing to clean up"
            fi

  artifact-subscriptions: []

repositories:
  - Env:
      scope: global

triggers: []

branches:
  create: manually
  delete: never
  link-to-jira: true

notifications: []

labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []
