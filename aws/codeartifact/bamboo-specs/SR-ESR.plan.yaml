---
version: 2
plan:
  project-key: SR
  key: ESR
  name: (02) Env - Start Release

stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Gitflow release start

  - Deploy RC:
      manual: false
      final: false
      jobs:
        - Deploy RC

  - Snapshot Maven Deploy:
      manual: false
      final: false
      jobs:
        - Snapshot Maven Deploy

  - Check build plan result:
      manual: false
      final: true
      jobs:
        - Delete release branch if failed


Gitflow release start:
  key: JOB1
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mount
        scripts:
          - |
            set -eu
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }
            ls -l /opt/bamboo-keys/bitbucket_ci

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -eu
            cat > settings-artifactory.xml <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Determine Maven version
        scripts:
          - |
            set -eu
            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -q -DforceStdout -s settings-artifactory.xml help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "$CURRENT_VERSION" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_BRANCH="release/${CURRENT_VERSION%-SNAPSHOT}"

            {
              echo "currentVersion=${CURRENT_VERSION}"
              echo "targetReleaseBranch=${RELEASE_BRANCH}"
            } > release.properties

            echo "Detected version: ${CURRENT_VERSION}"
            echo "Target release branch: ${RELEASE_BRANCH}"

    - inject-variables:
        file: release.properties
        scope: RESULT
        namespace: release
        description: Inject release variables

    - script:
        interpreter: SHELL
        description: Cleanup existing tag
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            VERSION="${bamboo.release.currentVersion}"
            [ -n "$VERSION" ] || { echo "ERROR: currentVersion is empty"; exit 1; }

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch --tags origin

            if git tag -l "${VERSION}" | grep -q .; then
              echo "Deleting tag ${VERSION}"
              git tag -d "${VERSION}" || true
              git push origin ":refs/tags/${VERSION}"
            else
              echo "No existing tag"
            fi

    - script:
        interpreter: SHELL
        description: Cleanup matching release branch only
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            TARGET_RELEASE_BRANCH="${bamboo.release.targetReleaseBranch}"
            [ -n "$TARGET_RELEASE_BRANCH" ] || { echo "ERROR: targetReleaseBranch is empty"; exit 1; }

            echo "Checking for existing ${TARGET_RELEASE_BRANCH}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin

            if git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/${TARGET_RELEASE_BRANCH}$"; then
              echo "Deleting existing ${TARGET_RELEASE_BRANCH}"
              git push origin --delete "${TARGET_RELEASE_BRANCH}"
            else
              echo "No matching existing release branch"
            fi

    - script:
        interpreter: SHELL
        description: Sync develop branch
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin
            git checkout develop
            git reset --hard origin/develop

    - script:
        interpreter: SHELL
        description: Prepare SSH environment for JGit/JSch
        scripts:
          - |
            set -eu

            mkdir -p "${HOME}/.ssh"
            chmod 700 "${HOME}/.ssh"

            cp /opt/bamboo-keys/bitbucket_ci "${HOME}/.ssh/id_rsa"
            chmod 600 "${HOME}/.ssh/id_rsa"

            cat > "${HOME}/.ssh/config" <<EOF
            Host bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov
              HostName bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov
              User git
              Port 7999
              IdentityFile ${HOME}/.ssh/id_rsa
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
            EOF
            chmod 600 "${HOME}/.ssh/config"

            ssh-keyscan -p 7999 bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov >> "${HOME}/.ssh/known_hosts" 2>/dev/null || true
            chmod 644 "${HOME}/.ssh/known_hosts"

            echo "SSH files prepared for JGit"
            ls -la "${HOME}/.ssh"

    - script:
        interpreter: SHELL
        description: Validate SSH auth to Bitbucket
        scripts:
          - |
            set -eu
            export HOME="${HOME:-/root}"
            ssh -i "${HOME}/.ssh/id_rsa" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -p 7999 \
              -T git@bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov || RC=$?

            # Bitbucket/SSH often returns non-zero even when auth succeeds for shell-less access.
            # So only fail if we never got far enough to authenticate.
            if [ "${RC:-0}" -ne 0 ]; then
              echo "SSH returned code ${RC}; check output above."
            fi

    - script:
        interpreter: SHELL
        description: Start Gitflow release
        scripts:
          - |
            set -eu
            export HOME="${HOME:-/root}"

            /usr/share/maven/bin/mvn -U -B \
              -s settings-artifactory.xml \
              external.atlassian.jgitflow:jgitflow-maven-plugin:release-start \
              -DpushReleases=true \
              -DallowSnapshots=true \
              -DdefaultOriginUrl="${bamboo.planRepository.repositoryUrl}"

    - script:
        interpreter: SHELL
        description: Convert SNAPSHOT to RC
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            RELEASE_BRANCH="${bamboo.release.targetReleaseBranch}"
            [ -n "$RELEASE_BRANCH" ] || { echo "ERROR: target release branch is empty"; exit 1; }

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin

            if ! git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/${RELEASE_BRANCH}$"; then
              echo "ERROR: expected release branch ${RELEASE_BRANCH} was not created"
              git branch -r
              exit 1
            fi

            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"

            find . -type f -name pom.xml -exec sed -i 's/SNAPSHOT/RC/g' {} +

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            if ! git diff --quiet; then
              git commit -am "Update SNAPSHOT to RC"
              git push origin HEAD:"$RELEASE_BRANCH"
            else
              echo "No SNAPSHOT values needed updating"
            fi

  artifact-subscriptions: []


Deploy RC:
  key: DR
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mount
        scripts:
          - |
            set -eu
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -eu
            cat > settings-artifactory.xml <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Checkout release branch
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            RELEASE_BRANCH="${bamboo.release.targetReleaseBranch}"
            [ -n "$RELEASE_BRANCH" ] || { echo "ERROR: no release branch"; exit 1; }

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin

            if ! git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/${RELEASE_BRANCH}$"; then
              echo "ERROR: expected release branch ${RELEASE_BRANCH} not found"
              git branch -r
              exit 1
            fi

            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >-
          -U clean deploy
          -DaltDeploymentRepository=central::default::https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-rc-local
          -s settings-artifactory.xml
        description: Deploy RC to RC repo

  artifact-subscriptions: []


