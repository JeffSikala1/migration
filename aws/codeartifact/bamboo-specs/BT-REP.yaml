---
version: 2
plan:
  project-key: BT
  key: REP
  name: Reporting - Build

stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - Default Job

Default Job:
  key: JOB1
  other:
    clean-working-dir: true
    all-other-apps:
      custom:
        auto: {}
        buildHangingConfig.enabled: 'false'

  tasks:
    - checkout:
        force-clean-build: true
        description: Checkout Default Repository

    - checkout:
        repository: bamboo-deployment
        path: bamboo-deployment
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: SHELL
        scripts:
          - |-
            rm -rf .m2
            mkdir -p .m2/repository
        description: Prepare isolated Maven repo

    - script:
        interpreter: SHELL
        file: bamboo-deployment/build-determination-migration.sh
        description: Determine parent branch and pass correct variables

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject
        description: Inject values

    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.bamboo-variable-inject-plugin:dump
        configuration: {}

    - script:
        interpreter: SHELL
        scripts:
          - |-
            cat > settings-artifactory.xml <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
              <profiles>
                <profile>
                  <id>use-artifactory</id>

                  <repositories>
                    <repository>
                      <id>conexus-plugin-repository</id>
                      <url>${bamboo.inject.pluginRepositoryUrl}</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>

                  <pluginRepositories>
                    <pluginRepository>
                      <id>conexus-plugin-repository</id>
                      <url>${bamboo.inject.pluginRepositoryUrl}</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>

              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>

              <servers>
                <server>
                  <id>conexus-plugin-repository</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
                <server>
                  <id>conexus-feature-repo</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
                <server>
                  <id>ArtifactoryPluginRepos</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML
        description: Write Artifactory Maven settings

    - script:
        interpreter: SHELL
        scripts:
          - |-
            sed -E 's#<password>.*</password>#<password>***</password>#g' settings-artifactory.xml
        description: Debug generated Maven settings

    - script:
        interpreter: SHELL
        scripts:
          - |-
            set -e
            curl -sf -u sa_bamboo:${bamboo.artifactory_access_token_secret} \
              "${bamboo.inject.pluginRepositoryUrl}gov/gsa/cnxs/bom/env/02.00.000.166-SNAPSHOT/maven-metadata.xml" \
              >/dev/null
            echo "Artifactory dependency auth check passed"
        description: Validate Artifactory dependency access

    - maven:
        executable: Maven 3
        jdk: JDK 17
        goal: >
          -Dmaven.repo.local=${bamboo.build.working.directory}/.m2/repository
          -s settings-artifactory.xml
          clean verify -B -U
          -Dbamboo.inject.BranchName=${bamboo.inject.BranchName}
          -Dbamboo.inject.mavenFeatureRepositoryUrl=${bamboo.inject.mavenFeatureRepositoryUrl}
          -Dbamboo.inject.pluginRepositoryUrl=${bamboo.inject.pluginRepositoryUrl}
          -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        tests: '**/target/surefire-reports/*.xml,**/target/failsafe-reports/*.xml'
        description: Build and Verify

    - script:
        interpreter: SHELL
        scripts:
          - |-
            MVN_VERSION=$(/usr/share/maven/bin/mvn \
              -Dmaven.repo.local=${bamboo.build.working.directory}/.m2/repository \
              -s settings-artifactory.xml \
              -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1 | tr -d '\r\n')
            echo "mavenVersion=${MVN_VERSION}" >> file.properties
            echo "Detected mavenVersion=${MVN_VERSION}"
        description: Determine Maven version

    - inject-variables:
        file: file.properties
        scope: LOCAL
        namespace: inject
        description: Inject updated values (mavenVersion)

    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.bamboo-variable-inject-plugin:dump
        configuration: {}

    - script:
        interpreter: SHELL
        file: bamboo-deployment/deploy-to-artifactory-and-create-bamboo-version-migrate.sh
        environment: buildVersionQueryArtifact=${bamboo.buildVersionQueryArtifact} buildVersionQueryGroup=${bamboo.buildVersionQueryGroup} mavenVersion=${bamboo.inject.mavenVersion}
        description: Deploy to Artifactory if needed

    - inject-variables:
        file: file.properties
        scope: RESULT
        namespace: inject
        description: Inject the build information to be used in Bamboo Deploy

  artifact-subscriptions: []

variables:
  buildVersionQueryArtifact: reporting-war
  buildVersionQueryGroup: gov.gsa.cnxs.reporting

repositories:
  - Reporting:
      scope: global
  - bamboo-deployment:
      scope: global

triggers:
  - bitbucket-server-trigger:
      repositories:
        - Reporting

branches:
  create:
    for-new-branch: ^((?!release).)*$
  delete:
    after-deleted-days: 7
    after-inactive-days: 200
  link-to-jira: true

notifications:
  - events:
      - job-hung
    recipients:
      - groups:
          - bamboo-admin

  - events:
      - plan-failed
    recipients:
      - responsible
      - committers

  - events:
      - plan-completed
    recipients:
      - watchers

  - events:
      - plan-failed
    recipients:
      - responsible
      - committers

labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: block_if_parent_in_progress
  plans:
    - BT-TASK
