---
version: 2
plan:
  project-key: FR
  key: RECFR
  name: Reconciliation - Finish Release
stages:
- Finish Release:
    manual: false
    final: false
    jobs:
    - Default Job
Default Job:
  key: JOB1
  other:
    clean-working-dir: true
  tasks:
  - clean
  - checkout:
      path: ${bamboo.module_name}
      force-clean-build: true
      description: Checkout Default Repository
  - checkout:
      repository: bamboo-deployment
      path: release-scripts
      force-clean-build: true
      description: Checkout release-scripts repository
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }
      description: Validate SSH key mounts
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml

        cat > "${SETTINGS_FILE}" <<XML
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
          <mirrors>
            <mirror>
              <id>artifactory</id>
              <mirrorOf>*</mirrorOf>
              <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
            </mirror>
          </mirrors>
          <profiles>
            <profile>
              <id>use-artifactory</id>
              <repositories>
                <repository>
                  <id>artifactory</id>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>artifactory</id>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>use-artifactory</activeProfile>
          </activeProfiles>
          <servers>
            <server>
              <id>central</id>
              <username>sa_bamboo</username>
              <password>${bamboo.artifactory_access_token_secret}</password>
            </server>
            <server>
              <id>artifactory</id>
              <username>sa_bamboo</username>
              <password>${bamboo.artifactory_access_token_secret}</password>
            </server>
          </servers>
        </settings>
        XML
      description: Write Maven settings for current Artifactory
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

        git config user.name "bamboo"
        git config user.email "bamboo@local"

        # Discover highest release branch on remote
        RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
          | awk '{print $2}' \
          | sed 's|refs/heads/||' \
          | grep '^release/' \
          | sed 's|release/||' \
          | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
          | tail -1 \
          | sed 's|^|release/|')

        [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
        RELEASE_VERSION="${RELEASE_BRANCH#release/}"
        echo "INFO: release branch=${RELEASE_BRANCH} version=${RELEASE_VERSION}"

        git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
        git fetch origin --prune --tags >/dev/null 2>&1

        git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"

        find . -type f -name "*.xml" -exec sed -i 's/-RC/-SNAPSHOT/g' {} +

        if ! git diff --quiet; then
          git commit -am "Updated versions from release-candidate to snapshot"
          git push origin HEAD:"${RELEASE_BRANCH}"
        else
          echo "No RC versions found to convert back to SNAPSHOT"
        fi
      description: Convert RC versions back to SNAPSHOT on release branch
      working-dir: ${bamboo.module_name}
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        curl -ks "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov:443/artifactory/file-local/certificates/USDA_Enterprise_Root_CA.crt" \
          -o /etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.pem
        update-ca-trust
      description: Install USDA root certificate in system wide trusted certificate location
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'


        SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
        # Discover the highest release branch on remote - never derive from develop
        RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
          | awk '{print $2}' \
          | sed 's|refs/heads/||' \
          | grep '^release/' \
          | sed 's|release/||' \
          | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
          | tail -1 \
          | sed 's|^|release/|')

        [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
        RELEASE_VERSION="${RELEASE_BRANCH#release/}"
        RC_DIR="${bamboo.build.working.directory}/working/gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}-RC"
        mkdir -p "${RC_DIR}"

        RC_BASE_URL="https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-rc-local/gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}-RC"

        curl -fksS -u "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
          -o "${RC_DIR}/reconciliation-war-${RELEASE_VERSION}-RC.pom" \
          "${RC_BASE_URL}/reconciliation-war-${RELEASE_VERSION}-RC.pom"

        curl -fksS -u "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
          -o "${RC_DIR}/reconciliation-war-${RELEASE_VERSION}-RC.war" \
          "${RC_BASE_URL}/reconciliation-war-${RELEASE_VERSION}-RC.war"

        CLEAN_POM="${RC_DIR}/reconciliation-war-${RELEASE_VERSION}.pom"
        CLEAN_WAR="${RC_DIR}/reconciliation-war-${RELEASE_VERSION}.war"

        sed 's/-RC//g' "${RC_DIR}/reconciliation-war-${RELEASE_VERSION}-RC.pom" > "${CLEAN_POM}"
        cp "${RC_DIR}/reconciliation-war-${RELEASE_VERSION}-RC.war" "${CLEAN_WAR}"

        STANDALONE_POM="/tmp/reconciliation-standalone-${bamboo.buildResultKey}.xml"
        cat > "${STANDALONE_POM}" <<XML
        <project xmlns="http://maven.apache.org/POM/4.0.0"
                 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                 xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
          <modelVersion>4.0.0</modelVersion>
          <groupId>local.temp</groupId>
          <artifactId>standalone-promote</artifactId>
          <version>1.0.0</version>
        </project>
        XML

        /usr/share/maven/bin/mvn -B \
          -f "${STANDALONE_POM}" \
          deploy:deploy-file \
          -Durl=https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-release-local \
          -DrepositoryId=central \
          -s "${SETTINGS_FILE}" \
          -Dfile="${CLEAN_WAR}" \
          -DpomFile="${CLEAN_POM}" \
          -Dpackaging=war \
          -DgeneratePom=false

        AQL=$(cat <<EOF
        items.find({
          "repo":{"\$eq":"conexus-release-local"},
          "path":{"\$eq":"gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}"}
        }).include("name","repo","path")
        EOF
        )

        RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
          -H "Content-Type: text/plain" \
          -X POST \
          "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
          --data "${AQL}")

        found_count=$(python3 - <<PY
        import json
        data = json.loads('''${RESULT}''')
        items = {(item["path"], item["name"]) for item in data.get("results", [])}
        expected = [
            ("gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}", "reconciliation-war-${RELEASE_VERSION}.pom"),
            ("gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}", "reconciliation-war-${RELEASE_VERSION}.war"),
        ]
        print(sum(1 for x in expected if x in items))
        PY
        )

        [ "${found_count}" -eq 2 ] || {
          echo "ERROR: promotion did not produce the full release artifact set; found ${found_count} of 2"
          exit 1
        }

        echo "INFO: reconciliation release artifacts successfully promoted for ${RELEASE_VERSION}"
      description: Promote Reconciliation artifacts from RC repo
      working-dir: .
  - script:
      interpreter: SHELL
      scripts:
      - |
        set -euo pipefail
        export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

        git config user.name "bamboo"
        git config user.email "bamboo@local"

        RELEASE_BRANCH=$(git ls-remote --heads origin 'refs/heads/release/*' \
          | awk '{print $2}' \
          | sed 's|refs/heads/||' \
          | grep '^release/' \
          | sed 's|release/||' \
          | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
          | tail -1 \
          | sed 's|^|release/|')

        [ -n "${RELEASE_BRANCH}" ] || { echo "ERROR: no release branch found on remote"; exit 1; }
        RELEASE_VERSION="${RELEASE_BRANCH#release/}"
        echo "INFO: merging ${RELEASE_BRANCH} into main and tagging ${RELEASE_VERSION}"

        git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
        git fetch origin --prune --tags >/dev/null 2>&1

        git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"
        git checkout -B main "origin/main"

        git merge -s recursive -X theirs -m "Merge Release Branch" "${RELEASE_BRANCH}"

        git tag "${RELEASE_VERSION}"

        find . -type f -name "*.xml" -exec sed -i 's/-SNAPSHOT//g' {} +

        if ! git diff --quiet; then
          git commit -am "Release Versions"
        else
          echo "No SNAPSHOT versions found to strip"
        fi

        git push origin main
        git push origin "refs/tags/${RELEASE_VERSION}"
      description: Merge release branch to main, tag, set release versions, and push
      working-dir: ${bamboo.module_name}
  artifact-subscriptions: []
variables:
  module_name: reconciliation
  maven.artifactId: reconciliation-parent
  maven.groupId: gov.gsa.cnxs.reconciliation
repositories:
- Reconciliation:
    scope: global
- bamboo-deployment:
    scope: global
triggers: []
branches:
  create: manually
  delete: never
  link-to-jira: true
notifications: []
labels: []
dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []
