---
version: 2
plan:
  project-key: FR
  key: RECFR
  name: Reconciliation - Finish Release

stages:
  - Promote Release Artifacts:
      manual: false
      final: false
      jobs:
        - Promote Job
  - Finalize Git Release:
      manual: false
      final: false
      jobs:
        - Finalize Job

Promote Job:
  key: JOB1
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        path: ${bamboo.module_name}
        force-clean-build: true
        description: Checkout Default Repository

    - checkout:
        repository: bamboo-deployment
        path: release-scripts
        force-clean-build: true
        description: Checkout release-scripts repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mounts
        scripts:
          - |
            set -euo pipefail
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml

            cat > "${SETTINGS_FILE}" <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Validate exact release branch exists and convert RC back to SNAPSHOT
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            echo "bamboo_skip_release=false" > "${bamboo.build.working.directory}/skip.properties"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags >/dev/null 2>&1 || true

            if ! git ls-remote --exit-code --heads origin "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
              TAG_EXISTS=false
              RELEASE_ARTIFACTS_EXIST=false
              found_count=0
              total_expected=2

              if git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
                TAG_EXISTS=true
              fi

              if [ "${TAG_EXISTS}" = "true" ]; then
                AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "path":{"\$eq":"gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}"}
            }).include("name","repo","path")
            EOF
                )

                RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
                  -H "Content-Type: text/plain" \
                  -X POST \
                  "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
                  --data "${AQL}")

                found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}", "reconciliation-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}", "reconciliation-war-${RELEASE_VERSION}.war"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
                )

                if [ "${found_count}" -eq "${total_expected}" ]; then
                  RELEASE_ARTIFACTS_EXIST=true
                fi
              fi

              echo "INFO: tag_exists=${TAG_EXISTS}, branch_exists=false, release_artifacts_found=${found_count:-0}"

              if [ "${TAG_EXISTS}" = "true" ] && [ "${RELEASE_ARTIFACTS_EXIST}" = "true" ]; then
                echo "INFO: release ${RELEASE_VERSION} already finalized based on remote tag + missing release branch + full release artifacts present; skipping."
                echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
                exit 0
              fi

              echo "ERROR: expected release branch ${RELEASE_BRANCH} not found"
              exit 1
            fi

            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}" >/dev/null 2>&1

            find . -type f -name "*.xml" -exec sed -i 's/-RC/-SNAPSHOT/g' {} +

            if ! git diff --quiet; then
              git commit -am "Updated versions from release-candidate to snapshot"
              git push origin HEAD:"${RELEASE_BRANCH}"
            else
              echo "No RC versions found to convert back to SNAPSHOT"
            fi

    - inject-variables:
        file: skip.properties
        scope: LOCAL

    - script:
        interpreter: SHELL
        description: Install USDA root certificate in system wide trusted certificate location
        scripts:
          - |
            set -euo pipefail
            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            curl -ks "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov:443/artifactory/file-local/certificates/USDA_Enterprise_Root_CA.crt" \
              -o /etc/pki/ca-trust/source/anchors/USDA_Enterprise_Root_CA.pem
            update-ca-trust

    - script:
        interpreter: SHELL
        description: Validate release state before promotion
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"
            git fetch origin --prune --tags >/dev/null 2>&1 || true

            if ! git branch -r | sed 's/^[[:space:]]*//' | grep -q "^origin/${RELEASE_BRANCH}$"; then
              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist."
              exit 1
            fi

            echo "Release state validation passed."

    - script:
        interpreter: SHELL
        description: Pre-check Reconciliation release artifacts in Artifactory
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            echo "bamboo_skip_release=false" > "${bamboo.build.working.directory}/skip.properties"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"

            AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "path":{"\$eq":"gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}"}
            }).include("name","repo","path")
            EOF
            )

            RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -H "Content-Type: text/plain" \
              -X POST \
              "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
              --data "${AQL}")

            found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}", "reconciliation-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}", "reconciliation-war-${RELEASE_VERSION}.war"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
            )

            total_expected=2

            echo "INFO: found ${found_count} of ${total_expected} expected Reconciliation release artifacts"

            if [ "${found_count}" -eq 0 ]; then
              echo "INFO: no Reconciliation release artifacts found for ${RELEASE_VERSION}; promotion may proceed."
              exit 0
            fi

            if [ "${found_count}" -eq "${total_expected}" ]; then
              echo "INFO: all Reconciliation release artifacts already exist for ${RELEASE_VERSION}; skipping promotion."
              echo "bamboo_skip_release=true" > "${bamboo.build.working.directory}/skip.properties"
              exit 0
            fi

            echo "ERROR: partial Reconciliation release already exists for ${RELEASE_VERSION}."
            exit 1

    - inject-variables:
        file: skip.properties
        scope: LOCAL

    - script:
        interpreter: SHELL
        description: Promote Reconciliation artifacts from RC repo
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release artifacts already exist; skipping promotion."
              exit 0
            fi

            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RC_DIR="$(pwd)/working/gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}-RC"
            mkdir -p "${RC_DIR}"

            RC_BASE_URL="https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-rc-local/gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}-RC"

            curl -fksS -u "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -o "${RC_DIR}/reconciliation-war-${RELEASE_VERSION}-RC.pom" \
              "${RC_BASE_URL}/reconciliation-war-${RELEASE_VERSION}-RC.pom"

            curl -fksS -u "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -o "${RC_DIR}/reconciliation-war-${RELEASE_VERSION}-RC.war" \
              "${RC_BASE_URL}/reconciliation-war-${RELEASE_VERSION}-RC.war"

            /usr/share/maven/bin/mvn -B deploy:deploy-file \
              -Durl=https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-release-local \
              -DrepositoryId=central \
              -s "${SETTINGS_FILE}" \
              -Dmaven.deploy.skip=false \
              -Dfile="${RC_DIR}/reconciliation-war-${RELEASE_VERSION}-RC.war" \
              -DpomFile="${RC_DIR}/reconciliation-war-${RELEASE_VERSION}-RC.pom" \
              -Dpackaging=war \
              -DgeneratePom=false

  artifact-subscriptions: []

Finalize Job:
  key: JOB2
  other:
    clean-working-dir: true

  tasks:
    - clean

    - checkout:
        path: ${bamboo.module_name}
        force-clean-build: true
        description: Checkout Default Repository

    - script:
        interpreter: SHELL
        description: Validate SSH key mounts
        scripts:
          - |
            set -euo pipefail
            test -s /opt/bamboo-keys/bitbucket_ci || { echo "ERROR: SSH key missing"; exit 1; }

    - script:
        interpreter: SHELL
        description: Write Maven settings for current Artifactory
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE=/tmp/settings-artifactory-${bamboo.buildResultKey}.xml

            cat > "${SETTINGS_FILE}" <<XML
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <mirrors>
                <mirror>
                  <id>artifactory</id>
                  <mirrorOf>*</mirrorOf>
                  <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                </mirror>
              </mirrors>
              <profiles>
                <profile>
                  <id>use-artifactory</id>
                  <repositories>
                    <repository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </repository>
                  </repositories>
                  <pluginRepositories>
                    <pluginRepository>
                      <id>artifactory</id>
                      <url>https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/conexus-plugin-repository</url>
                      <releases><enabled>true</enabled></releases>
                      <snapshots><enabled>true</enabled></snapshots>
                    </pluginRepository>
                  </pluginRepositories>
                </profile>
              </profiles>
              <activeProfiles>
                <activeProfile>use-artifactory</activeProfile>
              </activeProfiles>
              <servers>
                <server>
                  <id>central</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
                <server>
                  <id>artifactory</id>
                  <username>sa_bamboo</username>
                  <password>${bamboo.artifactory_access_token_secret}</password>
                </server>
              </servers>
            </settings>
            XML

    - script:
        interpreter: SHELL
        description: Validate release state before finalize
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"
            echo "bamboo_skip_release=false" > "${bamboo.build.working.directory}/skip.properties"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"
            INTEGRATION_BRANCH="${bamboo.integration.branch}"

            {
              echo "bamboo_skip_release=false"
              echo "bamboo_release_version=${RELEASE_VERSION}"
              echo "bamboo_release_branch=${RELEASE_BRANCH}"
              echo "bamboo_integration_branch=${INTEGRATION_BRANCH}"
            } > "${bamboo.build.working.directory}/skip.properties"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            TAG_EXISTS=false
            INTEGRATION_HAS_TAG=false
            BRANCH_EXISTS=false
            RELEASE_ARTIFACTS_EXIST=false
            total_expected=2

            if git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
              TAG_EXISTS=true
            fi

            if git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | grep -q "refs/heads/${RELEASE_BRANCH}$"; then
              BRANCH_EXISTS=true
            fi

            if [ "${TAG_EXISTS}" = "true" ]; then
              git tag -d "${RELEASE_VERSION}" >/dev/null 2>&1 || true

              git fetch origin \
                "+refs/heads/${INTEGRATION_BRANCH}:refs/remotes/origin/__validate_integration" \
                "+refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}" \
                >/dev/null 2>&1 || true

              TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_VERSION}" 2>/dev/null || true)"
              INTEGRATION_COMMIT="$(git rev-parse refs/remotes/origin/__validate_integration 2>/dev/null || true)"

              echo "INFO: tag_commit=${TAG_COMMIT:-missing} integration_commit=${INTEGRATION_COMMIT:-missing}"

              if [ -n "${TAG_COMMIT}" ] && [ -n "${INTEGRATION_COMMIT}" ]; then
                if git merge-base --is-ancestor "${TAG_COMMIT}" "refs/remotes/origin/__validate_integration"; then
                  INTEGRATION_HAS_TAG=true
                fi
              fi
            fi

            AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "path":{"\$eq":"gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}"}
            }).include("name","repo","path")
            EOF
            )

            RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -H "Content-Type: text/plain" \
              -X POST \
              "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
              --data "${AQL}")

            found_count=$(python3 - <<PY
            import json
            data = json.loads('''${RESULT}''')
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}", "reconciliation-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}", "reconciliation-war-${RELEASE_VERSION}.war"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
            )

            if [ "${found_count}" -eq "${total_expected}" ]; then
              RELEASE_ARTIFACTS_EXIST=true
            fi

            echo "INFO: tag_exists=${TAG_EXISTS}, integration_has_tag=${INTEGRATION_HAS_TAG}, branch_exists=${BRANCH_EXISTS}, release_artifacts_found=${found_count}"

            if [ "${TAG_EXISTS}" != "true" ] && [ "${BRANCH_EXISTS}" = "true" ] && [ "${found_count}" -ne "${total_expected}" ]; then
              echo "ERROR: release artifacts are not fully present in conexus-release-local for ${RELEASE_VERSION}; refusing to finalize."
              exit 1
            fi

            if [ "${TAG_EXISTS}" = "true" ] && [ "${INTEGRATION_HAS_TAG}" = "true" ] && [ "${BRANCH_EXISTS}" = "false" ]; then
              echo "INFO: release ${RELEASE_VERSION} already fully finalized; skipping."
              {
                echo "bamboo_skip_release=true"
                echo "bamboo_release_version=${RELEASE_VERSION}"
                echo "bamboo_release_branch=${RELEASE_BRANCH}"
                echo "bamboo_integration_branch=${INTEGRATION_BRANCH}"
              } > "${bamboo.build.working.directory}/skip.properties"
              exit 0
            fi

            if [ "${TAG_EXISTS}" = "true" ] && [ "${BRANCH_EXISTS}" = "false" ] && [ "${RELEASE_ARTIFACTS_EXIST}" = "true" ]; then
              echo "INFO: release ${RELEASE_VERSION} appears already finalized based on remote tag + missing release branch + full release artifacts; skipping."
              {
                echo "bamboo_skip_release=true"
                echo "bamboo_release_version=${RELEASE_VERSION}"
                echo "bamboo_release_branch=${RELEASE_BRANCH}"
                echo "bamboo_integration_branch=${INTEGRATION_BRANCH}"
              } > "${bamboo.build.working.directory}/skip.properties"
              exit 0
            fi

            if [ "${BRANCH_EXISTS}" != "true" ]; then
              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist and release is not proven finalized on ${INTEGRATION_BRANCH}."
              exit 1
            fi

            if ! git ls-remote --heads origin "refs/heads/${INTEGRATION_BRANCH}" | grep -q "refs/heads/${INTEGRATION_BRANCH}$"; then
              echo "ERROR: integration branch ${INTEGRATION_BRANCH} does not exist."
              exit 1
            fi

            echo "Finalize state validation passed."

    - inject-variables:
        file: skip.properties
        scope: LOCAL

    - script:
        interpreter: SHELL
        description: Merge release branch to integration branch, set release versions, tag, and push
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -euo pipefail
            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            SETTINGS_FILE="/tmp/settings-artifactory-${bamboo.buildResultKey}.xml"

            CURRENT_VERSION=$(/usr/share/maven/bin/mvn -B -q -DforceStdout -s "${SETTINGS_FILE}" help:evaluate -Dexpression=project.version 2>/dev/null | sed '/^\[/d' | grep -v '^$' | tail -1)
            [ -n "${CURRENT_VERSION}" ] || { echo "ERROR: could not determine Maven version"; exit 1; }

            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
            RELEASE_BRANCH="release/${RELEASE_VERSION}"
            RELEASE_TAG="${RELEASE_VERSION}"
            INTEGRATION_BRANCH="${bamboo.integration.branch}"

            git config user.name "bamboo"
            git config user.email "bamboo@local"

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            if ! git ls-remote --exit-code --heads origin "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
              echo "ERROR: release branch ${RELEASE_BRANCH} does not exist. Finish release cannot continue."
              exit 1
            fi

            if ! git ls-remote --exit-code --heads origin "refs/heads/${INTEGRATION_BRANCH}" >/dev/null 2>&1; then
              echo "ERROR: integration branch ${INTEGRATION_BRANCH} does not exist."
              exit 1
            fi

            git fetch origin \
              "+refs/heads/${INTEGRATION_BRANCH}:refs/remotes/origin/${INTEGRATION_BRANCH}" \
              "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" \
              "+refs/tags/*:refs/tags/*" \
              --prune >/dev/null 2>&1

            TAG_EXISTS=false
            TAG_ON_INTEGRATION=false

            if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              TAG_EXISTS=true
              TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}")"
              if git merge-base --is-ancestor "${TAG_COMMIT}" "refs/remotes/origin/${INTEGRATION_BRANCH}"; then
                TAG_ON_INTEGRATION=true
              fi
            fi

            if [ "${TAG_EXISTS}" = "true" ] && [ "${TAG_ON_INTEGRATION}" != "true" ]; then
              echo "ERROR: release tag ${RELEASE_TAG} already exists but is not contained in origin/${INTEGRATION_BRANCH}."
              exit 1
            fi

            git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}" >/dev/null 2>&1
            git checkout -B "${INTEGRATION_BRANCH}" "origin/${INTEGRATION_BRANCH}" >/dev/null 2>&1

            if git merge -s recursive -X theirs -m "Merge release branch ${RELEASE_BRANCH}" "${RELEASE_BRANCH}"; then
              echo "INFO: merge completed without manual conflict resolution"
            else
              echo "INFO: merge reported conflicts; resolving remaining conflicts in favor of ${RELEASE_BRANCH}"

              while IFS= read -r f; do
                code="$(git status --porcelain -- "$f" | awk '{print $1}')"
                case "$code" in
                  UD|DD)
                    git rm -f -- "$f"
                    ;;
                  DU|UU|AA|UA)
                    git checkout --theirs -- "$f" || true
                    git add -A -- "$f"
                    ;;
                  AU)
                    git rm -f -- "$f" || true
                    ;;
                  *)
                    echo "ERROR: unhandled merge conflict state ${code} for ${f}"
                    git status --short
                    exit 1
                    ;;
                esac
              done < <(git diff --name-only --diff-filter=U)

              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "ERROR: unresolved merge conflicts remain after auto-resolution"
                git status --short
                exit 1
              fi

              git commit --no-edit
            fi

            find . -type f -name "*.xml" -exec sed -i 's/-SNAPSHOT//g' {} +

            if ! git diff --quiet; then
              git commit -am "Release Versions"
            else
              echo "No SNAPSHOT versions found to remove before tagging"
            fi

            if [ "${TAG_EXISTS}" = "false" ]; then
              git tag "${RELEASE_TAG}"
            fi

            git push origin "${INTEGRATION_BRANCH}"

            if [ "${TAG_EXISTS}" = "false" ]; then
              git push origin "refs/tags/${RELEASE_TAG}"
            fi

    - inject-variables:
        file: skip.properties
        scope: LOCAL

    - script:
        interpreter: SHELL
        description: Delete release branch after successful finish
        working-dir: ${bamboo.module_name}
        scripts:
          - |
            set -uo pipefail

            if [ "${bamboo_inject_bamboo_skip_release:-false}" = "true" ]; then
              echo "INFO: release already finalized; skipping."
              exit 0
            fi

            export GIT_SSH_COMMAND='ssh -i /opt/bamboo-keys/bitbucket_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'

            RELEASE_VERSION="${bamboo_inject_bamboo_release_version:-}"
            RELEASE_BRANCH="${bamboo_inject_bamboo_release_branch:-}"

            if [ -z "${RELEASE_VERSION}" ] || [ -z "${RELEASE_BRANCH}" ]; then
              echo "WARNING: cleanup metadata missing from injected variables; skipping destructive cleanup."
              exit 0
            fi

            git remote set-url origin "${bamboo.planRepository.repositoryUrl}"

            TAG_EXISTS=false
            RELEASE_ARTIFACTS_EXIST=false
            found_count=0
            total_expected=2

            if git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" | grep -q "refs/tags/${RELEASE_VERSION}$"; then
              TAG_EXISTS=true
            fi

            AQL=$(cat <<EOF
            items.find({
              "repo":{"\$eq":"conexus-release-local"},
              "path":{"\$eq":"gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}"}
            }).include("name","repo","path")
            EOF
            )

            RESULT=$(curl -sku "sa_bamboo:${bamboo.artifactory_access_token_secret}" \
              -H "Content-Type: text/plain" \
              -X POST \
              "https://artifactory.mgmt.cnxs.vpcaas.fcs.gsa.gov/artifactory/api/search/aql" \
              --data "${AQL}" || true)

            found_count=$(python3 - <<PY
            import json
            raw = '''${RESULT}'''
            try:
                data = json.loads(raw) if raw.strip() else {}
            except Exception:
                print(0)
                raise SystemExit(0)
            items = {(item["path"], item["name"]) for item in data.get("results", [])}
            expected = [
                ("gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}", "reconciliation-war-${RELEASE_VERSION}.pom"),
                ("gov/gsa/cnxs/reconciliation/reconciliation-war/${RELEASE_VERSION}", "reconciliation-war-${RELEASE_VERSION}.war"),
            ]
            print(sum(1 for x in expected if x in items))
            PY
            )

            if [ "${found_count}" -eq "${total_expected}" ]; then
              RELEASE_ARTIFACTS_EXIST=true
            fi

            echo "INFO: tag_exists=${TAG_EXISTS}, release_artifacts_found=${found_count}"

            if [ "${TAG_EXISTS}" = "true" ] && [ "${RELEASE_ARTIFACTS_EXIST}" = "true" ]; then
              echo "INFO: final-state signals confirmed for ${RELEASE_VERSION}"

              if git ls-remote --heads origin "refs/heads/${RELEASE_BRANCH}" | grep -q "refs/heads/${RELEASE_BRANCH}$"; then
                echo "INFO: attempting best-effort deletion of ${RELEASE_BRANCH}"
                if git push origin --delete "${RELEASE_BRANCH}"; then
                  echo "INFO: deleted remote release branch ${RELEASE_BRANCH}"
                else
                  echo "WARNING: failed to delete remote release branch ${RELEASE_BRANCH}"
                  echo "WARNING: release remains successful because tag and full release artifacts exist."
                fi
              else
                echo "INFO: release branch ${RELEASE_BRANCH} already absent"
              fi

              exit 0
            fi

            echo "INFO: cleanup skipped because final-state signals are incomplete."
            exit 0

  artifact-subscriptions: []

variables:
  module_name: reconciliation
  maven.artifactId: reconciliation-parent
  maven.groupId: gov.gsa.cnxs.reconciliation
  integration.branch: main

repositories:
  - Reconciliation:
      scope: global
  - bamboo-deployment:
      scope: global

triggers: []

branches:
  create: manually
  delete: never
  link-to-jira: true

notifications: []

labels: []

dependencies:
  require-all-stages-passing: false
  enabled-for-branches: true
  block-strategy: none
  plans: []
