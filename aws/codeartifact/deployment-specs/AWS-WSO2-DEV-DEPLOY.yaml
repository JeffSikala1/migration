---
version: 2
deployment:
  name: WSO2 MI - Deploy to DEV EKS
  # Uses the WSO2 build plan that produces the image + .release.wso2
  source-plan: AWS-WSO2

release-naming:
  next-version-name: ${bamboo.inject.release_name}
  applies-to-branches: false
  auto-increment: false
  auto-increment-variables: []

environments:
  - DEV-EKS

DEV-EKS:
  description: Deploy WSO2 MI (wso2mi) to the DEV EKS cluster via GitOps (scripts repo)
  release-approval-prerequisite: none
  triggers: []
  tasks:
    - clean

    # 0) Checkout scripts repo (contains devvpc/k8s/wso2/run-wso2mi.yaml)
    - checkout:
        repository: scripts
        path: scripts
        force-clean-build: true
        description: Checkout scripts repo (K8s manifests)

    # Show checked-out branch/head (sanity)
    - script:
        interpreter: BINSH_OR_CMDEXE
        description: Show checked-out branch/head
        scripts:
          - |
            set -eu
            cd "${bamboo.build.working.directory}/scripts"
            git rev-parse --abbrev-ref HEAD
            git log -1 --oneline

    # 1) Pull the 'releases' artifact from the WSO2 build (contains .release.wso2)
    - artifact-download:
        artifacts:
          - name: releases

    # Sanity – SSH key for push is present
    - script:
        interpreter: BINSH_OR_CMDEXE
        description: Sanity – SSH key for push is present
        scripts:
          - |
            set -eu
            [ -s /home/bamboo/.ssh/id_argcdbb ] || { echo "ERROR: /home/bamboo/.ssh/id_argcdbb missing"; exit 1; }

    # GitOps: patch run-wso2mi.yaml image in scripts repo
    - script:
        description: GitOps - update WSO2 image (DEV) via scripts repo
        interpreter: BINSH_OR_CMDEXE
        scripts:
          - |
            #!/bin/sh
            set -eu
            ( set -o pipefail ) 2>/dev/null || true

            ROOT="${bamboo.build.working.directory}"
            WORKDIR="${ROOT}/scripts"
            REL_FILE="${ROOT}/bamboo-deployment/.release.wso2"

            if [ -s "$REL_FILE" ]; then
              TAG_WSO2="$(sed -n '1p' "$REL_FILE")"
            else
              TAG_WSO2="${bamboo.inject.release_name:-}"
            fi

            if [ -z "$TAG_WSO2" ]; then
              echo "ERROR: no WSO2 tag found in .release.wso2 or bamboo.inject.release_name"
              exit 3
            fi

            AWS_REGION="${bamboo.AWS_REGION}"
            AWS_ACCOUNT_ID="${bamboo.AWS_ACCOUNT_ID}"
            ECR="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            IMAGE="${ECR}/conexus-wso2mi:${TAG_WSO2}"

            YAML="${WORKDIR}/devvpc/k8s/wso2/run-wso2mi.yaml"
            [ -f "$YAML" ] || { echo "ERROR: target YAML not found: $YAML"; exit 2; }

            echo "[wso2] updating image in ${YAML} to ${IMAGE}"

            sed -E -i \
              's|(image:\s*)[0-9A-Za-z._:/-]*conexus-wso2mi:[^[:space:]]+|\1'"${IMAGE}"'|' \
              "$YAML"

            echo "[wso2] resulting image line:"
            grep -E 'image: .*conexus-wso2mi' "$YAML" || echo "[warn] image line not found?"

            export GIT_SSH_COMMAND='ssh -i /home/bamboo/.ssh/id_argcdbb -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            REAL_REMOTE="ssh://git@bitbucket.mgmt.cnxs.vpcaas.fcs.gsa.gov:7999/aw/scripts.git"
            REAL_BRANCH="develop"

            cd "$WORKDIR"
            git -c user.name="bamboo" -c user.email="bamboo@local" add "$YAML"

            if git diff --cached --quiet; then
              echo "No WSO2 YAML changes to commit"
              exit 0
            fi

            git -c user.name="bamboo" -c user.email="bamboo@local" commit -m "DEV WSO2: ${TAG_WSO2}"
            git remote remove origin >/dev/null 2>&1 || true
            git remote add origin "$REAL_REMOTE"
            git fetch origin "$REAL_BRANCH" || true
            git checkout -B "$REAL_BRANCH" || true
            git push origin HEAD:"$REAL_BRANCH"

            git remote -v
            git ls-remote origin "$REAL_BRANCH" | head -1 || echo "[warn] ls-remote failed"

    # Post-push sanity: show remote head
    - script:
        description: Show remote head
        interpreter: BINSH_OR_CMDEXE
        working-dir: scripts
        scripts:
          - |
            set -eu
            export GIT_SSH_COMMAND='ssh -i /home/bamboo/.ssh/id_argcdbb -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
            git remote -v
            git ls-remote origin develop | head -1 || echo "[warn] ls-remote failed"

  final-tasks: []
  variables:
    AWS_REGION: us-east-1
    AWS_ACCOUNT_ID: "339713019047"

  requirements: []
  notifications: []
